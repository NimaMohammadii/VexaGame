r down","invalid side"]))return predictText("chooseSide");if(predictErrorHas(m,["valid gram amount","invalid gram amount"]))return predictText("validAmount");if(predictErrorHas(m,["prediction not found","missing prediction id"]))return predictText("notFound");if(predictErrorHas(m,["gram/usd","start price","mark price","price snapshot","boundary price","price feed","invalid price","aster"]))return predictText("priceUpdating");if(predictErrorHas(m,["fok order was not fully matched","not enough liquidity","liquidity","order rejected"]))return predictText("liquidity");if(predictErrorHas(m,["temporarily unavailable","temporarily paused"]))return predictText("unavailable");if(predictErrorHas(m,["polymarket","http ","network","fetch","timeout","rate limit","429","allowance","collateral","api key","signature","signer"]))return predictText("unavailable");return predictText("generic")}
