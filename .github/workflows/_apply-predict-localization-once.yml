name: Apply Predict localization once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply validated Predict-only patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/_apply-predict-localization-once.yml'],
              text=True,
          )
          step = old.index('      - name: Patch Predict user errors only')
          start = old.index('        run: |\n', step) + len('        run: |\n')
          end = old.index('      - name: Commit Predict patch', start)
          block = old[start:end]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-predict.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-predict.sh
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"
      - name: Commit Predict patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_apply-predict-localization-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Localize Predict errors and add support contact"
          git push origin HEAD:main
