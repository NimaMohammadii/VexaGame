name: Temporary Predict production D1 diagnostics
on:
  push:
    branches:
      - diag/predict-rtds-live-20260913
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Cloudflare credential availability
        id: cf
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo 'available=true' >> "$GITHUB_OUTPUT"; echo 'Cloudflare token available'; else echo 'available=false' >> "$GITHUB_OUTPUT"; echo 'Cloudflare token unavailable'; fi
      - name: Install dependencies
        if: steps.cf.outputs.available == 'true'
        run: npm install --no-package-lock --legacy-peer-deps
      - name: Read Predict production D1 state only
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BOOTSTRAP ERRORS ==='
          npx wrangler d1 execute vexa-games --remote --command "SELECT round_id, market, lease_until_ms, retry_after_ms, last_error, updated_at FROM predict_round_bootstrap ORDER BY updated_at DESC LIMIT 20;"
          echo '=== RECENT BITCOIN ROUNDS ==='
          npx wrangler d1 execute vexa-games --remote --command "SELECT id, starts_at, ends_at, start_price, status, created_at FROM predict_rounds WHERE market='bitcoin' AND datetime(ends_at) > datetime('now','-3 hours') ORDER BY datetime(starts_at) DESC LIMIT 30;"
          echo '=== RECENT POLYMARKET ROUND METADATA ==='
          npx wrangler d1 execute vexa-games --remote --command "SELECT round_id, slug, rtds_topic, updated_at FROM predict_polymarket_rounds WHERE round_id LIKE 'pr_bitcoin_%' ORDER BY updated_at DESC LIMIT 30;"
