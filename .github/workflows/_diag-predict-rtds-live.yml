name: Temporary Predict start-price diagnostics
on:
  push:
    branches:
      - diag/predict-rtds-live-20260913
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print exact Polymarket start-price implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== LOCATIONS ==='
          grep -n "startPriceRequests\|START_PRICE_CACHE_SECONDS\|fetchPolymarketBitcoinStartPrice\|fetchPolymarketBitcoinStartPriceOnce\|start price" src/predict-polymarket.ts | head -80
          for fn in fetchPolymarketBitcoinStartPrice fetchPolymarketBitcoinStartPriceOnce loadPolymarketBitcoinMarket; do
            START=$(grep -n "function ${fn}\|function ${fn}<\|${fn}(" src/predict-polymarket.ts | head -1 | cut -d: -f1 || true)
            if [ -n "$START" ]; then END=$((START+90)); echo "=== $fn $START-$END ==="; sed -n "${START},${END}p" src/predict-polymarket.ts; fi
          done
