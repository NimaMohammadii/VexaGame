name: Temporary Predict timeframe invariant diagnostics
on:
  push:
    branches:
      - diag/predict-rtds-live-20260913
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect every Bitcoin timeframe and long round assumption
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CLIENT bitcoinTimeframe ==='
          grep -n "bitcoinTimeframe" src/miniapp/predict-zone.ts || true
          echo '=== SERVER timeframe helpers ==='
          grep -n "normalizeBitcoinTimeframe\|bitcoinRoundMs\|bitcoinTimeframeForWindow\|pr_bitcoin_\|15m\|1h" src/predict-routes.ts | head -220 || true
          echo '=== OTHER ROUND-ID ASSUMPTIONS ==='
          grep -RIn "pr_bitcoin_\|cleanPredictRoundId\|roundId.*bitcoin" src --exclude='predict-routes.ts' --exclude='predict-zone.ts' | head -220 || true
