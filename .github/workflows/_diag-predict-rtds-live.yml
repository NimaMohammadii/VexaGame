name: Temporary Predict deep round diagnostics
on:
  push:
    branches:
      - diag/predict-rtds-live-20260913
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print exact round/bootstrap implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== LOCATIONS ==='
          grep -n "async function getOrCreateCurrentRound\|async function claimPredictRoundBootstrap\|async function deferPredictRoundBootstrap\|async function clearPredictRoundBootstrap\|function bitcoinTimeframeForWindow" src/predict-routes.ts
          START=$(grep -n "async function getOrCreateCurrentRound" src/predict-routes.ts | head -1 | cut -d: -f1)
          END=$((START+115))
          echo "=== getOrCreateCurrentRound ${START}-${END} ==="
          sed -n "${START},${END}p" src/predict-routes.ts
          BSTART=$(grep -n "async function claimPredictRoundBootstrap" src/predict-routes.ts | head -1 | cut -d: -f1)
          BEND=$((BSTART+60))
          echo "=== bootstrap ${BSTART}-${BEND} ==="
          sed -n "${BSTART},${BEND}p" src/predict-routes.ts
          echo '=== client timeframe/state functions ==='
          grep -n "function hasReusableRound\|function selectMarket\|timeframeSelect.addEventListener\|function syncRound\|function scheduleRoundRetry\|function resumeRoundSync" src/miniapp/predict-zone.ts
