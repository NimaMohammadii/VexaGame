name: Temporary Predict scheduled recovery diagnostics
on:
  push:
    branches:
      - diag/predict-rtds-live-20260913
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect scheduled Predict owner path
        shell: bash
        run: |
          set -euo pipefail
          grep -n "runPredictScheduledSettlement" src/predict-routes.ts src/index-with-plinko-live.ts || true
          LINE=$(grep -n "runPredictScheduledSettlement" src/predict-routes.ts | head -1 | cut -d: -f1 || true)
          if [ -n "$LINE" ]; then START=$((LINE-20)); [ "$START" -lt 1 ] && START=1; END=$((LINE+70)); sed -n "${START},${END}p" src/predict-routes.ts; fi
