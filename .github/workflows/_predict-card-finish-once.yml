name: Apply final Predict card refinements once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply final Predict card refinements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refine only existing Predict card styles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/predict-zone.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          # Start/Live: keep dimensions/content but use the same card container behavior as Up/Down.
          replace_once(
              '.predict-zone-live-meta>div{height:48px!important;padding:8px 11px!important;border:0!important;',
              '.predict-zone-live-meta>div{position:relative!important;overflow:hidden!important;height:48px!important;padding:8px 11px!important;border:0!important;',
              'Start/Live card container',
          )

          # Selected state belongs only to the two action buttons; do not dim history cards that reuse predict-zone-choice.
          replace_once(
              '-webkit-tap-highlight-color:transparent!important;opacity:.58!important;filter:brightness(.86)!important;transition:transform .18s ease,opacity .18s ease,filter .18s ease!important}',
              '-webkit-tap-highlight-color:transparent!important;transition:transform .18s ease,opacity .18s ease,filter .18s ease!important}',
              'global choice opacity/filter',
          )
          replace_once(
              '.predict-zone-choice.selected:not(:disabled){opacity:1!important;filter:brightness(1.08)!important}',
              '.predict-zone-actions .predict-zone-choice{opacity:.58!important;filter:brightness(.86)!important}.predict-zone-actions .predict-zone-choice.selected:not(:disabled){opacity:1!important;filter:brightness(1.08)!important}',
              'scoped selected state',
          )

          # Edit already shares the exact preset card material; match its foreground treatment too.
          replace_once(
              '.predict-zone-preset-edit{font-size:10.5px!important;font-weight:800!important;color:rgba(255,255,255,.58)!important}.predict-zone-preset-edit.is-editing{color:rgba(255,255,255,.92)!important}',
              '.predict-zone-preset-edit{font-size:10.5px!important;font-weight:800!important;color:#fff!important}.predict-zone-preset-edit.is-editing{color:#fff!important}',
              'Edit foreground',
          )

          # The amount → win format was already correct on current main; verify it and leave the JS path untouched.
          if text.count("rawAmount+' → '+(quote?'—':'…')") != 1 or text.count("rawAmount+' → </span>") != 1:
              raise SystemExit('Current amount → win format changed unexpectedly')
          if ' - → - ' in text:
              raise SystemExit('Old hyphenated quote format remains')

          # Guard the single existing submit/backend path.
          if text.count('function submitBet(amount)') != 1:
              raise SystemExit('Predict submit path is not singular')
          if text.count("fetch(eventMode?'/app/api/prediction-events/bet':'/app/api/predict-bet'") != 1:
              raise SystemExit('Predict backend path changed or duplicated')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate generated Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/miniapp/predict-zone.ts', 'utf8');
          const marker = 'export const PREDICT_ZONE_SCRIPT = `';
          const start = src.indexOf(marker);
          if (start < 0) throw new Error('PREDICT_ZONE_SCRIPT marker missing');
          const bodyStart = start + marker.length;
          const end = src.indexOf('\n`;', bodyStart);
          if (end < 0) throw new Error('PREDICT_ZONE_SCRIPT end missing');
          const raw = src.slice(bodyStart, end);
          const cooked = Function('PREDICT_ERROR_TEXTS', 'return `' + raw + '`;')({en:{}});
          new Function(cooked);
          console.log('Predict browser script parses');
          NODE

      - name: Commit only Predict owner and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/_predict-card-finish-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Finish Predict card selection styling"
          git push origin HEAD:main
