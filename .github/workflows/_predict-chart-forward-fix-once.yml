name: Apply simple Predict chart motion fix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply simple Predict chart motion fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild authoritative Predict chart motion simply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/predict-zone.ts')
          original = path.read_text(encoding='utf-8')
          text = original

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "bitcoin:{label:'Bitcoin',question:'Bitcoin up or down? · 5M',stream:'wss://fstream.asterdex.com/ws/btcusdt@markPrice@1s',decimals:0,step:5,chartMinRatio:.0015,symbol:'₿'}",
              "bitcoin:{label:'Bitcoin',question:'Bitcoin up or down? · 5M',stream:'wss://fstream.asterdex.com/ws/btcusdt@markPrice@1s',decimals:0,step:5,axisStep:10,symbol:'₿'}",
              'Bitcoin fixed $10 axis',
          )
          replace_once(
              'scaleMin=0,scaleMax=0,scaleFrameAt=0,axisTickStep=0,readyPrice=false',
              'scaleMin=0,scaleMax=0,scaleFrameAt=0,chartStartedAt=0,readyPrice=false',
              'chart start state',
          )
          replace_once(
              'var W=360,H=220,L=0,R=80,P=18,HISTORY=128,SLIDING_HISTORY=23,SAMPLE_MS=2800;',
              'var W=360,H=220,L=0,R=80,P=18,HISTORY=23,SAMPLE_MS=2800;',
              'simple chart window',
          )

          lines = text.splitlines()
          out = []
          replaced = {key: 0 for key in ['priceTicks','autoScale','renderPriceTicks','showLoading','seed','draw','resumeChartTimeline','selectMarket']}
          removed = {'chartRoundRange': 0, 'chartRawPoints': 0}

          replacements = {
              'priceTicks': "    function priceTicks(scale){var c=cfg(),maxCount=axisCapacity(),span=scale.max-scale.min,fixedStep=Number(c.axisStep||0),quantum=Math.max(c.step,Math.pow(10,-Math.max(0,c.decimals))),precision=Math.max(0,c.decimals+4),plotPx=axisPixelHeight(),minGap=axisMinGap(),minStepByPixels=span*(minGap/Math.max(1,plotPx)),step,first,v,ticks=[],attempt;if(fixedStep>0){first=Math.floor(scale.min/fixedStep)*fixedStep-fixedStep;for(v=first;v<=scale.max+fixedStep*1.000001&&ticks.length<maxCount+1;v+=fixedStep)ticks.push(Number(v.toFixed(precision)));return ticks}step=Math.max(quantum,niceTickStep(span,Math.max(1,maxCount-1)),minStepByPixels);step=Math.ceil((step-1e-12)/quantum)*quantum;for(attempt=0;attempt<8;attempt++){first=Math.ceil(scale.min/step)*step;ticks=[];for(v=first;v<=scale.max+step*1e-9&&ticks.length<32;v+=step)ticks.push(Number(v.toFixed(precision)));if(ticks.length>=2&&ticks.length<=maxCount)return ticks;step=Math.ceil((step*1.35-1e-12)/quantum)*quantum}return ticks.slice(0,maxCount)}",
              'autoScale': "    function autoScale(prices){var frameNow=motionNow(),elapsed=scaleFrameAt?Math.min(64,Math.max(0,frameNow-scaleFrameAt)):32;scaleFrameAt=frameNow;var c=cfg(),fixedStep=Number(c.axisStep||0),valid=prices.filter(function(v){return isFinite(v)&&v>0}),precision=Math.pow(10,-Math.max(0,c.decimals)),minSpan,min,max,span,mid,pad,targetMin,targetMax,outward,alpha,actualSpan,axisSpan,price,innerMin,innerMax,nextMin;if(fixedStep>0){axisSpan=fixedStep*(axisCapacity()-1);price=Number(current||last||0);if(!isFinite(price)||price<=0)price=Number(valid[valid.length-1]||1);if(!scaleMin||!scaleMax){nextMin=Math.floor((price-axisSpan/2)/fixedStep)*fixedStep;scaleMin=nextMin;scaleMax=nextMin+axisSpan;return{min:scaleMin,max:scaleMax}}innerMin=scaleMin+axisSpan*.25;innerMax=scaleMax-axisSpan*.25;if(price<innerMin||price>innerMax){nextMin=Math.floor((price-axisSpan/2)/fixedStep)*fixedStep;scaleMin+=(nextMin-scaleMin)*(1-Math.exp(-elapsed/420));scaleMax=scaleMin+axisSpan}return{min:scaleMin,max:scaleMax}}minSpan=Math.max(c.step*8,precision*8);if(!valid.length)valid.push(Number(current||last||1));min=Math.min.apply(Math,valid);max=Math.max.apply(Math,valid);span=max-min;if(!isFinite(span)||span<minSpan){mid=(min+max)/2;min=mid-minSpan/2;max=mid+minSpan/2;span=minSpan}pad=Math.max(span*.22,c.step*1.15);targetMin=min-pad;targetMax=max+pad;if(!scaleMin||!scaleMax){scaleMin=targetMin;scaleMax=targetMax;return{min:scaleMin,max:scaleMax}}outward=targetMin<scaleMin||targetMax>scaleMax;alpha=1-Math.exp(-elapsed/(outward?460:1260));scaleMin+=(targetMin-scaleMin)*alpha;scaleMax+=(targetMax-scaleMax)*alpha;actualSpan=scaleMax-scaleMin;if(!isFinite(actualSpan)||actualSpan<minSpan){mid=(scaleMin+scaleMax)/2;scaleMin=mid-minSpan/2;scaleMax=mid+minSpan/2}return{min:scaleMin,max:scaleMax}}",
              'renderPriceTicks': "    function renderPriceTicks(scale,ticks){if(!axisLayer||!gridLayer)return;var max=axisCapacity()+2,label,lineEl,i,j,slot,top,text,key,oldValue,used={};while(axisLayer.children.length<max){label=document.createElement('span');label.style.opacity='0';axisLayer.appendChild(label)}while(gridLayer.children.length<max){lineEl=document.createElement('span');lineEl.style.opacity='0';gridLayer.appendChild(lineEl)}for(i=0;i<ticks.length&&i<max;i++){key=String(ticks[i]);slot=-1;for(j=0;j<max;j++){if(!used[j]&&axisLayer.children[j].dataset.tickValue===key){slot=j;break}}if(slot<0){for(j=0;j<max;j++){if(!used[j]&&axisLayer.children[j].style.opacity!=='1'){slot=j;break}}}if(slot<0){for(j=0;j<max;j++){if(!used[j]){slot=j;break}}}if(slot<0)continue;used[slot]=1;label=axisLayer.children[slot];lineEl=gridLayer.children[slot];label.dataset.tickValue=key;lineEl.dataset.tickValue=key;top=y(ticks[i],scale)/H*100+'%';text=formatPrice(ticks[i]);if(label.textContent!==text)label.textContent=text;if(label.style.top!==top)label.style.top=top;if(lineEl.style.top!==top)lineEl.style.top=top;if(label.style.opacity!=='1')label.style.opacity='1';if(lineEl.style.opacity!=='1')lineEl.style.opacity='1'}for(i=0;i<max;i++){if(used[i])continue;label=axisLayer.children[i];lineEl=gridLayer.children[i];oldValue=Number(label.dataset.tickValue);if(isFinite(oldValue)){top=y(oldValue,scale)/H*100+'%';if(label.style.top!==top)label.style.top=top;if(lineEl.style.top!==top)lineEl.style.top=top}if(label.style.opacity!=='0')label.style.opacity='0';if(lineEl.style.opacity!=='0')lineEl.style.opacity='0'}}",
              'showLoading': "    function showLoading(){readyPrice=false;priceTarget=0;scaleMin=0;scaleMax=0;scaleFrameAt=0;chartStartedAt=0;historyHydrated=false;setTrend('flat');if(chart)chart.classList.remove('ready');resetMarketPrice(live,'Loading');resetMarketPrice(start,'Loading');if(trendLabel)trendLabel.textContent='Waiting for price';if(axisLayer)axisLayer.textContent='';if(gridLayer)gridLayer.textContent='';if(startGuide)startGuide.classList.remove('show');if(startTarget){startTarget.classList.remove('show','above','below');startTarget.textContent=''}syncBetAvailability()}",
              'seed': "    function seed(price){var i,now=Date.now();if(market==='bitcoin'){values=[price];sampleTimes=[now];lastPointAt=now;chartStartedAt=now;historyHydrated=true}else{chartStartedAt=0;if(!hydrateChartHistory(historyValues,now)){values=[];for(i=0;i<HISTORY;i++)values.push(price);sampleTimes=values.map(function(_,index){return now-(values.length-index)*SAMPLE_MS});lastPointAt=now;historyHydrated=false}}current=price;last=price;raw=price;priceTarget=price;scaleMin=0;scaleMax=0;scaleFrameAt=0}",
              'draw': "    function draw(){if(!readyPrice||!values.length||!line||!fill||eventMode)return;var right=W-R,step=(W-L-R)/HISTORY,now=Date.now(),rawPts,visibleRaw,windowStart,headX,lastRaw;if(market==='bitcoin'){if(!chartStartedAt)chartStartedAt=Number(sampleTimes[0]||now);windowStart=Math.max(chartStartedAt,now-HISTORY*SAMPLE_MS);rawPts=values.map(function(v,i){return{x:L+(Number(sampleTimes[i])-windowStart)/SAMPLE_MS*step,v:v}});headX=Math.min(right,L+(now-windowStart)/SAMPLE_MS*step);lastRaw=rawPts[rawPts.length-1];if(lastRaw&&headX<=lastRaw.x+2)lastRaw.v=current;else rawPts.push({x:headX,v:current});visibleRaw=clipVisible(rawPts,right)}else{rawPts=values.map(function(v,i){return{x:right-(now-sampleTimes[i])/SAMPLE_MS*step,v:v}});rawPts.push({x:right,v:current});visibleRaw=clipVisible(rawPts,right)}var scale=autoScale(visibleRaw.map(function(p){return p.v})),ticks=priceTicks(scale),visible=visibleRaw.map(function(p){return{x:p.x,y:y(p.v,scale),v:p.v}}),d=visible.length>1?path(visible):'',first=visible[0],lastPoint=visible[visible.length-1],xp=lastPoint.x/W*100,yp=lastPoint.y/H*100;line.setAttribute('d',d);fill.setAttribute('d',d?d+' L '+lastPoint.x.toFixed(1)+' '+H+' L '+first.x.toFixed(1)+' '+H+' Z':'');if(dot){var left=xp+'%',top=yp+'%';if(dot.style.left!==left)dot.style.left=left;if(dot.style.top!==top)dot.style.top=top}if(guide){var guideTop=yp+'%';if(guide.style.top!==guideTop)guide.style.top=guideTop}renderPriceTicks(scale,ticks);updateStartMarker(scale);if(start&&entry)renderMarketPrice(start,entry)}",
              'resumeChartTimeline': "    function resumeChartTimeline(){if(!chartSuspendedAt)return;var now=Date.now(),gap=Math.max(0,now-chartSuspendedAt);chartSuspendedAt=0;if(gap>0&&sampleTimes.length){sampleTimes=sampleTimes.map(function(t){return Number(t)+gap});if(lastPointAt)lastPointAt+=gap;if(chartStartedAt)chartStartedAt+=gap}if(gap>120)chartResumeEaseUntil=now+900;scaleFrameAt=motionNow();chartMotionFrame=0}",
          }

          for line in lines:
              if line.startswith('    function priceTicks(scale){'):
                  out.append(replacements['priceTicks']); replaced['priceTicks'] += 1; continue
              if line.startswith('    function autoScale(prices){'):
                  out.append(replacements['autoScale']); replaced['autoScale'] += 1; continue
              if line.startswith('    function renderPriceTicks(scale,ticks){'):
                  out.append(replacements['renderPriceTicks']); replaced['renderPriceTicks'] += 1; continue
              if line.startswith('    function chartRoundRange(){'):
                  removed['chartRoundRange'] += 1; continue
              if line.startswith('    function chartRawPoints(now,right){'):
                  removed['chartRawPoints'] += 1; continue
              if line.startswith('    function showLoading(){'):
                  out.append(replacements['showLoading']); replaced['showLoading'] += 1; continue
              if line.startswith('    function seed(price){'):
                  out.append(replacements['seed']); replaced['seed'] += 1; continue
              if line.startswith('    function draw(){'):
                  out.append(replacements['draw']); replaced['draw'] += 1; continue
              if line.startswith('    function resumeChartTimeline(){'):
                  out.append(replacements['resumeChartTimeline']); replaced['resumeChartTimeline'] += 1; continue
              if line.startswith('    function selectMarket(id){'):
                  marker='scaleMin=0;scaleMax=0;scaleFrameAt=0;entry=0;'
                  if line.count(marker) != 1:
                      raise SystemExit('selectMarket reset anchor changed; refusing to guess')
                  out.append(line.replace(marker,'scaleMin=0;scaleMax=0;scaleFrameAt=0;chartStartedAt=0;entry=0;',1))
                  replaced['selectMarket'] += 1; continue
              out.append(line)

          if any(count != 1 for count in replaced.values()):
              raise SystemExit('replacement mismatch: ' + repr(replaced))
          if any(count != 1 for count in removed.values()):
              raise SystemExit('removal mismatch: ' + repr(removed))

          text = '\n'.join(out) + ('\n' if original.endswith('\n') else '')

          checks = {
              'axisStep10': text.count('axisStep:10'),
              'chartStartedAt state': text.count('chartStartedAt=0,readyPrice=false'),
              'simple window': text.count('HISTORY=23,SAMPLE_MS=2800'),
              'draw': text.count('function draw()'),
              'submitBet': text.count('function submitBet(amount)'),
              'bet API': text.count("fetch(eventMode?'/app/api/prediction-events/bet':'/app/api/predict-bet'"),
          }
          if any(value != 1 for value in checks.values()):
              raise SystemExit('single-path validation failed: ' + repr(checks))
          forbidden = ['chartMinRatio', 'axisTickStep', 'SLIDING_HISTORY', 'function chartRoundRange()', 'function chartRawPoints(now,right)']
          for token in forbidden:
              if token in text:
                  raise SystemExit('old/extra chart path remains: ' + token)
          if "if(market==='bitcoin'){values=[price];sampleTimes=[now];lastPointAt=now;chartStartedAt=now;historyHydrated=true}" not in text:
              raise SystemExit('Bitcoin must start as one clean point')
          if "headX<=lastRaw.x+2" not in text or "d=visible.length>1?path(visible):''" not in text:
              raise SystemExit('vertical-start guard missing')
          if 'windowStart=Math.max(chartStartedAt,now-HISTORY*SAMPLE_MS)' not in text:
              raise SystemExit('forward timeline window missing')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate emitted Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/miniapp/predict-zone.ts', 'utf8');
          const marker = 'export const PREDICT_ZONE_SCRIPT = `';
          const start = src.indexOf(marker);
          if (start < 0) throw new Error('PREDICT_ZONE_SCRIPT marker missing');
          const bodyStart = start + marker.length;
          const end = src.indexOf('\n`;', bodyStart);
          if (end < 0) throw new Error('PREDICT_ZONE_SCRIPT end missing');
          const raw = src.slice(bodyStart, end);
          const cooked = Function('PREDICT_ERROR_TEXTS', 'return `' + raw + '`;')({en:{}});
          new Function(cooked);
          if (!src.includes('axisStep:10')) throw new Error('Bitcoin $10 axis missing');
          if (src.includes('chartRoundRange') || src.includes('chartMinRatio')) throw new Error('old chart camera path remains');
          console.log('Predict simple forward chart validation OK');
          NODE

      - name: Commit only Predict owner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"
          git commit -m "Rebuild Predict chart as simple forward motion"
          git push origin HEAD:main
