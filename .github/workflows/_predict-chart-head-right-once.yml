# one-shot patch runner
name: Apply Predict chart head position fix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Predict chart head position fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Move Predict chart head to the front
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/miniapp/predict-zone.ts')
          s=p.read_text(encoding='utf-8')
          old=s

          def one(a,b,label):
              global s
              n=s.count(a)
              if n!=1: raise SystemExit(f'{label}: expected 1, found {n}')
              s=s.replace(a,b,1)

          one('scaleMin=0,scaleMax=0,scaleFrameAt=0,chartStartedAt=0,readyPrice=false','scaleMin=0,scaleMax=0,scaleFrameAt=0,readyPrice=false','remove chart start state')
          one("function showLoading(){readyPrice=false;priceTarget=0;scaleMin=0;scaleMax=0;scaleFrameAt=0;chartStartedAt=0;historyHydrated=false;","function showLoading(){readyPrice=false;priceTarget=0;scaleMin=0;scaleMax=0;scaleFrameAt=0;historyHydrated=false;",'loading reset')
          one("function seed(price){var i,now=Date.now();if(market==='bitcoin'){values=[price];sampleTimes=[now];lastPointAt=now;chartStartedAt=now;historyHydrated=true}else{chartStartedAt=0;if(!hydrateChartHistory(historyValues,now)){values=[];for(i=0;i<HISTORY;i++)values.push(price);sampleTimes=values.map(function(_,index){return now-(values.length-index)*SAMPLE_MS});lastPointAt=now;historyHydrated=false}}current=price;last=price;raw=price;priceTarget=price;scaleMin=0;scaleMax=0;scaleFrameAt=0}","function seed(price){var i,now=Date.now();if(market==='bitcoin'){values=[price];sampleTimes=[now];lastPointAt=now;historyHydrated=true}else if(!hydrateChartHistory(historyValues,now)){values=[];for(i=0;i<HISTORY;i++)values.push(price);sampleTimes=values.map(function(_,index){return now-(values.length-index)*SAMPLE_MS});lastPointAt=now;historyHydrated=false}current=price;last=price;raw=price;priceTarget=price;scaleMin=0;scaleMax=0;scaleFrameAt=0}",'seed')

          lines=s.splitlines()
          out=[]
          replaced=0
          newdraw="    function draw(){if(!readyPrice||!values.length||!line||!fill||eventMode)return;var right=W-R,step=(W-L-R)/HISTORY,now=Date.now(),rawPts=values.map(function(v,i){return{x:right-(now-sampleTimes[i])/SAMPLE_MS*step,v:v}}),lastRaw=rawPts[rawPts.length-1];if(lastRaw&&right-lastRaw.x<2)lastRaw.v=current;else rawPts.push({x:right,v:current});var visibleRaw=clipVisible(rawPts,right),scale=autoScale(visibleRaw.map(function(p){return p.v})),ticks=priceTicks(scale),visible=visibleRaw.map(function(p){return{x:p.x,y:y(p.v,scale),v:p.v}}),d=visible.length>1?path(visible):'',first=visible[0],lastPoint=visible[visible.length-1],xp=lastPoint.x/W*100,yp=lastPoint.y/H*100;line.setAttribute('d',d);fill.setAttribute('d',d?d+' L '+lastPoint.x.toFixed(1)+' '+H+' L '+first.x.toFixed(1)+' '+H+' Z':'');if(dot){var left=xp+'%',top=yp+'%';if(dot.style.left!==left)dot.style.left=left;if(dot.style.top!==top)dot.style.top=top}if(guide){var guideTop=yp+'%';if(guide.style.top!==guideTop)guide.style.top=guideTop}renderPriceTicks(scale,ticks);updateStartMarker(scale);if(start&&entry)renderMarketPrice(start,entry)}"
          for line in lines:
              if line.startswith('    function draw(){'):
                  out.append(newdraw); replaced+=1; continue
              if line.startswith('    function resumeChartTimeline(){'):
                  line=line.replace('if(lastPointAt)lastPointAt+=gap;if(chartStartedAt)chartStartedAt+=gap','if(lastPointAt)lastPointAt+=gap')
              if line.startswith('    function selectMarket(id){'):
                  line=line.replace('scaleMin=0;scaleMax=0;scaleFrameAt=0;chartStartedAt=0;entry=0;','scaleMin=0;scaleMax=0;scaleFrameAt=0;entry=0;')
              out.append(line)
          if replaced!=1: raise SystemExit(f'draw expected 1, found {replaced}')
          s='\n'.join(out)+('\n' if old.endswith('\n') else '')
          if 'chartStartedAt' in s: raise SystemExit('old chart start path remains')
          if "rawPts.push({x:right,v:current})" not in s: raise SystemExit('front head missing')
          if "right-lastRaw.x<2" not in s: raise SystemExit('vertical-start guard missing')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check -- src/miniapp/predict-zone.ts
      - name: Validate emitted Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('src/miniapp/predict-zone.ts','utf8');
          const marker='export const PREDICT_ZONE_SCRIPT = `';
          const a=src.indexOf(marker); if(a<0) throw new Error('script marker missing');
          const b=a+marker.length, e=src.indexOf('\n`;',b); if(e<0) throw new Error('script end missing');
          const raw=src.slice(b,e);
          const cooked=Function('PREDICT_ERROR_TEXTS','return `'+raw+'`;')({en:{}});
          new Function(cooked);
          console.log('Predict chart head validation OK');
          NODE
      - name: Commit authoritative Predict change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/_predict-chart-head-right-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Keep Predict chart head at the front"
          git push origin HEAD:main
