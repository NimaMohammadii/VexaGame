name: Apply Predict chart root fix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Predict chart root fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fix authoritative Predict chart timeline and axis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/predict-zone.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          # Bitcoin must use the full 5-minute round as its horizontal viewport and a
          # dynamic vertical range. The old fixed $10 tick / $40 viewport was the
          # camera-following behavior the UI was showing.
          replace_once(
              "bitcoin:{label:'Bitcoin',question:'Bitcoin up or down? · 5M',stream:'wss://fstream.asterdex.com/ws/btcusdt@markPrice@1s',decimals:0,step:5,axisStep:10,symbol:'₿'}",
              "bitcoin:{label:'Bitcoin',question:'Bitcoin up or down? · 5M',stream:'wss://fstream.asterdex.com/ws/btcusdt@markPrice@1s',decimals:0,step:5,chartMinRatio:.0015,symbol:'₿'}",
              'Bitcoin chart config',
          )
          replace_once(
              "scaleMin=0,scaleMax=0,scaleFrameAt=0,readyPrice=false",
              "scaleMin=0,scaleMax=0,scaleFrameAt=0,axisTickStep=0,readyPrice=false",
              'axis tick state',
          )
          replace_once(
              "var W=360,H=220,L=0,R=80,P=18,HISTORY=23,SAMPLE_MS=2800;",
              "var W=360,H=220,L=0,R=80,P=18,HISTORY=128,SLIDING_HISTORY=23,SAMPLE_MS=2800;",
              'chart sample capacity',
          )

          # Keep tick movement tied to the RAF-rendered scale. Opacity animates when
          # tick sets enter/leave; we do not add a second CSS movement path.
          old_transition = 'transition:opacity .18s ease!important;will-change:top'
          if text.count(old_transition) != 2:
              raise SystemExit(f'axis transition anchors: expected 2, found {text.count(old_transition)}')
          text = text.replace(old_transition, 'transition:opacity .24s ease!important;will-change:top,opacity')

          lines = text.splitlines()
          out = []
          replaced = {key: 0 for key in ['priceTicks','autoScale','renderPriceTicks','showLoading','seed','draw','resumeChartTimeline']}
          inserted_timeline = 0

          new_price_ticks = "    function priceTicks(scale){var c=cfg(),maxCount=axisCapacity(),span=scale.max-scale.min,fixedStep=Number(c.axisStep||0),quantum=Math.max(c.step,Math.pow(10,-Math.max(0,c.decimals))),precision=Math.max(0,c.decimals+4),plotPx=axisPixelHeight(),minGap=axisMinGap(),minStepByPixels=span*(minGap/Math.max(1,plotPx)),step,desiredStep,first,v,ticks=[],attempt;if(fixedStep>0){first=Math.floor(scale.min/fixedStep)*fixedStep-fixedStep;for(v=first;v<=scale.max+fixedStep*1.000001&&ticks.length<maxCount+1;v+=fixedStep)ticks.push(Number(v.toFixed(precision)));return ticks}desiredStep=Math.max(quantum,niceTickStep(span,Math.max(1,maxCount-1)),minStepByPixels);desiredStep=Math.ceil((desiredStep-1e-12)/quantum)*quantum;step=desiredStep;if(market==='bitcoin'&&axisTickStep>0&&desiredStep>=axisTickStep*.68&&desiredStep<=axisTickStep*1.5)step=axisTickStep;for(attempt=0;attempt<8;attempt++){first=Math.ceil(scale.min/step)*step;ticks=[];for(v=first;v<=scale.max+step*1e-9&&ticks.length<32;v+=step)ticks.push(Number(v.toFixed(precision)));if(ticks.length>=2&&ticks.length<=maxCount){if(market==='bitcoin')axisTickStep=step;return ticks}step=Math.ceil((step*1.35-1e-12)/quantum)*quantum}if(market==='bitcoin')axisTickStep=step;return ticks.slice(0,maxCount)}"

          new_auto_scale = "    function autoScale(prices){var frameNow=motionNow(),elapsed=scaleFrameAt?Math.min(64,Math.max(0,frameNow-scaleFrameAt)):32;scaleFrameAt=frameNow;var c=cfg(),fixedStep=Number(c.axisStep||0),valid=prices.filter(function(v){return isFinite(v)&&v>0}),precision=Math.pow(10,-Math.max(0,c.decimals)),minSpan,min,max,span,mid,pad,targetMin,targetMax,outward,alpha,actualSpan,axisSpan,price,innerMin,innerMax,nextMin,reference;if(fixedStep>0){axisSpan=fixedStep*(axisCapacity()-1);price=Number(current||last||0);if(!isFinite(price)||price<=0)price=Number(valid[valid.length-1]||1);if(!scaleMin||!scaleMax){nextMin=Math.floor((price-axisSpan/2)/fixedStep)*fixedStep;scaleMin=nextMin;scaleMax=nextMin+axisSpan;return{min:scaleMin,max:scaleMax}}innerMin=scaleMin+axisSpan*.25;innerMax=scaleMax-axisSpan*.25;if(price<innerMin||price>innerMax){nextMin=Math.floor((price-axisSpan/2)/fixedStep)*fixedStep;scaleMin+=(nextMin-scaleMin)*(1-Math.exp(-elapsed/420));scaleMax=scaleMin+axisSpan}return{min:scaleMin,max:scaleMax}}reference=Math.max(Number(current||last||0),Number(entry||0),Number(valid[valid.length-1]||0));minSpan=Math.max(c.step*8,precision*8,reference*Math.max(0,Number(c.chartMinRatio)||0));if(!valid.length)valid.push(Number(current||last||1));min=Math.min.apply(Math,valid);max=Math.max.apply(Math,valid);span=max-min;if(!isFinite(span)||span<minSpan){mid=(min+max)/2;min=mid-minSpan/2;max=mid+minSpan/2;span=minSpan}pad=Math.max(span*.22,c.step*1.15);targetMin=min-pad;targetMax=max+pad;if(!scaleMin||!scaleMax){scaleMin=targetMin;scaleMax=targetMax;return{min:scaleMin,max:scaleMax}}outward=targetMin<scaleMin||targetMax>scaleMax;alpha=1-Math.exp(-elapsed/(outward?420:1800));scaleMin+=(targetMin-scaleMin)*alpha;scaleMax+=(targetMax-scaleMax)*alpha;actualSpan=scaleMax-scaleMin;if(!isFinite(actualSpan)||actualSpan<minSpan){mid=(scaleMin+scaleMax)/2;scaleMin=mid-minSpan/2;scaleMax=mid+minSpan/2}return{min:scaleMin,max:scaleMax}}"

          new_render_ticks = "    function renderPriceTicks(scale,ticks){if(!axisLayer||!gridLayer)return;var max=axisCapacity()*2,label,lineEl,i,j,slot,top,text,key,oldValue,used={};while(axisLayer.children.length<max){label=document.createElement('span');label.style.opacity='0';axisLayer.appendChild(label)}while(gridLayer.children.length<max){lineEl=document.createElement('span');lineEl.style.opacity='0';gridLayer.appendChild(lineEl)}for(i=0;i<ticks.length&&i<max;i++){key=String(ticks[i]);slot=-1;for(j=0;j<max;j++){if(!used[j]&&axisLayer.children[j].dataset.tickValue===key){slot=j;break}}if(slot<0){for(j=0;j<max;j++){if(!used[j]&&axisLayer.children[j].style.opacity!=='1'){slot=j;break}}}if(slot<0){for(j=0;j<max;j++){if(!used[j]){slot=j;break}}}if(slot<0)continue;used[slot]=1;label=axisLayer.children[slot];lineEl=gridLayer.children[slot];label.dataset.tickValue=key;lineEl.dataset.tickValue=key;top=y(ticks[i],scale)/H*100+'%';text=formatPrice(ticks[i]);if(label.textContent!==text)label.textContent=text;if(label.style.top!==top)label.style.top=top;if(lineEl.style.top!==top)lineEl.style.top=top;if(label.style.opacity!=='1')label.style.opacity='1';if(lineEl.style.opacity!=='1')lineEl.style.opacity='1'}for(i=0;i<max;i++){if(used[i])continue;label=axisLayer.children[i];lineEl=gridLayer.children[i];oldValue=Number(label.dataset.tickValue);if(isFinite(oldValue)){top=y(oldValue,scale)/H*100+'%';if(label.style.top!==top)label.style.top=top;if(lineEl.style.top!==top)lineEl.style.top=top}if(label.style.opacity!=='0')label.style.opacity='0';if(lineEl.style.opacity!=='0')lineEl.style.opacity='0'}}"

          timeline_helpers = [
              "    function chartRoundRange(){if(eventMode||market!=='bitcoin'||!currentRound||String(currentRound.status||'')==='starting')return null;var startMs=Date.parse(currentRound.startsAt||''),endMs=Date.parse(currentRound.endsAt||'');if(!isFinite(startMs)||!isFinite(endMs)||endMs<=startMs)return null;return{start:startMs,end:endMs}}",
              "    function chartRawPoints(now,right){var range=chartRoundRange(),points=[],i,t,v,x,width,activeNow,lastPoint,step;if(range){activeNow=Math.max(range.start,Math.min(range.end,Number(now)||Date.now()));width=right-L;if(entry>0)points.push({x:L,v:Number(entry)});for(i=0;i<values.length;i++){t=Number(sampleTimes[i]);v=Number(values[i]);if(!isFinite(t)||!isFinite(v)||v<=0||t<range.start||t>activeNow)continue;x=L+((Math.min(range.end,t)-range.start)/(range.end-range.start))*width;lastPoint=points[points.length-1];if(lastPoint&&x<=lastPoint.x+.001){if(x>=lastPoint.x-.001)points[points.length-1]={x:x,v:v};continue}points.push({x:x,v:v})}x=L+((activeNow-range.start)/(range.end-range.start))*width;lastPoint=points[points.length-1];if(lastPoint&&x<=lastPoint.x+.001)points[points.length-1]={x:x,v:Number(current)};else points.push({x:x,v:Number(current)});if(points.length===1)points.push({x:Math.min(right,points[0].x+.01),v:points[0].v});return points}step=(W-L-R)/SLIDING_HISTORY;points=values.map(function(value,index){return{x:right-(Number(now)-sampleTimes[index])/SAMPLE_MS*step,v:value}});points.push({x:right,v:current});return clipVisible(points,right)}",
          ]

          new_show_loading = "    function showLoading(){readyPrice=false;priceTarget=0;scaleMin=0;scaleMax=0;scaleFrameAt=0;axisTickStep=0;historyHydrated=false;setTrend('flat');if(chart)chart.classList.remove('ready');resetMarketPrice(live,'Loading');resetMarketPrice(start,'Loading');if(trendLabel)trendLabel.textContent='Waiting for price';if(axisLayer)axisLayer.textContent='';if(gridLayer)gridLayer.textContent='';if(startGuide)startGuide.classList.remove('show');if(startTarget){startTarget.classList.remove('show','above','below');startTarget.textContent=''}syncBetAvailability()}"

          new_seed = "    function seed(price){var i,now=Date.now();if(market==='bitcoin'){values=[price];sampleTimes=[now];lastPointAt=now;historyHydrated=true}else if(!hydrateChartHistory(historyValues,now)){values=[];for(i=0;i<SLIDING_HISTORY;i++)values.push(price);sampleTimes=values.map(function(_,index){return now-(values.length-index)*SAMPLE_MS});lastPointAt=now;historyHydrated=false}current=price;last=price;raw=price;priceTarget=price;scaleMin=0;scaleMax=0;scaleFrameAt=0;axisTickStep=0}"

          new_draw = "    function draw(){if(!readyPrice||!values.length||!line||!fill||eventMode)return;var right=W-R,now=Date.now(),visibleRaw=chartRawPoints(now,right),scale=autoScale(visibleRaw.map(function(p){return p.v})),ticks=priceTicks(scale),visible=visibleRaw.map(function(p){return{x:p.x,y:y(p.v,scale),v:p.v}}),d=path(visible),first=visible[0],lastPoint=visible[visible.length-1],xp=lastPoint.x/W*100,yp=lastPoint.y/H*100;line.setAttribute('d',d);fill.setAttribute('d',d+' L '+lastPoint.x.toFixed(1)+' '+H+' L '+first.x.toFixed(1)+' '+H+' Z');if(dot){var left=xp+'%',top=yp+'%';if(dot.style.left!==left)dot.style.left=left;if(dot.style.top!==top)dot.style.top=top}if(guide){var guideTop=yp+'%';if(guide.style.top!==guideTop)guide.style.top=guideTop}renderPriceTicks(scale,ticks);updateStartMarker(scale);if(start&&entry)renderMarketPrice(start,entry)}"

          new_resume_timeline = "    function resumeChartTimeline(){if(!chartSuspendedAt)return;var now=Date.now(),gap=Math.max(0,now-chartSuspendedAt),absoluteRange=chartRoundRange();chartSuspendedAt=0;if(gap>0&&sampleTimes.length&&!absoluteRange){sampleTimes=sampleTimes.map(function(t){return Number(t)+gap});if(lastPointAt)lastPointAt+=gap}if(gap>120)chartResumeEaseUntil=now+900;scaleFrameAt=motionNow();chartMotionFrame=0}"

          for line in lines:
              if line.startswith('    function priceTicks(scale){'):
                  out.append(new_price_ticks); replaced['priceTicks'] += 1; continue
              if line.startswith('    function autoScale(prices){'):
                  out.append(new_auto_scale); replaced['autoScale'] += 1; continue
              if line.startswith('    function renderPriceTicks(scale,ticks){'):
                  out.append(new_render_ticks); replaced['renderPriceTicks'] += 1; continue
              if line.startswith('    function clipVisible(points,right){'):
                  out.append(line)
                  out.extend(timeline_helpers)
                  inserted_timeline += 1
                  continue
              if line.startswith('    function showLoading(){'):
                  out.append(new_show_loading); replaced['showLoading'] += 1; continue
              if line.startswith('    function seed(price){'):
                  out.append(new_seed); replaced['seed'] += 1; continue
              if line.startswith('    function draw(){'):
                  out.append(new_draw); replaced['draw'] += 1; continue
              if line.startswith('    function resumeChartTimeline(){'):
                  out.append(new_resume_timeline); replaced['resumeChartTimeline'] += 1; continue
              out.append(line)

          if any(count != 1 for count in replaced.values()) or inserted_timeline != 1:
              raise SystemExit(f'chart anchors mismatch: {replaced}, timeline={inserted_timeline}')

          text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')

          # Structural invariants: one authoritative chart path and unchanged trading path.
          checks = {
              'chartRoundRange': text.count('function chartRoundRange()'),
              'chartRawPoints': text.count('function chartRawPoints(now,right)'),
              'draw': text.count('function draw()'),
              'submitBet': text.count('function submitBet(amount)'),
              'bet API': text.count("fetch(eventMode?'/app/api/prediction-events/bet':'/app/api/predict-bet'"),
          }
          if any(value != 1 for value in checks.values()):
              raise SystemExit('single-path validation failed: ' + repr(checks))
          if 'axisStep:10' in text:
              raise SystemExit('old fixed Bitcoin camera scale remains')
          if 'HISTORY=23,SAMPLE_MS=2800' in text:
              raise SystemExit('old ~64s chart sample capacity remains')
          if 'rawPts=values.map(function(v,i){return{x:right-(now-sampleTimes[i])/SAMPLE_MS*step' in text:
              raise SystemExit('old right-pinned sliding chart draw remains')
          if "bitcoin:{label:'Bitcoin'" not in text or 'chartMinRatio:.0015' not in text:
              raise SystemExit('Bitcoin dynamic scale config missing')
          if "x=L+((activeNow-range.start)/(range.end-range.start))*width" not in text:
              raise SystemExit('absolute 5-minute head progression missing')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate generated Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/miniapp/predict-zone.ts', 'utf8');
          const marker = 'export const PREDICT_ZONE_SCRIPT = `';
          const start = src.indexOf(marker);
          if (start < 0) throw new Error('PREDICT_ZONE_SCRIPT marker missing');
          const bodyStart = start + marker.length;
          const end = src.indexOf('\n`;', bodyStart);
          if (end < 0) throw new Error('PREDICT_ZONE_SCRIPT end missing');
          const raw = src.slice(bodyStart, end);
          const cooked = Function('PREDICT_ERROR_TEXTS', 'return `' + raw + '`;')({en:{}});
          new Function(cooked);
          if ((src.match(/function chartRoundRange\(\)/g) || []).length !== 1) throw new Error('duplicate chartRoundRange');
          if ((src.match(/function chartRawPoints\(now,right\)/g) || []).length !== 1) throw new Error('duplicate chartRawPoints');
          if (src.includes('axisStep:10')) throw new Error('old Bitcoin fixed scale remains');
          if (!src.includes('HISTORY=128,SLIDING_HISTORY=23,SAMPLE_MS=2800')) throw new Error('full-round sample capacity missing');
          console.log('Predict chart script parses and root-fix invariants pass');
          NODE

      - name: Commit only Predict owner and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/_predict-chart-root-fix-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Fix Predict chart timeline and axis motion"
          git push origin HEAD:main
