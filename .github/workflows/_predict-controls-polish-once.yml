name: Apply Predict controls polish once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Predict control state and price cards'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update only authoritative Predict UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/predict-zone.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          old_live = ".predict-zone-live-meta>div{height:48px!important;border-radius:18px!important;background:rgba(0,0,0,.22)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.055),inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(255,255,255,.04)!important;padding:8px 11px!important;display:grid!important;align-content:center!important;gap:2px!important;box-sizing:border-box!important}"
          new_live = ".predict-zone-live-meta>div{height:48px!important;padding:8px 11px!important;border:0!important;outline:0!important;border-radius:28px!important;background:rgba(0,0,0,.22)!important;box-shadow:inset 3px 3px .5px -3.5px rgba(255,255,255,.10),inset -3px -3px .5px -3.5px rgba(255,255,255,.12),inset 1px 1px 1px -.5px rgba(255,255,255,.08),inset -1px -1px 1px -.5px rgba(255,255,255,.06),inset 0 0 6px 6px rgba(255,255,255,.04),inset 0 0 2px 2px rgba(255,255,255,.025)!important;backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important;-webkit-backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important;display:grid!important;align-content:center!important;gap:2px!important;box-sizing:border-box!important}"
          replace_once(old_live, new_live, 'Start/Live card material')

          old_choice_tail = "transition:transform .18s ease,opacity .18s ease!important}.predict-zone-choice>span:last-child"
          new_choice_tail = "opacity:.58!important;filter:brightness(.86)!important;transition:transform .18s ease,opacity .18s ease,filter .18s ease!important}.predict-zone-choice>span:last-child"
          replace_once(old_choice_tail, new_choice_tail, 'unselected Up/Down state')

          old_selected = ".predict-zone-choice.selected .predict-zone-choice-symbol{transform:scale(1.12)}"
          new_selected = ".predict-zone-choice.selected:not(:disabled){opacity:1!important;filter:brightness(1.08)!important}.predict-zone-choice.selected .predict-zone-choice-symbol{transform:scale(1.12)}"
          replace_once(old_selected, new_selected, 'selected Up/Down state')

          old_quote_a = "rawAmount+' - → - '+(quote?'—':'…')"
          new_quote_a = "rawAmount+' → '+(quote?'—':'…')"
          replace_once(old_quote_a, new_quote_a, 'preset unavailable quote spacing')

          old_quote_b = "rawAmount+' - → - </span>"
          new_quote_b = "rawAmount+' → </span>"
          replace_once(old_quote_b, new_quote_b, 'preset quote spacing')

          # Edit already shares the exact same authoritative card-material rule with the 3 preset buttons.
          shared_rule = '.predict-zone-bet-preset,.predict-zone-preset-edit{'
          if text.count(shared_rule) != 1:
              raise SystemExit('Edit/preset shared card material is not singular')

          # Verify Start/Live and Up/Down use the same requested card material tokens.
          required = [
              'border:0!important',
              'outline:0!important',
              'border-radius:28px!important',
              'background:rgba(0,0,0,.22)!important',
              'box-shadow:inset 3px 3px .5px -3.5px rgba(255,255,255,.10),inset -3px -3px .5px -3.5px rgba(255,255,255,.12),inset 1px 1px 1px -.5px rgba(255,255,255,.08),inset -1px -1px 1px -.5px rgba(255,255,255,.06),inset 0 0 6px 6px rgba(255,255,255,.04),inset 0 0 2px 2px rgba(255,255,255,.025)!important',
              'backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important',
              '-webkit-backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important',
          ]
          live_block = text.split('.predict-zone-live-meta>div{',1)[1].split('}',1)[0]
          choice_block = text.split('.predict-zone-choice{',1)[1].split('}',1)[0]
          preset_block = text.split(shared_rule,1)[1].split('}',1)[0]
          for token in required:
              if token not in live_block or token not in choice_block or token not in preset_block:
                  raise SystemExit('Card material mismatch: ' + token)

          if " - → - " in text:
              raise SystemExit('Old dash-separated quote format remains')
          if text.count("rawAmount+' → '+(quote?'—':'…')") != 1 or text.count("rawAmount+' → </span>") != 1:
              raise SystemExit('Requested amount arrow spacing is not singular')
          if text.count('.predict-zone-choice.selected:not(:disabled){opacity:1!important;filter:brightness(1.08)!important}') != 1:
              raise SystemExit('Selected choice state validation failed')
          if text.count("fetch(eventMode?'/app/api/prediction-events/bet':'/app/api/predict-bet'") != 1:
              raise SystemExit('Predict backend path changed or duplicated')
          if 'data-predict-bet-stage' in text or 'data-predict-bet-submit' in text or 'function openBet(' in text:
              raise SystemExit('Legacy bet path unexpectedly present')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate emitted Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/miniapp/predict-zone.ts', 'utf8');
          const marker = 'export const PREDICT_ZONE_SCRIPT = `';
          const start = src.indexOf(marker);
          if (start < 0) throw new Error('PREDICT_ZONE_SCRIPT marker missing');
          const bodyStart = start + marker.length;
          const end = src.indexOf('\n`;', bodyStart);
          if (end < 0) throw new Error('PREDICT_ZONE_SCRIPT end missing');
          const raw = src.slice(bodyStart, end);
          const cooked = Function('PREDICT_ERROR_TEXTS', 'return `' + raw + '`;')({en:{}});
          new Function(cooked);
          if (!src.includes("rawAmount+' → '+(quote?'—':'…')")) throw new Error('Quote spacing missing');
          console.log('Predict UI and emitted browser script validation OK');
          NODE

      - name: Commit only Predict owner and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/_predict-controls-polish-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Polish Predict choice and price cards"
          git push origin HEAD:main
