name: Predict minimum message once
on:
  push:
    paths:
      - .github/workflows/_predict-minimum-message-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only Predict minimum messaging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path)
              s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {n}')
              p.write_text(s.replace(old,new,1))

          once('src/predict-routes.ts',
            "    if (stakeNano < minimumStakeNano) throw new Error('This amount is below the minimum for this market. Minimum prediction is $1.');\n",
            "    if (stakeNano < minimumStakeNano) throw new Error(`This amount is below the minimum for this market. Minimum prediction is ${nanoToTon(minimumStakeNano)} GRAM ($1).`);\n")

          once('src/prediction-events.ts',
            "    if (stakeNano < minimumStakeNano) throw new Error('This amount is below the minimum for this market. Minimum prediction is $1.');\n",
            "    if (stakeNano < minimumStakeNano) throw new Error(`This amount is below the minimum for this market. Minimum prediction is ${nanoToTon(minimumStakeNano)} GRAM ($1).`);\n")

          once('src/miniapp/predict-zone.ts',
            "    var presetEditing=false,limitNoticeTimer=0,countdownAnimations=[],countdownPendingText=null,displayedCountdownText='',countdownAnimationTargetText='',countdownTextReady=false,startPriceRoll={animations:[],pending:null,displayed:'',target:'',ready:false},livePriceRoll={animations:[],pending:null,displayed:'',target:'',ready:false};\n",
            "    var presetEditing=false,limitNoticeTimer=0,betStatusTimer=0,countdownAnimations=[],countdownPendingText=null,displayedCountdownText='',countdownAnimationTargetText='',countdownTextReady=false,startPriceRoll={animations:[],pending:null,displayed:'',target:'',ready:false},livePriceRoll={animations:[],pending:null,displayed:'',target:'',ready:false};\n")

          once('src/miniapp/predict-zone.ts',
            "    function friendlyPredictError(message){var raw=String(message||\"\").trim(),m=raw.toLowerCase(),amount=\"\";if(!raw)return predictText(\"generic\");if(isPredictRegionError(raw))return predictText(\"region\");if(predictErrorHas(m,[\"marketable buy order\",\"min size\",\"minimum size\",\"below the minimum\"]))return predictText(\"minimum\");",
            "    function minimumAmountFromError(raw){var match=String(raw||'').match(/minimum prediction is\\s+([0-9]+(?:\\.[0-9]+)?)\\s+gram/i);return match?String(match[1]||''):''}\n    function minimumErrorText(amount){var clean=String(amount||'').trim();return predictText('minimum')+(clean?' Minimum: '+clean+' GRAM ($1).':'')}\n    function friendlyPredictError(message){var raw=String(message||\"\").trim(),m=raw.toLowerCase(),amount=\"\";if(!raw)return predictText(\"generic\");if(isPredictRegionError(raw))return predictText(\"region\");if(predictErrorHas(m,[\"marketable buy order\",\"min size\",\"minimum size\",\"below the minimum\"]))return minimumErrorText(minimumAmountFromError(raw));")

          once('src/miniapp/predict-zone.ts',
            "    function setStatus(text,type){if(!betStatus)return;betStatus.textContent='';betStatus.classList.toggle('bad',type==='bad');betStatus.classList.toggle('good',type==='good');betStatus.setAttribute('dir','auto');if(text){var message=document.createElement('span');message.className='predict-zone-bet-status-message';message.textContent=String(text);betStatus.appendChild(message)}}\n",
            "    function setStatus(text,type){if(!betStatus)return;if(betStatusTimer){clearTimeout(betStatusTimer);betStatusTimer=0}betStatus.textContent='';betStatus.classList.toggle('bad',type==='bad');betStatus.classList.toggle('good',type==='good');betStatus.setAttribute('dir','auto');if(text){var message=document.createElement('span');message.className='predict-zone-bet-status-message';message.textContent=String(text);betStatus.appendChild(message)}if(type==='bad'&&text){betStatusTimer=setTimeout(function(){betStatusTimer=0;if(!betStatus)return;betStatus.textContent='';betStatus.classList.remove('bad','good')},5000)}}\n")

          once('src/miniapp/predict-zone.ts',
            "var minimum=minimumGramAmount();if(minimum&&amount<minimum){setStatus(predictText('minimum'),'bad');return}",
            "var minimum=minimumGramAmount();if(minimum&&amount<minimum){setStatus(minimumErrorText(formatTon(minimum)),'bad');return}")
          PY
      - name: Validate exact scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/miniapp/predict-zone.ts\nsrc/predict-routes.ts\nsrc/prediction-events.ts'
          grep -q "betStatusTimer=0" src/miniapp/predict-zone.ts
          grep -q "},5000)" src/miniapp/predict-zone.ts
          grep -q "minimumAmountFromError" src/miniapp/predict-zone.ts
          grep -q 'Minimum prediction is ${nanoToTon(minimumStakeNano)} GRAM' src/predict-routes.ts
          grep -q 'Minimum prediction is ${nanoToTon(minimumStakeNano)} GRAM' src/prediction-events.ts
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if grep -E 'src/(predict-routes|prediction-events|miniapp/predict-zone)\.ts' /tmp/tsc.log; then
            cat /tmp/tsc.log
            exit 1
          fi
          echo "Modified Predict files have no TypeScript diagnostics. Full repo tsc status: $status"
      - name: Commit and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_predict-minimum-message-once.yml
          git add src/miniapp/predict-zone.ts src/predict-routes.ts src/prediction-events.ts
          git commit -m "Show Predict minimum amount and clear errors"
          git push origin HEAD:main
