name: Apply native Telegram preset prompt once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply native Telegram preset prompt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Replace floating preset input with Telegram native prompt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/miniapp/predict-zone.ts')
          s = p.read_text(encoding='utf-8')
          original = s

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          one('      <input class="predict-zone-preset-input" data-predict-preset-input type="text" inputmode="decimal" pattern="[0-9.,]*" autocomplete="off" enterkeyhint="done" aria-label="Bet amount" aria-hidden="true" tabindex="-1" />\n', '', 'floating preset input markup')

          css_pattern = re.compile(r'\.predict-zone-preset-input\{display:none!important\}body \.predict-zone-preset-input\.is-open\{.*?\}(?=\.predict-zone-bet-status\{)', re.S)
          s, count = css_pattern.subn('', s, count=1)
          if count != 1:
              raise SystemExit(f'floating preset input CSS: expected exactly 1 match, found {count}')

          one("body.vexa-predict-preset-keyboard:has(#predictzone.active) .app{height:var(--predict-edit-layout-height,100vh)!important}body.vexa-predict-preset-keyboard:has(#predictzone.active) .content{height:calc(var(--predict-edit-layout-height,100vh) - 72px - 94px - env(safe-area-inset-top) - env(safe-area-inset-bottom))!important}body.vexa-predict-preset-keyboard:has(#predictzone.active) .tabs{display:none!important}\n", '', 'obsolete preset keyboard guard CSS')

          one("var betStatus=root.querySelector('[data-predict-bet-status]'),presetEdit=root.querySelector('[data-predict-preset-edit]'),presetInput=root.querySelector('[data-predict-preset-input]'),eventSummary=",
              "var betStatus=root.querySelector('[data-predict-bet-status]'),presetEdit=root.querySelector('[data-predict-preset-edit]'),eventSummary=",
              'preset input DOM reference')
          one("var presetEditing=false,presetKeyboardGuard=false,presetViewportBaseline=0,presetInputHome=presetInput&&presetInput.parentNode,presetInputAnchor=null,presetInputViewportHandler=null,limitNoticeTimer=0,",
              "var presetEditing=false,limitNoticeTimer=0,",
              'preset input state')

          start = s.find('    function presetViewportHeight(){')
          end = s.find('    function submitBet(amount){', start)
          if start < 0 or end < 0:
              raise SystemExit('preset input helper block anchors not found')
          helper_block = s[start:end]
          required_helpers = [
              'function presetViewportHeight()',
              'function beginPresetKeyboardGuard()',
              'function endPresetKeyboardGuard(force)',
              'function syncPresetKeyboardGuard()',
              'function presetInputRect()',
              'function positionPresetInput()',
              'function removePresetInputViewportHandler()',
              'function commitPresetInput()',
              'function openPresetInput(anchor)',
              'function closePresetInput(save)',
              'function setPresetEditing(next)',
          ]
          missing = [name for name in required_helpers if name not in helper_block]
          if missing:
              raise SystemExit(f'expected preset editor helpers missing: {missing}')

          replacement = """    function editPresetWithNativePrompt(anchor){if(!anchor)return;var current=String(anchor.getAttribute('data-predict-bet-preset')||''),next=null;try{next=window.prompt('Enter GRAM amount',current)}catch(e){return}if(next===null)return;var clean=normalizedPreset(next,current),value=anchor.querySelector('[data-predict-preset-value]');anchor.setAttribute('data-predict-bet-preset',clean);if(value)value.textContent=clean;resetPresetLabels();updateEstimate()}\n    function setPresetEditing(next){if(busy)return;presetEditing=!!next;root.classList.toggle('predict-zone-preset-editing',presetEditing);if(presetEdit){presetEdit.classList.toggle('is-editing',presetEditing);presetEdit.textContent=presetEditing?'Done':'Edit'}var buttons=root.querySelectorAll('[data-predict-bet-preset]');buttons.forEach(function(btn){var value=btn.querySelector('[data-predict-preset-value]');if(!value){btn.innerHTML='<span data-predict-preset-value></span>';value=btn.querySelector('[data-predict-preset-value]')}if(value)value.textContent=String(btn.getAttribute('data-predict-bet-preset')||'')});if(!presetEditing){resetPresetLabels();updateEstimate()}syncBetAvailability()}\n"""
          s = s[:start] + replacement + s[end:]

          keydown = "    document.addEventListener('keydown',function(e){if(!presetEditing||e.target!==presetInput)return;if(e.key==='Enter'){e.preventDefault();setPresetEditing(false)}if(e.key==='Escape'){e.preventDefault();setPresetEditing(false)}},true);\n"
          one(keydown, '', 'floating input keydown listener')
          mirror = "    if(presetInput)presetInput.addEventListener('input',function(){if(!presetEditing||!presetInputAnchor)return;var value=presetInputAnchor.querySelector('[data-predict-preset-value]');if(value)value.textContent=presetInput.value||String(presetInputAnchor.getAttribute('data-predict-bet-preset')||'')});\n"
          one(mirror, '', 'floating input mirror listener')
          one("if(presetEditing){openPresetInput(preset);return}", "if(presetEditing){editPresetWithNativePrompt(preset);return}", 'preset edit click path')
          one("    if(window.visualViewport)window.visualViewport.addEventListener('resize',syncPresetKeyboardGuard);window.addEventListener('focus',syncPresetKeyboardGuard);window.addEventListener('pageshow',syncPresetKeyboardGuard);\n", '', 'obsolete keyboard guard listeners')

          forbidden = [
              'data-predict-preset-input',
              'predict-zone-preset-input',
              'presetInput',
              'presetKeyboardGuard',
              'predict-edit-layout-height',
              'vexa-predict-preset-keyboard',
              'openPresetInput(',
              'commitPresetInput(',
              'syncPresetKeyboardGuard',
          ]
          leftovers = [value for value in forbidden if value in s]
          if leftovers:
              raise SystemExit(f'obsolete floating input path remains: {leftovers}')
          if s.count("window.prompt('Enter GRAM amount',current)") != 1:
              raise SystemExit('native prompt path missing or duplicated')
          if s.count('function editPresetWithNativePrompt(anchor)') != 1:
              raise SystemExit('native prompt helper missing or duplicated')
          if "if(presetEditing){editPresetWithNativePrompt(preset);return}" not in s:
              raise SystemExit('native prompt is not gated by preset selection in edit mode')
          set_start = s.find('    function setPresetEditing(next){')
          set_end = s.find('\n', set_start)
          set_line = s[set_start:set_end]
          if 'window.prompt' in set_line or 'editPresetWithNativePrompt' in set_line:
              raise SystemExit('Edit button path must not open a prompt')
          if 'grid-template-columns:repeat(3,minmax(0,1fr)) 54px!important' not in s:
              raise SystemExit('54px Edit geometry changed unexpectedly')

          if s == original:
              raise SystemExit('no Predict changes produced')
          p.write_text(s, encoding='utf-8')

          g = Path('src/miniapp/glass-components-overrides.ts')
          gs = g.read_text(encoding='utf-8')
          old = 'input:not(.predict-zone-bet-input):not(.predict-zone-preset-input),select,textarea,.section-code-input,.bet-amount,.crash-amount input{'
          new = 'input:not(.predict-zone-bet-input),select,textarea,.section-code-input,.bet-amount,.crash-amount input{'
          if gs.count(old) != 1:
              raise SystemExit(f'global stale preset input exclusion: expected 1, found {gs.count(old)}')
          gs = gs.replace(old, new, 1)
          g.write_text(gs, encoding='utf-8')
          PY

          git diff --check -- src/miniapp/predict-zone.ts src/miniapp/glass-components-overrides.ts
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = "src/miniapp/glass-components-overrides.ts src/miniapp/predict-zone.ts"

      - name: Validate emitted Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('src/miniapp/predict-zone.ts','utf8');
          const marker='export const PREDICT_ZONE_SCRIPT = `';
          const a=src.indexOf(marker); if(a<0) throw new Error('Predict script marker missing');
          const b=a+marker.length,e=src.indexOf('\n`;',b); if(e<0) throw new Error('Predict script end missing');
          const cooked=Function('PREDICT_ERROR_TEXTS','return `'+src.slice(b,e)+'`;')({en:{}});
          new Function(cooked);
          if((src.match(/window\.prompt\('Enter GRAM amount',current\)/g)||[]).length!==1) throw new Error('native Telegram prompt path missing/duplicate');
          if(src.includes('predict-zone-preset-input')||src.includes('presetInput')||src.includes('syncPresetKeyboardGuard')) throw new Error('old floating input path remains');
          if(!src.includes("if(presetEditing){editPresetWithNativePrompt(preset);return}")) throw new Error('prompt is not selection-gated');
          console.log('Predict native prompt validation OK');
          NODE

      - name: Commit authoritative source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-native-prompt-once.yml
          git add src/miniapp/predict-zone.ts src/miniapp/glass-components-overrides.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | paste -sd ' ' -)" = ".github/workflows/_predict-native-prompt-once.yml src/miniapp/glass-components-overrides.ts src/miniapp/predict-zone.ts"
          git commit -m "Use Telegram native prompt for Predict presets"
          git push origin HEAD:main
