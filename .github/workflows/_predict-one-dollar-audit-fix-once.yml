name: Predict audit fix
on:
  push:
    paths:
      - .github/workflows/_predict-one-dollar-audit-fix-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/predict-routes.ts')
          s=p.read_text()
          a="    const providerState = market === 'bitcoin' ? await getPredictProviderStateForRound(c.env) : null;\n    const tonUsd = await fetchGramUsdPrice();\n    const minimumStakeNano = minimumPredictStakeNano(tonUsd);\n    if (stakeNano < minimumStakeNano) throw new Error('This amount is below the minimum for this market. Minimum prediction is $1.');\n"
          b="    const providerState = market === 'bitcoin' ? await getPredictProviderStateForRound(c.env) : null;\n    const minimumGramUsd = await fetchGramUsdPrice();\n    const minimumStakeNano = minimumPredictStakeNano(minimumGramUsd);\n    if (stakeNano < minimumStakeNano) throw new Error('This amount is below the minimum for this market. Minimum prediction is $1.');\n    const tonUsd = providerState === 'polymarket' ? minimumGramUsd : cleanOptionalPrice(body.tonUsdSnapshot);\n"
          assert s.count(a)==1
          s=s.replace(a,b,1)
          a='enter a valid gram amount|this prediction is closed'
          b='enter a valid gram amount|below the minimum|this prediction is closed'
          assert s.count(a)==1
          p.write_text(s.replace(a,b,1))
          PY
          test "$(git diff --name-only)" = "src/predict-routes.ts"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_predict-one-dollar-audit-fix-once.yml
          git add src/predict-routes.ts
          git commit -m "Refine Predict one-dollar minimum enforcement"
          git push