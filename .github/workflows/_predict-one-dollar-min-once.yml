name: Apply Predict one-dollar minimum once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/_predict-one-dollar-min-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Predict minimum only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}')
              p.write_text(s.replace(old, new, 1))

          # Main Predict backend: server-authoritative GRAM/USD and $1 floor.
          replace_once('src/predict-routes.ts',
              "const NANO = 1_000_000_000;\n",
              "const NANO = 1_000_000_000;\nconst MIN_PREDICT_USD = 1;\n")
          replace_once('src/predict-routes.ts',
              "    const tonUsd = providerState === 'polymarket' ? await fetchGramUsdPrice() : cleanOptionalPrice(body.tonUsdSnapshot);\n",
              "    const tonUsd = await fetchGramUsdPrice();\n    const minimumStakeNano = minimumPredictStakeNano(tonUsd);\n    if (stakeNano < minimumStakeNano) throw new Error('This amount is below the minimum for this market. Minimum prediction is $1.');\n")
          replace_once('src/predict-routes.ts',
              "async function fetchGramUsdPrice(): Promise<number> {\n  const rate = await getStarsGramRate();\n  const price = Number(rate.gramUsd);\n  if (!Number.isFinite(price) || price <= 0) throw new Error('Gram/USD price is unavailable');\n  return price;\n}\n",
              "async function fetchGramUsdPrice(): Promise<number> {\n  const rate = await getStarsGramRate();\n  const price = Number(rate.gramUsd);\n  if (!Number.isFinite(price) || price <= 0) throw new Error('Gram/USD price is unavailable');\n  return price;\n}\nfunction minimumPredictStakeNano(gramUsd: number): number {\n  const price = Number(gramUsd);\n  if (!Number.isFinite(price) || price <= 0) throw new Error('Gram/USD price is unavailable');\n  const nano = Math.ceil((MIN_PREDICT_USD / price) * NANO);\n  if (!Number.isSafeInteger(nano) || nano < 1) throw new Error('Gram/USD price is unavailable');\n  return nano;\n}\n")

          # Event Predict backend: same authoritative $1 floor.
          replace_once('src/prediction-events.ts',
              "import { getSectionAccess, isMiniAppAdmin } from './section-access';\n",
              "import { getSectionAccess, isMiniAppAdmin } from './section-access';\nimport { getStarsGramRate } from './stars-deposits';\n")
          replace_once('src/prediction-events.ts',
              "const NANO = 1_000_000_000;\n",
              "const NANO = 1_000_000_000;\nconst MIN_PREDICT_USD = 1;\n")
          replace_once('src/prediction-events.ts',
              "    const stakeNano = tonToNano(body.stakeTon);\n    if (stakeNano <= 0) throw new Error('Enter a valid GRAM amount');\n",
              "    const stakeNano = tonToNano(body.stakeTon);\n    if (stakeNano <= 0) throw new Error('Enter a valid GRAM amount');\n    const minimumStakeNano = await minimumPredictionStakeNano();\n    if (stakeNano < minimumStakeNano) throw new Error('This amount is below the minimum for this market. Minimum prediction is $1.');\n")
          marker = "function tonToNano(value: unknown): number {"
          p = Path('src/prediction-events.ts')
          s = p.read_text()
          if s.count(marker) != 1:
              raise SystemExit(f'prediction-events.ts: expected one tonToNano marker, found {s.count(marker)}')
          helper = "async function minimumPredictionStakeNano(): Promise<number> {\n  const rate = await getStarsGramRate();\n  const price = Number(rate.gramUsd);\n  if (!Number.isFinite(price) || price <= 0) throw new Error('Gram/USD price is unavailable');\n  const nano = Math.ceil((MIN_PREDICT_USD / price) * NANO);\n  if (!Number.isSafeInteger(nano) || nano < 1) throw new Error('Gram/USD price is unavailable');\n  return nano;\n}\n"
          p.write_text(s.replace(marker, helper + marker, 1))

          # Predict UI: fast client-side guard using the existing GRAM/USD feed.
          replace_once('src/miniapp/predict-zone.ts',
              "    function loadGramUsd(){var source=window.VexaTonUsdPrice,current=readGramUsd();if(current>0){gramUsd=current;updateEstimate();return Promise.resolve(current)}if(!source||typeof source.load!=='function')return Promise.resolve(0);return Promise.resolve(source.load()).then(function(value){var price=Number(value)||readGramUsd();if(isFinite(price)&&price>0){gramUsd=price;updateEstimate();return price}return 0}).catch(function(){return 0})}\n",
              "    function minimumGramAmount(){var price=readGramUsd()||gramUsd;return isFinite(price)&&price>0?Math.ceil((1/price)*10000)/10000:0}\n    function loadGramUsd(){var source=window.VexaTonUsdPrice,current=readGramUsd();if(current>0){gramUsd=current;updateEstimate();return Promise.resolve(current)}if(!source||typeof source.load!=='function')return Promise.resolve(0);return Promise.resolve(source.load()).then(function(value){var price=Number(value)||readGramUsd();if(isFinite(price)&&price>0){gramUsd=price;updateEstimate();return price}return 0}).catch(function(){return 0})}\n")
          replace_once('src/miniapp/predict-zone.ts',
              "if(!amount||amount<=0){setStatus(predictText('validAmount'),'bad');return}if(Math.floor(amount*1000000000)>balanceNano)",
              "if(!amount||amount<=0){setStatus(predictText('validAmount'),'bad');return}var minimum=minimumGramAmount();if(minimum&&amount<minimum){setStatus(predictText('minimum'),'bad');return}if(Math.floor(amount*1000000000)>balanceNano)")
          PY

      - name: Validate exact scope and modified-file TypeScript
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/miniapp/predict-zone.ts\nsrc/predict-routes.ts\nsrc/prediction-events.ts'
          grep -q "MIN_PREDICT_USD = 1" src/predict-routes.ts
          grep -q "minimumPredictStakeNano" src/predict-routes.ts
          grep -q "minimumPredictionStakeNano" src/prediction-events.ts
          grep -q "function minimumGramAmount" src/miniapp/predict-zone.ts
          grep -q "predictText('minimum')" src/miniapp/predict-zone.ts
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if grep -E 'src/(predict-routes|prediction-events|miniapp/predict-zone)\.ts' /tmp/tsc.log; then
            cat /tmp/tsc.log
            exit 1
          fi
          echo "Modified Predict files have no TypeScript diagnostics. Full repo tsc status: $status (known unrelated diagnostics may remain)."

      - name: Commit scoped fix and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_predict-one-dollar-min-once.yml
          git add src/predict-routes.ts src/prediction-events.ts src/miniapp/predict-zone.ts
          git commit -m "Enforce one-dollar minimum in Predict"
          git push origin HEAD:main