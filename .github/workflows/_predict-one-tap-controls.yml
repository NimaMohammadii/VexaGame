name: Apply Predict one-tap controls once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch authoritative Predict UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, zlib
          payload = ""
          exec(zlib.decompress(base64.b64decode(payload)).decode("utf-8"))
          PY
          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"
      - name: Validate generated Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'NODE'
          const mod = await import('./src/miniapp/predict-zone.ts?check=' + Date.now());
          new Function(mod.PREDICT_ZONE_SCRIPT);
          if (mod.PREDICT_ZONE_SECTION.includes('Place prediction')) throw new Error('old submit button remains');
          if (mod.PREDICT_ZONE_SECTION.includes('data-predict-bet-input')) throw new Error('old amount input remains');
          if ((mod.PREDICT_ZONE_SECTION.match(/data-predict-bet-preset=/g) || []).length !== 3) throw new Error('expected exactly three quick amounts');
          if (!mod.PREDICT_ZONE_SECTION.includes('data-predict-bet-edit')) throw new Error('Edit control missing');
          if (!mod.PREDICT_ZONE_SCRIPT.includes('function submitBet(amountValue)')) throw new Error('direct submit missing');
          if (!mod.PREDICT_ZONE_SCRIPT.includes("'/app/api/predict-bet'")) throw new Error('existing backend route missing');
          console.log('Predict quick-bet generated script parses and invariants are clean');
          NODE
      - name: Commit only authoritative Predict file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-one-tap-controls.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Simplify Predict one-tap bet controls"
          git push origin HEAD:main
