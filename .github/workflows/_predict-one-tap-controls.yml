name: Apply Predict one-tap controls once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Repair Predict one-tap controls patch v7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply verified Predict patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import re
          import subprocess
          import zlib

          source = subprocess.check_output([
              'git', 'show',
              '4f9b5fd61f02924af684d1dba1a196fe9a08173a:.github/workflows/_predict-one-tap-controls.yml'
          ], text=True)
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', source)
          if not match:
              raise SystemExit('validated patch payload not found')
          code = zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          lines = code.splitlines()

          rename_hits = [i for i, line in enumerate(lines) if 'text.replace' in line and 'updateEstimate()' in line and 'renderPresetQuotes()' in line]
          if len(rename_hits) != 1:
              raise SystemExit('global updateEstimate rename count: %s; related=%r' % (len(rename_hits), [line for line in lines if 'updateEstimate' in line]))
          del lines[rename_hits[0]]

          hits = [i for i, line in enumerate(lines) if 'old update estimate' in line]
          if len(hits) != 1:
              raise SystemExit(f'updateEstimate repair anchor count: {len(hits)}')
          hit = hits[0]
          start = hit
          while start >= 0 and 'replace_once(' not in lines[start]:
              start -= 1
          end = hit
          while end < len(lines) and lines[end].strip() != ')':
              end += 1
          if start < 0 or end >= len(lines):
              raise SystemExit('could not isolate old updateEstimate replace block')
          indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
          lines[start:end+1] = [
              indent + "_vexa_update_start = text.find('    function updateEstimate(){')",
              indent + "if _vexa_update_start < 0:",
              indent + "    raise SystemExit('updateEstimate start missing')",
              indent + "_vexa_update_end = text.find(chr(10), _vexa_update_start)",
              indent + "if _vexa_update_end < 0:",
              indent + "    raise SystemExit('updateEstimate end missing')",
              indent + "text = text[:_vexa_update_start] + '    function updateEstimate(){renderPresetQuotes()}' + chr(10) + text[_vexa_update_end + 1:]",
          ]

          code = 'import re\n' + '\n'.join(lines) + '\n'
          exec(compile(code, '<predict-one-tap-patch>', 'exec'), {})
          PY
          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate generated Predict browser script and architecture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/miniapp/predict-zone.ts', 'utf8');
          const marker = 'export const PREDICT_ZONE_SCRIPT = `';
          const start = src.indexOf(marker);
          if (start < 0) throw new Error('PREDICT_ZONE_SCRIPT marker missing');
          const bodyStart = start + marker.length;
          const end = src.indexOf('\n`;', bodyStart);
          if (end < 0) throw new Error('PREDICT_ZONE_SCRIPT end missing');
          const raw = src.slice(bodyStart, end);
          const cooked = Function('PREDICT_ERROR_TEXTS', 'return `' + raw + '`;')({ en: {} });
          new Function(cooked);
          const legacy = ['data-predict-bet-stage','data-predict-bet-input','data-predict-bet-submit','Place prediction','function openBet(','function closeBet(','betOpen','betStage','betInput','betUsd','betEstimate','betSubmit','bet-mode','bet-transition'];
          for (const token of legacy) if (src.includes(token)) throw new Error('Legacy Predict bet path remains: ' + token);
          const section = src.split('export const PREDICT_ZONE_STYLES', 1)[0];
          const presets = (section.match(/data-predict-bet-preset="/g) || []).length;
          if (presets !== 3) throw new Error('Expected exactly 3 amount buttons; got ' + presets);
          if ((section.match(/data-predict-bet-edit/g) || []).length !== 1) throw new Error('Expected exactly one Edit button');
          if (!src.includes("'/app/api/predict-bet'") || !src.includes("'/app/api/prediction-events/bet'")) throw new Error('Existing Predict backend route missing');
          if ((src.match(/function syncBetAvailability\(\)/g) || []).length !== 1) throw new Error('syncBetAvailability must remain singular');
          if ((src.match(/function submitBet\(amount\)/g) || []).length !== 1) throw new Error('direct submit path must remain singular');
          console.log('Predict one-tap controls: parse and architecture checks OK');
          NODE

      - name: Commit only authoritative Predict file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-one-tap-controls.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Simplify Predict to one-tap amount betting"
          git push origin HEAD:main
