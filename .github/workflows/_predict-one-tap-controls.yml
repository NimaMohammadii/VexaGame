name: Apply Predict one-tap controls once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Predict one-tap controls patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Patch authoritative Predict UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, zlib
          exec(zlib.decompress(base64.b64decode("" )).decode("utf-8"))
          PY
          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate generated Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/miniapp/predict-zone.ts', 'utf8');
          const marker = 'export const PREDICT_ZONE_SCRIPT = `';
          const start = src.indexOf(marker);
          if (start < 0) throw new Error('PREDICT_ZONE_SCRIPT marker missing');
          const bodyStart = start + marker.length;
          const end = src.indexOf('\n`;', bodyStart);
          if (end < 0) throw new Error('PREDICT_ZONE_SCRIPT end missing');
          const raw = src.slice(bodyStart, end);
          const cooked = Function('PREDICT_ERROR_TEXTS', 'return `' + raw + '`;')({ en: {} });
          new Function(cooked);
          if (src.includes('data-predict-bet-submit') || src.includes('data-predict-bet-input') || src.includes('function openBet(') || src.includes('function closeBet(')) {
            throw new Error('Legacy Predict bet form path still present');
          }
          const section = src.split('export const PREDICT_ZONE_STYLES', 1)[0];
          const presetCount = (section.match(/data-predict-bet-preset="/g) || []).length;
          if (presetCount !== 3) throw new Error('Expected exactly three amount buttons, got ' + presetCount);
          if (!src.includes("function submitBet(amountValue)") || !src.includes("'/app/api/predict-bet'")) {
            throw new Error('Direct submit path or existing backend route missing');
          }
          console.log('Predict browser script parse + one-tap invariants: OK');
          NODE

      - name: Commit only Predict UI and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-one-tap-controls.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Simplify Predict to one-tap amount betting"
          git push origin HEAD:main
