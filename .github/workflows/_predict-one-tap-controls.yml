name: Finalize Predict quick bet UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Repair final Predict quick bet migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Apply reviewed Predict migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import textwrap

          source = subprocess.check_output([
              'git', 'show',
              '227288e932e320272259dfd5171dbb80a935ea20:.github/workflows/_predict-one-tap-controls.yml'
          ], text=True)
          marker = "python - <<'PY'\n"
          if source.count(marker) != 1:
              raise SystemExit('source migration block not found exactly once')
          block = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          code = textwrap.dedent(block)
          anchor = "forbidden = [\n"
          if code.count(anchor) != 1:
              raise SystemExit('migration validation anchor mismatch')
          code = code.replace(
              anchor,
              "text = text.replace(',.predict-zone-bet-submit', '')\n\n" + anchor,
              1,
          )
          exec(compile(code, '<predict-quick-bet-migration>', 'exec'), {})
          PY

          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate generated Predict browser script and old-path removal
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/miniapp/predict-zone.ts', 'utf8');
          const marker = 'export const PREDICT_ZONE_SCRIPT = `';
          const start = src.indexOf(marker);
          if (start < 0) throw new Error('PREDICT_ZONE_SCRIPT marker missing');
          const bodyStart = start + marker.length;
          const end = src.indexOf('\n`;', bodyStart);
          if (end < 0) throw new Error('PREDICT_ZONE_SCRIPT end missing');
          const raw = src.slice(bodyStart, end);
          const cooked = Function('PREDICT_ERROR_TEXTS', 'return `' + raw + '`;')({en:{}});
          new Function(cooked);

          const legacy = [
            'data-predict-bet-stage','data-predict-bet-input','data-predict-bet-submit',
            'Place prediction','function openBet(','function closeBet(','betOpen','betStage',
            'betInput','betUsd','betEstimate','betSubmit','bet-mode','bet-transition',
            'predict-zone-keyboard-open'
          ];
          for (const token of legacy) {
            if (src.includes(token)) throw new Error('Legacy Predict bet path remains: ' + token);
          }
          const section = src.split('export const PREDICT_ZONE_STYLES', 1)[0];
          if ((section.match(/data-predict-bet-preset="/g) || []).length !== 3) throw new Error('Expected exactly 3 amount buttons');
          if ((section.match(/data-predict-preset-edit/g) || []).length !== 1) throw new Error('Expected exactly one Edit button');
          if ((src.match(/function submitBet\(amount\)/g) || []).length !== 1) throw new Error('Direct submit path must be singular');
          if ((src.match(/function syncBetAvailability\(\)/g) || []).length !== 1) throw new Error('syncBetAvailability must remain singular');
          if (!src.includes("fetch(eventMode?'/app/api/prediction-events/bet':'/app/api/predict-bet'")) throw new Error('Existing backend submit path missing');
          console.log('Predict quick bet UI: parse and architecture checks OK');
          NODE

      - name: Commit only Predict owner and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/_predict-one-tap-controls.yml .github/workflows/_predict-quick-bet-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Simplify Predict betting to quick amount controls"
          git push origin HEAD:main
