name: Apply Predict preset input cleanup once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Predict preset input cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Clean authoritative Predict preset editor path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/miniapp/predict-zone.ts')
          s = p.read_text(encoding='utf-8')
          original = s

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          one('class="predict-zone-preset-edit" data-predict-preset-edit',
              'class="predict-zone-bet-preset" data-predict-preset-edit',
              'Edit visual class')
          one('.predict-zone-bet-preset,.predict-zone-preset-edit{',
              '.predict-zone-bet-preset{',
              'quick-bet card style owner')
          one('.predict-zone-bet-preset:active,.predict-zone-preset-edit:active{',
              '.predict-zone-bet-preset:active{',
              'quick-bet active style owner')
          one('.predict-zone-preset-editing .predict-zone-bet-preset{opacity:.72!important}', '', 'preset edit dim state')
          one('.predict-zone-preset-editing .predict-zone-bet-preset.is-edit-target{opacity:1!important}', '', 'preset edit target state')
          one(',.predict-zone-preset-edit,.predict-zone-chart-grid span',
              ',.predict-zone-chart-grid span',
              'obsolete Edit reduced-motion selector')
          one('cardWidth=Math.min(330,Math.max(250,width-32)),cardHeight=64',
              'cardWidth=Math.min(330,Math.max(250,width-32)),cardHeight=52',
              'preset input measured height')

          css_pattern = re.compile(r'\.predict-zone-preset-input\{display:none!important\}body \.predict-zone-preset-input\.is-open\{.*?\}\.predict-zone-bet-status\{', re.S)
          css_replacement = '''.predict-zone-preset-input{display:none!important}body .predict-zone-preset-input.is-open{position:fixed!important;display:block!important;box-sizing:border-box!important;z-index:99999!important;height:52px!important;margin:0!important;padding:0 16px!important;border:1px solid var(--tg-theme-section-separator-color,rgba(255,255,255,.10))!important;outline:0!important;border-radius:14px!important;background:var(--tg-theme-section-bg-color,var(--tg-theme-secondary-bg-color,#1c1c1e))!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;color:var(--tg-theme-text-color,#fff)!important;-webkit-text-fill-color:var(--tg-theme-text-color,#fff)!important;caret-color:var(--tg-theme-accent-text-color,var(--tg-theme-link-color,#fff))!important;direction:ltr!important;text-align:left!important;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif!important;font-size:17px!important;font-weight:500!important;line-height:1!important;letter-spacing:0!important;font-variant-numeric:tabular-nums!important;appearance:none!important;-webkit-appearance:none!important}.predict-zone-bet-status{'''
          s, count = css_pattern.subn(css_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'preset input CSS: expected exactly 1 match, found {count}')

          new_open = "    function openPresetInput(anchor){if(!presetInput||!anchor)return;if(presetInputAnchor&&presetInputAnchor!==anchor)commitPresetInput();presetInputAnchor=anchor;presetInput.value=String(anchor.getAttribute('data-predict-bet-preset')||'');if(presetInput.parentNode!==document.body)document.body.appendChild(presetInput);presetInput.classList.add('is-open');presetInput.setAttribute('aria-hidden','false');presetInput.setAttribute('tabindex','0');removePresetInputViewportHandler();presetInputViewportHandler=positionPresetInput;var vv=window.visualViewport;if(vv){vv.addEventListener('resize',presetInputViewportHandler);vv.addEventListener('scroll',presetInputViewportHandler)}positionPresetInput();try{presetInput.focus({preventScroll:true});presetInput.select()}catch(e){try{presetInput.focus();presetInput.select()}catch(_){}}}"
          new_close = "    function closePresetInput(save){if(!presetInput)return;if(save)commitPresetInput();removePresetInputViewportHandler();try{presetInput.blur()}catch(e){}presetInput.classList.remove('is-open');presetInput.removeAttribute('style');presetInput.setAttribute('aria-hidden','true');presetInput.setAttribute('tabindex','-1');if(presetInputHome&&presetInput.parentNode!==presetInputHome)presetInputHome.appendChild(presetInput);presetInputAnchor=null}"
          new_set = "    function setPresetEditing(next){if(busy)return;var webapp,buttons=root.querySelectorAll('[data-predict-bet-preset]');if(next&&!presetEditing)beginPresetKeyboardGuard();presetEditing=!!next;if(presetEditing){if(buttons.length)openPresetInput(buttons[0])}else{closePresetInput(true);try{webapp=window.Telegram&&window.Telegram.WebApp;if(webapp&&typeof webapp.hideKeyboard==='function')webapp.hideKeyboard()}catch(e){}resetPresetLabels();updateEstimate();if(window.visualViewport)syncPresetKeyboardGuard();else endPresetKeyboardGuard(true)}syncBetAvailability()}"

          out = []
          counts = {'open': 0, 'close': 0, 'set': 0, 'mirror': 0}
          for line in s.splitlines():
              if line.startswith('    function openPresetInput(anchor){'):
                  out.append(new_open); counts['open'] += 1
              elif line.startswith('    function closePresetInput(save){'):
                  out.append(new_close); counts['close'] += 1
              elif line.startswith('    function setPresetEditing(next){'):
                  out.append(new_set); counts['set'] += 1
              elif line.startswith("    if(presetInput)presetInput.addEventListener('input',"):
                  counts['mirror'] += 1
              else:
                  out.append(line)
          expected = {'open': 1, 'close': 1, 'set': 1, 'mirror': 1}
          if counts != expected:
              raise SystemExit(f'Predict editor anchors mismatch: {counts}')
          s = '\n'.join(out) + ('\n' if original.endswith('\n') else '')

          forbidden = [
              'predict-zone-preset-editing',
              'predict-zone-preset-edit',
              'is-edit-target',
              "presetEdit.classList.toggle('is-editing'",
              "presetEdit.textContent=presetEditing?'Done':'Edit'",
              "presetInput.addEventListener('input'",
          ]
          leftovers = [value for value in forbidden if value in s]
          if leftovers:
              raise SystemExit(f'obsolete Predict edit paths remain: {leftovers}')
          if s.count('class="predict-zone-bet-preset" data-predict-preset-edit') != 1:
              raise SystemExit('Edit does not use the quick-bet visual class exactly once')
          if s.count('body .predict-zone-preset-input.is-open') != 1:
              raise SystemExit('preset input visual path is missing or duplicated')
          if '--tg-theme-section-bg-color' not in s or '--tg-theme-text-color' not in s:
              raise SystemExit('Telegram theme variables missing from preset input')
          if 'grid-template-columns:repeat(3,minmax(0,1fr)) 54px!important' not in s:
              raise SystemExit('54px Edit geometry changed unexpectedly')
          if 'body.vexa-predict-preset-keyboard:has(#predictzone.active) .tabs{display:none!important}' not in s:
              raise SystemExit('keyboard navigation guard missing')
          if s.count('function setPresetEditing(next)') != 1 or s.count('function openPresetInput(anchor)') != 1:
              raise SystemExit('Predict preset editor path is not singular')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate emitted Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('src/miniapp/predict-zone.ts','utf8');
          const marker='export const PREDICT_ZONE_SCRIPT = `';
          const a=src.indexOf(marker); if(a<0) throw new Error('Predict script marker missing');
          const b=a+marker.length,e=src.indexOf('\n`;',b); if(e<0) throw new Error('Predict script end missing');
          const cooked=Function('PREDICT_ERROR_TEXTS','return `'+src.slice(b,e)+'`;')({en:{}});
          new Function(cooked);
          if((src.match(/function setPresetEditing\(next\)/g)||[]).length!==1) throw new Error('duplicate preset edit path');
          if((src.match(/function openPresetInput\(anchor\)/g)||[]).length!==1) throw new Error('duplicate preset input path');
          if(src.includes('predict-zone-preset-editing')||src.includes('is-edit-target')||src.includes("presetInput.addEventListener('input'")) throw new Error('obsolete visual edit state remains');
          if(!src.includes('--tg-theme-section-bg-color')||!src.includes('--tg-theme-text-color')) throw new Error('Telegram theme input styling missing');
          console.log('Predict preset input cleanup validation OK');
          NODE

      - name: Commit source and remove one-shot executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-preset-input-cleanup-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | paste -sd ' ' -)" = ".github/workflows/_predict-preset-input-cleanup-once.yml src/miniapp/predict-zone.ts"
          git commit -m "Clean Predict preset input editing path"
          git push origin HEAD:main
