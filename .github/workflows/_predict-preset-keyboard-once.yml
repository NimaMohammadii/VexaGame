name: Apply Predict preset keyboard fix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Predict preset keyboard fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch authoritative Predict path only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/miniapp/predict-zone.ts')
          s=p.read_text(encoding='utf-8')
          original=s

          def one(a,b,label):
              global s
              n=s.count(a)
              if n!=1: raise SystemExit(f'{label}: expected 1, found {n}')
              s=s.replace(a,b,1)

          one('grid-template-columns:repeat(3,minmax(0,1fr)) 52px!important','grid-template-columns:repeat(4,minmax(0,1fr))!important','quick-bet geometry')

          anchor='.predict-zone-bet-status.good{color:rgba(185,255,210,.9)}'
          one(anchor,anchor+'\nbody.vexa-predict-preset-keyboard:has(#predictzone.active) .app{height:var(--predict-edit-layout-height,100vh)!important}body.vexa-predict-preset-keyboard:has(#predictzone.active) .content{height:calc(var(--predict-edit-layout-height,100vh) - 72px - 94px - env(safe-area-inset-top) - env(safe-area-inset-bottom))!important}body.vexa-predict-preset-keyboard:has(#predictzone.active) .tabs{display:none!important}','keyboard guard CSS')

          one('var presetEditing=false,limitNoticeTimer=0,','var presetEditing=false,presetKeyboardGuard=false,presetViewportBaseline=0,limitNoticeTimer=0,','keyboard state')

          helpers=[
            "    function presetViewportHeight(){var vv=window.visualViewport;return Math.max(0,Number(vv&&vv.height)||Number(window.innerHeight)||0)}",
            "    function beginPresetKeyboardGuard(){var app=document.querySelector('main.app'),height=app&&app.getBoundingClientRect?app.getBoundingClientRect().height:0;presetKeyboardGuard=true;presetViewportBaseline=presetViewportHeight();if(height>0)document.documentElement.style.setProperty('--predict-edit-layout-height',Math.round(height)+'px');document.body.classList.add('vexa-predict-preset-keyboard')}",
            "    function endPresetKeyboardGuard(force){if(!presetKeyboardGuard)return;var height=presetViewportHeight();if(!force&&presetViewportBaseline&&height<presetViewportBaseline-80)return;presetKeyboardGuard=false;presetViewportBaseline=0;document.body.classList.remove('vexa-predict-preset-keyboard');document.documentElement.style.removeProperty('--predict-edit-layout-height')}",
            "    function syncPresetKeyboardGuard(){if(!presetKeyboardGuard||presetEditing)return;endPresetKeyboardGuard(false)}",
          ]
          setter="    function setPresetEditing(next){if(busy)return;var active,webapp;if(next&&!presetEditing)beginPresetKeyboardGuard();presetEditing=!!next;root.classList.toggle('predict-zone-preset-editing',presetEditing);if(presetEdit){presetEdit.classList.toggle('is-editing',presetEditing);presetEdit.textContent=presetEditing?'Done':'Edit'}var buttons=root.querySelectorAll('[data-predict-bet-preset]');buttons.forEach(function(btn){var value=btn.querySelector('[data-predict-preset-value]');if(!value){btn.innerHTML='<span data-predict-preset-value></span>';value=btn.querySelector('[data-predict-preset-value]')}if(!value)return;if(presetEditing){value.textContent=String(btn.getAttribute('data-predict-bet-preset')||'');value.setAttribute('contenteditable','true');value.setAttribute('inputmode','decimal');value.setAttribute('role','textbox');value.setAttribute('aria-label','Bet amount');value.spellcheck=false}else{var currentValue=String(btn.getAttribute('data-predict-bet-preset')||''),clean=normalizedPreset(value.textContent,currentValue);btn.setAttribute('data-predict-bet-preset',clean);value.removeAttribute('contenteditable');value.removeAttribute('inputmode');value.removeAttribute('role');value.removeAttribute('aria-label')}});if(presetEditing){var first=root.querySelector('[data-predict-preset-value][contenteditable=\"true\"]');if(first)try{first.focus({preventScroll:true})}catch(_){try{first.focus()}catch(__){}}}else{active=document.activeElement;if(active&&root.contains(active)&&active.matches&&active.matches('[data-predict-preset-value]'))try{active.blur()}catch(e){}try{webapp=window.Telegram&&window.Telegram.WebApp;if(webapp&&typeof webapp.hideKeyboard==='function')webapp.hideKeyboard()}catch(e){}resetPresetLabels();updateEstimate();if(window.visualViewport)syncPresetKeyboardGuard();else endPresetKeyboardGuard(true)}syncBetAvailability()}"

          out=[]; helpers_added=0; setter_replaced=0
          for line in s.splitlines():
              if line.startswith('    function normalizedPreset(value,fallback){'):
                  out.append(line); out.extend(helpers); helpers_added+=1; continue
              if line.startswith('    function setPresetEditing(next){'):
                  out.append(setter); setter_replaced+=1; continue
              out.append(line)
          if helpers_added!=1 or setter_replaced!=1: raise SystemExit(f'Predict edit anchors mismatch helpers={helpers_added} setter={setter_replaced}')
          s='\n'.join(out)+('\n' if original.endswith('\n') else '')

          listener="    document.addEventListener('visibilitychange',syncActiveState);"
          one(listener,"    if(window.visualViewport)window.visualViewport.addEventListener('resize',syncPresetKeyboardGuard);window.addEventListener('focus',syncPresetKeyboardGuard);window.addEventListener('pageshow',syncPresetKeyboardGuard);\n"+listener,'keyboard events')

          checks={
            'setter':s.count('function setPresetEditing(next)'),
            'guard':s.count('function beginPresetKeyboardGuard()'),
            'release':s.count('function endPresetKeyboardGuard(force)'),
            'sync':s.count('function syncPresetKeyboardGuard()'),
            'resize':s.count("visualViewport.addEventListener('resize',syncPresetKeyboardGuard)"),
          }
          if any(v!=1 for v in checks.values()): raise SystemExit(f'non-singular Predict edit path: {checks}')
          if 'grid-template-columns:repeat(3,minmax(0,1fr)) 52px!important' in s: raise SystemExit('old narrow Edit card remains')
          if s.count('grid-template-columns:repeat(4,minmax(0,1fr))!important')!=1: raise SystemExit('equal quick-bet geometry missing/duplicate')
          if s.count('vexa-predict-preset-keyboard')!=5: raise SystemExit('keyboard guard class mismatch')
          if s.count('hideKeyboard')!=2: raise SystemExit('Telegram hideKeyboard path mismatch')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate emitted Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('src/miniapp/predict-zone.ts','utf8');
          const marker='export const PREDICT_ZONE_SCRIPT = `';
          const a=src.indexOf(marker); if(a<0) throw new Error('Predict script marker missing');
          const b=a+marker.length,e=src.indexOf('\n`;',b); if(e<0) throw new Error('Predict script end missing');
          const cooked=Function('PREDICT_ERROR_TEXTS','return `'+src.slice(b,e)+'`;')({en:{}});
          new Function(cooked);
          if((src.match(/function setPresetEditing\(next\)/g)||[]).length!==1) throw new Error('duplicate edit path');
          if(!src.includes("window.visualViewport.addEventListener('resize',syncPresetKeyboardGuard)")) throw new Error('VisualViewport listener missing');
          if(!src.includes('body.vexa-predict-preset-keyboard:has(#predictzone.active) .tabs{display:none!important}')) throw new Error('bottom nav keyboard guard missing');
          console.log('Predict-only validation OK');
          NODE

      - name: Commit Predict source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-preset-keyboard-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | paste -sd ' ' -)" = ".github/workflows/_predict-preset-keyboard-once.yml src/miniapp/predict-zone.ts"
          git commit -m "Fix Predict preset edit keyboard layout"
          git push origin HEAD:main
