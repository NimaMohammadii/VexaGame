name: Predict preset persistence once
on:
  push:
    paths:
      - .github/workflows/_predict-preset-persist-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Predict preset persistence only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/miniapp/predict-zone.ts')
          s=p.read_text()
          def once(old,new):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'anchor count {n}: {old[:80]}')
              s=s.replace(old,new,1)

          once("    function minimumErrorText(amount){var clean=String(amount||'').trim();return predictText('minimum')+(clean?' Minimum: '+clean+' GRAM ($1).':'')}\n",
               "    function minimumDisplayAmount(amount){var n=Number(String(amount||'').trim().replace(',','.'));if(!isFinite(n)||n<=0)return'';return String(Math.ceil((n*100)-1e-9)/100)}\n    function minimumErrorText(amount){var clean=minimumDisplayAmount(amount);return predictText('minimum')+(clean?' Minimum: '+clean+' GRAM ($1).':'')}\n")

          once("    function normalizedPreset(value,fallback){var n=Number(String(value||'').trim().replace(',','.'));if(!isFinite(n)||n<=0)return String(fallback||'');return String(Number(n.toFixed(4)))}\n    function editPresetWithNativePrompt(anchor){if(!anchor)return;var current=String(anchor.getAttribute('data-predict-bet-preset')||''),next=null;try{next=window.prompt('Enter GRAM amount',current)}catch(e){return}if(next===null)return;var clean=normalizedPreset(next,current),value=anchor.querySelector('[data-predict-preset-value]');anchor.setAttribute('data-predict-bet-preset',clean);if(value)value.textContent=clean;resetPresetLabels();updateEstimate()}\n",
               "    function normalizedPreset(value,fallback){var n=Number(String(value||'').trim().replace(',','.'));if(!isFinite(n)||n<=0)return String(fallback||'');return String(Number(n.toFixed(4)))}\n    function presetStorageKey(){var id=uid();return id?'vexaPredictBetPresets:v1:'+id:''}\n    function presetButtons(){return Array.prototype.slice.call(root.querySelectorAll('[data-predict-bet-preset]')).slice(0,3)}\n    function savePresetValues(){var key=presetStorageKey(),buttons=presetButtons();if(!key||buttons.length!==3)return;var values=buttons.map(function(btn){return normalizedPreset(btn.getAttribute('data-predict-bet-preset'),'')});if(values.some(function(value){return !value}))return;try{localStorage.setItem(key,JSON.stringify(values))}catch(e){}}\n    function restorePresetValues(){var key=presetStorageKey(),buttons=presetButtons(),saved=null;if(!key||buttons.length!==3)return;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!Array.isArray(saved)||saved.length!==3)return;buttons.forEach(function(btn,index){var current=String(btn.getAttribute('data-predict-bet-preset')||''),clean=normalizedPreset(saved[index],current);btn.setAttribute('data-predict-bet-preset',clean)});resetPresetLabels()}\n    function editPresetWithNativePrompt(anchor){if(!anchor)return;var current=String(anchor.getAttribute('data-predict-bet-preset')||''),next=null;try{next=window.prompt('Enter GRAM amount',current)}catch(e){return}if(next===null)return;var clean=normalizedPreset(next,current),value=anchor.querySelector('[data-predict-preset-value]');anchor.setAttribute('data-predict-bet-preset',clean);if(value)value.textContent=clean;savePresetValues();resetPresetLabels();updateEstimate()}\n")

          once("    setupHistoryDrawer();\n",
               "    restorePresetValues();\n    setupHistoryDrawer();\n")

          p.write_text(s)
          PY
      - name: Validate exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "src/miniapp/predict-zone.ts"
          grep -q "function minimumDisplayAmount" src/miniapp/predict-zone.ts
          grep -q "vexaPredictBetPresets:v1:" src/miniapp/predict-zone.ts
          grep -q "savePresetValues();resetPresetLabels();updateEstimate()" src/miniapp/predict-zone.ts
          grep -q "restorePresetValues();" src/miniapp/predict-zone.ts
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if grep -E 'src/miniapp/predict-zone\.ts' /tmp/tsc.log; then
            cat /tmp/tsc.log
            exit 1
          fi
          echo "predict-zone.ts has no TypeScript diagnostics. Full repo tsc status: $status"
      - name: Commit and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_predict-preset-persist-once.yml
          git add src/miniapp/predict-zone.ts
          git commit -m "Persist Predict bet presets per user"
          git push origin HEAD:main
