name: Predict prompt bounce fix once

on:
  push:
    paths:
      - .github/workflows/_predict-prompt-bounce-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Predict native prompt interaction only
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/miniapp/predict-zone.ts')
          s = p.read_text(encoding='utf-8')
          old = "    function editPresetWithNativePrompt(anchor){if(!anchor)return;var current=String(anchor.getAttribute('data-predict-bet-preset')||''),next=null;try{next=window.prompt('Enter GRAM amount',current)}catch(e){return}if(next===null)return;var clean=normalizedPreset(next,current),value=anchor.querySelector('[data-predict-preset-value]');anchor.setAttribute('data-predict-bet-preset',clean);if(value)value.textContent=clean;savePresetValues();resetPresetLabels();updateEstimate()}\n"
          new = "    var presetPromptPending=false;\n    function editPresetWithNativePrompt(anchor){if(!anchor||presetPromptPending)return;var current=String(anchor.getAttribute('data-predict-bet-preset')||''),scrollTop=Math.max(0,Number(root.scrollTop)||0);presetPromptPending=true;try{if(document.activeElement===anchor)anchor.blur()}catch(e){}setTimeout(function(){if(!presetEditing||busy||!isActive()||!root.contains(anchor)){presetPromptPending=false;return}var next=null;try{next=window.prompt('Enter GRAM amount',current)}catch(e){presetPromptPending=false;return}presetPromptPending=false;if(next!==null){var clean=normalizedPreset(next,current),value=anchor.querySelector('[data-predict-preset-value]');anchor.setAttribute('data-predict-bet-preset',clean);if(value)value.textContent=clean;savePresetValues();resetPresetLabels();updateEstimate()}if(Math.abs((Number(root.scrollTop)||0)-scrollTop)>1)root.scrollTop=scrollTop;if(window.requestAnimationFrame)requestAnimationFrame(function(){if(Math.abs((Number(root.scrollTop)||0)-scrollTop)>1)root.scrollTop=scrollTop})},180)}\n"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Predict prompt anchor expected exactly once, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "src/miniapp/predict-zone.ts"
          git diff --check -- src/miniapp/predict-zone.ts
          grep -Fq "var presetPromptPending=false" src/miniapp/predict-zone.ts
          grep -Fq "anchor.blur()" src/miniapp/predict-zone.ts
          grep -Fq "root.scrollTop=scrollTop" src/miniapp/predict-zone.ts
          grep -Fq "},180)}" src/miniapp/predict-zone.ts
          grep -Fq "savePresetValues();resetPresetLabels();updateEstimate()" src/miniapp/predict-zone.ts
          grep -Fq "grid-template-columns:repeat(3,minmax(0,1fr)) 54px!important" src/miniapp/predict-zone.ts
          test "$(grep -Fo "window.prompt('Enter GRAM amount',current)" src/miniapp/predict-zone.ts | wc -l | tr -d ' ')" = "1"
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if grep -E 'src/miniapp/predict-zone\.ts' /tmp/tsc.log; then
            cat /tmp/tsc.log
            exit 1
          fi
          echo "predict-zone.ts has no TypeScript diagnostics. Full repo tsc status: $status"

      - name: Commit source only and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_predict-prompt-bounce-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/_predict-prompt-bounce-once.yml' 'src/miniapp/predict-zone.ts' | sort)"
          test "$staged" = "$expected"
          git commit -m "Fix Predict native prompt bounce"
          git pull --rebase origin main
          git push origin HEAD:main
