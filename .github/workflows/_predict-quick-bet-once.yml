name: Apply Predict quick bet UI once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Predict quick bet UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Replace old Predict bet panel with single quick-bet path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/predict-zone.ts')
          text = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          old_markup = '''      <div class="predict-zone-bet-stage" data-predict-bet-stage aria-hidden="true">
        <label class="predict-zone-bet-input-wrap"><input class="predict-zone-bet-input" data-predict-bet-input type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" /><span class="predict-zone-bet-estimate" data-predict-bet-estimate></span><span class="predict-zone-bet-side"><span class="predict-zone-bet-token">GRAM</span><span class="predict-zone-bet-usd" data-predict-bet-usd>≈ $0.00</span></span></label>
        <div class="predict-zone-bet-presets"><button type="button" data-predict-bet-preset="1">1</button><button type="button" data-predict-bet-preset="5">5</button><button type="button" data-predict-bet-preset="10">10</button><button type="button" data-predict-bet-preset="25">25</button></div>
        <button type="button" class="predict-zone-bet-submit" data-predict-bet-submit>Place prediction</button>
        <div class="predict-zone-bet-status" data-predict-bet-status role="status" aria-live="polite"></div>
      </div>'''
          new_markup = '''      <div class="predict-zone-quick-bets" data-predict-quick-bets>
        <button type="button" class="predict-zone-bet-preset" data-predict-bet-preset="1"><span data-predict-preset-value>1</span></button>
        <button type="button" class="predict-zone-bet-preset" data-predict-bet-preset="5"><span data-predict-preset-value>5</span></button>
        <button type="button" class="predict-zone-bet-preset" data-predict-bet-preset="10"><span data-predict-preset-value>10</span></button>
        <button type="button" class="predict-zone-preset-edit" data-predict-preset-edit>Edit</button>
      </div>
      <div class="predict-zone-bet-status" data-predict-bet-status role="status" aria-live="polite"></div>'''
          once(old_markup, new_markup, 'bet markup')

          lines = text.splitlines()
          out = []
          replaced_action_css = replaced_quick_css = removed_old_css = 0
          action_css = '''.predict-zone-decision-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 8px;color:rgba(255,255,255,.40);font-size:11px;font-weight:800;max-height:26px;opacity:1;transform:translate3d(0,0,0);overflow:hidden}.predict-zone-decision-head strong{color:rgba(255,255,255,.68);font-size:11px;font-weight:900;white-space:nowrap}.predict-zone-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:9px!important;margin:0 0 8px!important}.predict-zone-choice{position:relative!important;overflow:hidden!important;height:48px!important;padding:0 14px!important;border:1px solid rgba(255,255,255,.07)!important;border-radius:15px!important;color:#fff!important;font-size:13px!important;font-weight:950!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;background:rgba(16,9,12,.72)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(255,255,255,.035)!important;backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important;transform:translateZ(0)!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;transition:transform .18s ease,border-color .18s ease,background .18s ease,opacity .18s ease!important}.predict-zone-choice>span:last-child{font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-weight:700!important;letter-spacing:-.02em!important;font-variant-numeric:tabular-nums!important}.predict-zone-choice-symbol{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;font-size:18px;font-weight:950;line-height:1}.predict-zone-choice-up .predict-zone-choice-symbol{color:#d7e9dd}.predict-zone-choice-down .predict-zone-choice-symbol{color:#e7c9d2}.predict-zone-choice-up.selected{background:rgba(50,96,66,.30)!important;border-color:rgba(157,219,177,.24)!important}.predict-zone-choice-down.selected{background:rgba(104,39,58,.30)!important;border-color:rgba(232,157,177,.22)!important}.predict-zone-choice:active{transform:scale(.97)!important}.predict-zone-actions button.predict-zone-choice:disabled{opacity:.42!important;cursor:not-allowed!important;transform:none!important}'''
          quick_css = '''.predict-zone-quick-bets{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr)) 60px!important;gap:7px!important;margin:0!important}.predict-zone-bet-preset,.predict-zone-preset-edit{height:38px!important;min-width:0!important;padding:0 8px!important;border:1px solid rgba(255,255,255,.065)!important;border-radius:14px!important;background:rgba(10,10,10,.58)!important;color:#fff!important;font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-size:12px!important;font-weight:760!important;letter-spacing:-.02em!important;font-variant-numeric:tabular-nums!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)!important;backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;transition:transform .16s ease,border-color .16s ease,background .16s ease,opacity .16s ease!important}.predict-zone-bet-preset:active,.predict-zone-preset-edit:active{transform:scale(.96)!important}.predict-zone-bet-preset:disabled{opacity:.38!important}.predict-zone-preset-edit{font-size:11px!important;font-weight:800!important;color:rgba(255,255,255,.58)!important;background:rgba(255,255,255,.035)!important}.predict-zone-preset-edit.is-editing{color:rgba(255,255,255,.92)!important;border-color:rgba(255,255,255,.14)!important;background:rgba(255,255,255,.07)!important}.predict-zone-bet-preset [data-predict-preset-value]{display:inline-block;min-width:1.5em;outline:0!important}.predict-zone-preset-editing .predict-zone-bet-preset{border-color:rgba(255,255,255,.14)!important;background:rgba(255,255,255,.055)!important}.predict-zone-preset-editing .predict-zone-bet-preset [data-predict-preset-value]{cursor:text;user-select:text;-webkit-user-select:text}.predict-zone-bet-status{display:block;min-height:0;margin:6px 0 0;text-align:center;color:rgba(255,255,255,.42);font-size:10px;font-weight:760}.predict-zone-bet-status:empty{display:none}.predict-zone-bet-status.bad{color:rgba(255,160,160,.9)}.predict-zone-bet-status.good{color:rgba(185,255,210,.9)}'''
          old_prefixes = (
              '.predict-zone-bet-stage{',
              '.predict-zone-bet-input-wrap{',
              '.predict-zone-bet-input{',
              '.predict-zone-bet-estimate:not(',
              '.predict-zone-bet-presets{',
              '.predict-zone-glass-card.bet-transition ',
              '.predict-zone-glass-card.bet-mode ',
              'html body:has(#predictzone.predict-zone-keyboard-open.active)',
          )
          for line in lines:
              if line.startswith('.predict-zone-decision-head{'):
                  out.append(action_css)
                  replaced_action_css += 1
                  continue
              if line.startswith('.predict-zone-bet-presets{'):
                  out.append(quick_css)
                  replaced_quick_css += 1
                  continue
              if line.startswith(old_prefixes):
                  removed_old_css += 1
                  continue
              if '.predict-zone-bet-submit' in line and line.startswith('.predict-zone-choice>span:last-child:not'):
                  line = line.replace(',.predict-zone-bet-submit','')
              if line.startswith('@media(max-width:380px){'):
                  line = line.replace('.predict-zone-glass-card{height:408px!important;', '.predict-zone-glass-card{height:454px!important;', 1)
                  line = line.replace('.predict-zone-actions{max-height:40px}', '.predict-zone-actions{margin-bottom:7px!important}.predict-zone-choice{height:46px!important}', 1)
              if line.startswith('@media(prefers-reduced-motion:reduce){'):
                  line = line.replace(',.predict-zone-glass-card,.predict-zone-live-meta,.predict-zone-chart-preview,.predict-zone-bet-stage,.predict-zone-bet-presets button,.predict-zone-bet-submit,', ',.predict-zone-glass-card,.predict-zone-live-meta,.predict-zone-chart-preview,.predict-zone-bet-preset,.predict-zone-preset-edit,')
              out.append(line)
          if replaced_action_css != 1 or replaced_quick_css != 1:
              raise SystemExit(f'CSS replacements mismatch: action={replaced_action_css}, quick={replaced_quick_css}')
          if removed_old_css < 5:
              raise SystemExit(f'expected old bet CSS removals, got {removed_old_css}')
          text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')
          text = text.replace('.predict-zone-glass-card{position:relative!important;width:100%!important;height:432px!important;', '.predict-zone-glass-card{position:relative!important;width:100%!important;height:478px!important;', 1)

          once("side='up',busy=false", "side='',busy=false", 'default side')
          once("    var betStage=root.querySelector('[data-predict-bet-stage]'),betInput=root.querySelector('[data-predict-bet-input]'),betUsd=root.querySelector('[data-predict-bet-usd]'),betEstimate=root.querySelector('[data-predict-bet-estimate]'),betStatus=root.querySelector('[data-predict-bet-status]'),betSubmit=root.querySelector('[data-predict-bet-submit]'),eventSummary=root.querySelector('[data-predict-event-summary]')", "    var betStatus=root.querySelector('[data-predict-bet-status]'),presetEdit=root.querySelector('[data-predict-preset-edit]'),eventSummary=root.querySelector('[data-predict-event-summary]')", 'bet selectors')
          once("    var betOpen=false,betCloseTimer=0,keyboardCloseTimer=0,betAnimationTimer=0,limitNoticeTimer=0,", "    var presetEditing=false,limitNoticeTimer=0,", 'bet state')
          once("    function formatEstimate(v){return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:8})}\n", "", 'unused estimate formatter')

          old_labels = "    function setChoiceLabels(events){root.querySelectorAll('[data-predict-choice]').forEach(function(btn){var isFirst=btn.getAttribute('data-predict-choice')==='up'||btn.getAttribute('data-predict-choice')==='yes',label=btn.querySelector('span:last-child');btn.setAttribute('data-predict-choice',events?(isFirst?'yes':'no'):(isFirst?'up':'down'));if(label)label.textContent=events?(isFirst?'Yes':'No'):(isFirst?'Up':'Down')});if(!events)renderPolymarketChoicePrices()}"
          new_labels = "    function setChoiceLabels(events){side='';root.querySelectorAll('[data-predict-choice]').forEach(function(btn){var isFirst=btn.getAttribute('data-predict-choice')==='up'||btn.getAttribute('data-predict-choice')==='yes',label=btn.querySelector('span:last-child');btn.setAttribute('data-predict-choice',events?(isFirst?'yes':'no'):(isFirst?'up':'down'));btn.classList.remove('selected');if(label)label.textContent=events?(isFirst?'Yes':'No'):(isFirst?'Up':'Down')});if(!events)renderPolymarketChoicePrices()}"
          once(old_labels, new_labels, 'choice reset')

          old_sync = "    function syncBetAvailability(){var reason=currentBetBlockReason(),visible=visibleBetBlockReason(reason);root.querySelectorAll('button[data-predict-choice]').forEach(function(btn){btn.disabled=!!reason&&reason!=='Add GRAM to predict'});if(visible&&trendLabel)trendLabel.textContent=visible}"
          new_sync = "    function syncBetAvailability(){var reason=currentBetBlockReason(),visible=visibleBetBlockReason(reason);root.querySelectorAll('button[data-predict-choice]').forEach(function(btn){btn.disabled=!!reason&&reason!=='Add GRAM to predict'});root.querySelectorAll('button[data-predict-bet-preset]').forEach(function(btn){btn.disabled=presetEditing?false:(!!reason||busy)});if(presetEdit)presetEdit.disabled=busy;if(visible&&trendLabel)trendLabel.textContent=visible}"
          once(old_sync, new_sync, 'availability')

          old_reset = "    function resetPresetLabels(){root.querySelectorAll('[data-predict-bet-preset]').forEach(function(btn){btn.textContent=String(btn.getAttribute('data-predict-bet-preset')||'')})}"
          new_reset = "    function resetPresetLabels(){if(presetEditing)return;root.querySelectorAll('[data-predict-bet-preset]').forEach(function(btn){var rawAmount=String(btn.getAttribute('data-predict-bet-preset')||''),value=btn.querySelector('[data-predict-preset-value]');if(!value){btn.innerHTML='<span data-predict-preset-value></span>';value=btn.querySelector('[data-predict-preset-value]')}if(value)value.textContent=rawAmount})}"
          once(old_reset, new_reset, 'preset reset')
          once("    function renderPresetQuotes(){if(eventMode||market!=='bitcoin'||priceProvider!=='polymarket'){resetPresetLabels();return}", "    function renderPresetQuotes(){if(presetEditing)return;if(eventMode||market!=='bitcoin'||priceProvider!=='polymarket'){resetPresetLabels();return}", 'quote edit guard')

          # remove old estimate-card renderer and old reference in stopQuoteFeed
          start = text.find("    function renderBetEstimateQuote(quote){")
          if start < 0:
              raise SystemExit('renderBetEstimateQuote not found')
          end = text.find("\n", start)
          text = text[:start] + text[end+1:]
          once(";resetPresetLabels();if(betEstimate&&market==='bitcoin'&&priceProvider==='polymarket')betEstimate.textContent=''", ";resetPresetLabels()", 'stop quote estimate cleanup')

          old_estimate = "    function estimate(amount){if(!eventMode&&market==='bitcoin'&&priceProvider==='polymarket'){var quote=polymarketQuoteFor(amount,side);return quote&&quote.available?quote.payoutGram:0}var pools=currentRound&&currentRound.pools;if(!amount||!pools)return 0;var chosen=eventMode?(side==='no'?'no':'yes'):(side==='down'?'down':'up'),other=eventMode?(chosen==='yes'?'no':'yes'):(chosen==='up'?'down':'up'),own=Number(pools[chosen]&&pools[chosen].stakeTon||0),opp=Number(pools[other]&&pools[other].stakeTon||0);if(opp<=0)return 0;return(amount/(own+amount))*(opp*.95)}\n"
          once(old_estimate, "", 'old estimate function')
          old_update_estimate = "    function updateEstimate(){var amount=Number(betInput&&betInput.value||0),liveGramUsd=readGramUsd();if(liveGramUsd>0)gramUsd=liveGramUsd;if(betUsd){betUsd.textContent=amount<=0?'≈ $0.00':gramUsd>0?'≈ $'+(amount*gramUsd).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'≈ …'}if(betEstimate){if(amount<=0)betEstimate.textContent='';else if(!eventMode&&market==='bitcoin'&&priceProvider==='polymarket'){var quote=polymarketQuoteFor(amount,side);renderBetEstimateQuote(quote)}else betEstimate.textContent='+'+formatEstimate(estimate(amount))}renderPresetQuotes()}"
          new_update_estimate = "    function updateEstimate(){var liveGramUsd=readGramUsd();if(liveGramUsd>0)gramUsd=liveGramUsd;renderPresetQuotes()}"
          once(old_update_estimate, new_update_estimate, 'estimate UI cleanup')

          old_bet_flow_start = text.find("    function finishBetClose(){")
          old_bet_flow_end = text.find("\n    function submitBet(){", old_bet_flow_start)
          if old_bet_flow_start < 0 or old_bet_flow_end < 0:
              raise SystemExit('old bet flow block not found')
          new_bet_flow = '''    function selectBetSide(nextSide){var blocked=currentBetBlockReason();if(blocked){if(blocked==='Add GRAM to predict')openCreditWallet(predictText('insufficient'));if(trendLabel)trendLabel.textContent=visibleBetBlockReason(blocked)||'Waiting for price';return}side=eventMode?(nextSide==='no'?'no':'yes'):(nextSide==='down'?'down':'up');root.querySelectorAll('[data-predict-choice]').forEach(function(btn){btn.classList.toggle('selected',btn.getAttribute('data-predict-choice')===side)});setStatus('','');loadGramUsd();updateEstimate();syncBetAvailability()}
    function normalizedPreset(value,fallback){var n=Number(String(value||'').trim().replace(',','.'));if(!isFinite(n)||n<=0)return String(fallback||'');return String(Number(n.toFixed(4)))}
    function setPresetEditing(next){if(busy)return;presetEditing=!!next;root.classList.toggle('predict-zone-preset-editing',presetEditing);if(presetEdit){presetEdit.classList.toggle('is-editing',presetEditing);presetEdit.textContent=presetEditing?'Done':'Edit'}var buttons=root.querySelectorAll('[data-predict-bet-preset]');buttons.forEach(function(btn){var value=btn.querySelector('[data-predict-preset-value]');if(!value){btn.innerHTML='<span data-predict-preset-value></span>';value=btn.querySelector('[data-predict-preset-value]')}if(!value)return;if(presetEditing){value.textContent=String(btn.getAttribute('data-predict-bet-preset')||'');value.setAttribute('contenteditable','true');value.setAttribute('inputmode','decimal');value.setAttribute('role','textbox');value.setAttribute('aria-label','Bet amount');value.spellcheck=false}else{var current=String(btn.getAttribute('data-predict-bet-preset')||''),clean=normalizedPreset(value.textContent,current);btn.setAttribute('data-predict-bet-preset',clean);value.removeAttribute('contenteditable');value.removeAttribute('inputmode');value.removeAttribute('role');value.removeAttribute('aria-label')}});if(presetEditing){var first=root.querySelector('[data-predict-preset-value][contenteditable="true"]');if(first)try{first.focus({preventScroll:true})}catch(_){try{first.focus()}catch(__){}}}else{resetPresetLabels();updateEstimate()}syncBetAvailability()}
'''
          text = text[:old_bet_flow_start] + new_bet_flow + text[old_bet_flow_end+1:]

          old_submit_start = text.find("    function submitBet(){")
          old_submit_end = text.find("\n    function updateMenu(){", old_submit_start)
          if old_submit_start < 0 or old_submit_end < 0:
              raise SystemExit('submitBet block not found')
          new_submit = '''    function submitBet(amount){if(busy)return;amount=Number(amount||0);var id=uid(),initData=telegramInitData(),blocked=currentBetBlockReason();if(!side){setStatus(predictText('chooseSide'),'bad');return}if(blocked){if(blocked==='Add GRAM to predict')openCreditWallet(predictText('insufficient'));setStatus(visibleBetBlockReason(blocked)||predictText('generic'),'bad');return}if(!id||!initData){setStatus(predictText('openTelegram'),'bad');return}if(!amount||amount<=0){setStatus(predictText('validAmount'),'bad');return}if(Math.floor(amount*1000000000)>balanceNano){setStatus(predictText('insufficient'),'bad');openCreditWallet(predictText('insufficient'));return}busy=true;syncBetAvailability();setStatus('Checking balance...','');fetch(eventMode?'/app/api/prediction-events/bet':'/app/api/predict-bet',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(eventMode?{userId:id,initData:initData,eventId:currentEvent&&currentEvent.id,pick:side,stakeTon:amount}:{userId:id,initData:initData,market:market,side:side,stakeTon:amount,tonUsdSnapshot:readGramUsd()||gramUsd})}).then(function(r){return r.json().then(function(j){return{ok:r.ok,json:j}})}).then(function(x){if(!x.ok||!x.json||x.json.ok===false)throw new Error((x.json&&x.json.error)||'Could not place prediction');updateBalance(x.json);setStatus('Prediction placed.','good');if(eventMode&&x.json.event){renderEvent(x.json.event)}else if(x.json.round&&x.json.round.round){currentRound=x.json.round.round;roundLockDeadline=Date.now()+Math.max(0,Number(currentRound.lockRemainingMs||0));syncQuoteFeed(currentRound);renderHistory(currentRound);renderRoundMeta(currentRound);if(market!=='bitcoin')renderMarketPeriod(currentRound);syncBetAvailability();syncTrend()}updateEstimate()}).catch(function(e){var rawMessage=e&&e.message?String(e.message):'Could not place prediction.',message=friendlyPredictError(rawMessage),regionError=isPredictRegionError(rawMessage);if(String(rawMessage).toLowerCase().indexOf('insufficient balance')!==-1)openCreditWallet(message);if(isBetLimitMessage(rawMessage))showBetLimitNotice(rawMessage,message);if(regionError){setStatus('','');setRegionSheet(true,message)}else setStatus(message,'bad')}).finally(function(){busy=false;syncBetAvailability()})}'''
          text = text[:old_submit_start] + new_submit + text[old_submit_end:]

          once("stopClock();closeBet(true);currentRound=null", "stopClock();side='';root.querySelectorAll('[data-predict-choice]').forEach(function(btn){btn.classList.remove('selected')});currentRound=null", 'market access old close')
          once("freezeChartTimeline();stopClock();pauseQuoteFeed();stopFeed();setKeyboardOpen(false);closeBet(true)", "freezeChartTimeline();stopClock();pauseQuoteFeed();stopFeed();if(presetEditing)setPresetEditing(false)", 'suspend old bet cleanup')

          old_listeners = '''    root.addEventListener('input',function(e){if(e.target===betInput)updateEstimate()},true);
    root.addEventListener('focusin',function(e){if(e.target===betInput)setKeyboardOpen(true)},true);
    root.addEventListener('focusout',function(e){if(e.target!==betInput)return;if(keyboardCloseTimer)clearTimeout(keyboardCloseTimer);keyboardCloseTimer=setTimeout(function(){keyboardCloseTimer=0;if(document.activeElement!==betInput)setKeyboardOpen(false)},260)},true);
    root.addEventListener('click',function(e){var target=e.target;if(!target)return;var preset=target.closest&&target.closest('[data-predict-bet-preset]');if(preset&&betInput){e.preventDefault();betInput.value=preset.getAttribute('data-predict-bet-preset')||'';updateEstimate();return}var choice=target.closest&&target.closest('[data-predict-choice]');if(choice){e.preventDefault();openBet(choice.getAttribute('data-predict-choice'));return}var submit=target.closest&&target.closest('[data-predict-bet-submit]');if(submit&&betOpen){e.preventDefault();submitBet()}},true);'''
          new_listeners = '''    root.addEventListener('keydown',function(e){var target=e.target;if(!presetEditing||!target||!target.matches||!target.matches('[data-predict-preset-value][contenteditable="true"]'))return;if(e.key==='Enter'){e.preventDefault();setPresetEditing(false)}},true);
    root.addEventListener('click',function(e){var target=e.target;if(!target)return;var edit=target.closest&&target.closest('[data-predict-preset-edit]');if(edit){e.preventDefault();setPresetEditing(!presetEditing);return}var preset=target.closest&&target.closest('[data-predict-bet-preset]');if(preset){e.preventDefault();if(presetEditing){var value=preset.querySelector('[data-predict-preset-value]');if(value)try{value.focus({preventScroll:true})}catch(_){try{value.focus()}catch(__){}}return}submitBet(preset.getAttribute('data-predict-bet-preset'));return}var choice=target.closest&&target.closest('[data-predict-choice]');if(choice){e.preventDefault();selectBetSide(choice.getAttribute('data-predict-choice'));return}},true);'''
          once(old_listeners, new_listeners, 'root bet listeners')
          once("if(historyBackdrop&&target===historyBackdrop){e.preventDefault();setHistoryDrawer(false);return}if(betOpen&&card&&target&&!card.contains(target))closeBet()", "if(historyBackdrop&&target===historyBackdrop){e.preventDefault();setHistoryDrawer(false);return}", 'document old bet close')
          once("if(historyDrawer&&historyDrawer.classList.contains('is-open')){setHistoryDrawer(false);return true}if(betOpen){closeBet();return true}return false", "if(historyDrawer&&historyDrawer.classList.contains('is-open')){setHistoryDrawer(false);return true}if(presetEditing){setPresetEditing(false);return true}return false", 'back handler')

          forbidden = [
              'data-predict-bet-stage', 'data-predict-bet-input', 'data-predict-bet-submit',
              'predict-zone-bet-input-wrap', 'predict-zone-bet-submit', 'betOpen', 'betInput',
              'betSubmit', 'betStage', 'setKeyboardOpen(', 'openBet(', 'closeBet(', 'finishBetClose(',
              'runBetTransition(', 'renderBetEstimateQuote(', 'predict-zone-glass-card.bet-mode'
          ]
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise SystemExit('old bet path leftovers: ' + ', '.join(leftovers))
          if text.count('data-predict-bet-preset=') != 3:
              raise SystemExit('expected exactly 3 preset amount buttons')
          if text.count('data-predict-preset-edit') < 2:
              raise SystemExit('edit control not wired')
          if text.count('function submitBet(amount)') != 1 or text.count('function selectBetSide(') != 1:
              raise SystemExit('quick bet path is not singular')
          if text.count("fetch(eventMode?'/app/api/prediction-events/bet':'/app/api/predict-bet'") != 1:
              raise SystemExit('backend submit path changed or duplicated')

          path.write_text(text, encoding='utf-8')
          PY

