name: Finalize Predict quick bet cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Finalize Predict quick bet cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean final Predict quick-bet path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/predict-zone.ts')
          text = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          stale_css = '.predict-zone-bet-presets button:not(:has(.predict-zone-quote-value)){font-family:inherit!important;font-weight:950!important;letter-spacing:normal!important;font-variant-numeric:normal!important}\n'
          once(stale_css, '', 'stale preset CSS')

          once(
              '.predict-zone-actions{margin-bottom:7px!important}.predict-zone-choice{height:46px!important}.predict-zone-choice{height:40px!important;font-size:12.5px!important}',
              '.predict-zone-actions{margin-bottom:7px!important}.predict-zone-choice{height:46px!important;font-size:12.5px!important}',
              'mobile choice sizing',
          )

          old_labels = "    function setChoiceLabels(events){side='';root.querySelectorAll('[data-predict-choice]').forEach(function(btn){var isFirst=btn.getAttribute('data-predict-choice')==='up'||btn.getAttribute('data-predict-choice')==='yes',label=btn.querySelector('span:last-child');btn.setAttribute('data-predict-choice',events?(isFirst?'yes':'no'):(isFirst?'up':'down'));btn.classList.remove('selected');if(label)label.textContent=events?(isFirst?'Yes':'No'):(isFirst?'Up':'Down')});if(!events)renderPolymarketChoicePrices()}"
          new_labels = "    function clearBetSide(){side='';root.querySelectorAll('[data-predict-choice]').forEach(function(btn){btn.classList.remove('selected')});resetPresetLabels()}\n    function setChoiceLabels(events){root.querySelectorAll('[data-predict-choice]').forEach(function(btn){var isFirst=btn.getAttribute('data-predict-choice')==='up'||btn.getAttribute('data-predict-choice')==='yes',label=btn.querySelector('span:last-child');btn.setAttribute('data-predict-choice',events?(isFirst?'yes':'no'):(isFirst?'up':'down'));if(label)label.textContent=events?(isFirst?'Yes':'No'):(isFirst?'Up':'Down')});if(!events)renderPolymarketChoicePrices()}"
          once(old_labels, new_labels, 'choice label lifecycle')

          old_quotes = "    function renderPresetQuotes(){if(presetEditing)return;if(eventMode||market!=='bitcoin'||priceProvider!=='polymarket'){resetPresetLabels();return}"
          new_quotes = "    function renderPresetQuotes(){if(presetEditing)return;if(!side||eventMode||market!=='bitcoin'||priceProvider!=='polymarket'){resetPresetLabels();return}"
          once(old_quotes, new_quotes, 'preset quote side guard')

          once(
              "stopClock();side='';root.querySelectorAll('[data-predict-choice]').forEach(function(btn){btn.classList.remove('selected')});currentRound=null",
              "stopClock();clearBetSide();currentRound=null",
              'market access side reset',
          )

          old_event = "market=category;eventMode=true;currentEvent=null;eventDeadline=0;currentRound=null;"
          new_event = "market=category;eventMode=true;currentEvent=null;eventDeadline=0;currentRound=null;clearBetSide();"
          once(old_event, new_event, 'event side reset')

          old_market = "market=id;eventMode=false;currentEvent=null;eventDeadline=0;clearRoundMeta();"
          new_market = "market=id;eventMode=false;currentEvent=null;eventDeadline=0;clearBetSide();clearRoundMeta();"
          once(old_market, new_market, 'market side reset')

          forbidden = [
              'data-predict-bet-stage','data-predict-bet-input','data-predict-bet-submit',
              'Place prediction','function openBet(','function closeBet(','betOpen','betStage',
              'betInput','betUsd','betEstimate','betSubmit','bet-mode','bet-transition',
              'predict-zone-keyboard-open','predict-zone-bet-presets'
          ]
          leftovers = [token for token in forbidden if token in text]
          if leftovers:
              raise SystemExit('legacy Predict bet path remains: ' + ', '.join(leftovers))
          if text.count('function clearBetSide()') != 1:
              raise SystemExit('bet-side reset path must be singular')
          if text.count('function submitBet(amount)') != 1:
              raise SystemExit('direct submit path must be singular')
          if text.count('function syncBetAvailability()') != 1:
              raise SystemExit('syncBetAvailability must remain singular')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate browser script and commit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('src/miniapp/predict-zone.ts','utf8');
          const marker='export const PREDICT_ZONE_SCRIPT = `';
          const s=src.indexOf(marker), b=s+marker.length, e=src.indexOf('\n`;',b);
          if(s<0||e<0) throw new Error('Predict script bounds missing');
          const cooked=Function('PREDICT_ERROR_TEXTS','return `'+src.slice(b,e)+'`;')({en:{}});
          new Function(cooked);
          console.log('Predict browser script parses correctly');
          NODE
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-quick-cleanup.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Finalize Predict quick amount controls"
          git push origin HEAD:main
