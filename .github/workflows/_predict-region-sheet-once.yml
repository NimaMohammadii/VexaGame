name: Apply Predict region sheet once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Repair Predict region sheet workflow v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Replace Predict region error with Home-style bottom sheet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, zlib
          exec(zlib.decompress(base64.b64decode("")).decode("utf-8"))
          PY
          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"
      - name: Commit Predict region sheet and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-region-sheet-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Use Home-style sheet for Predict region errors"
          git push origin HEAD:main
