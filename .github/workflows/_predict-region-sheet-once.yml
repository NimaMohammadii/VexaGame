name: Apply Predict region sheet once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Predict region sheet patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Predict region sheet
        shell: bash
        run: |
          set -euo pipefail
          python .github/_predict_region_patch.py
          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"
      - name: Commit Predict region sheet and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-region-sheet-once.yml .github/_predict_region_patch.py
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Use Home-style sheet for Predict region errors"
          git push origin HEAD:main
