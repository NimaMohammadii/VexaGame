name: Apply Predict selected-state and card styling once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Predict selected-state and card styling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update authoritative Predict UI only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/predict-zone.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          material = 'border:0!important;outline:0!important;border-radius:28px!important;background:rgba(0,0,0,.22)!important;box-shadow:inset 3px 3px .5px -3.5px rgba(255,255,255,.10),inset -3px -3px .5px -3.5px rgba(255,255,255,.12),inset 1px 1px 1px -.5px rgba(255,255,255,.08),inset -1px -1px 1px -.5px rgba(255,255,255,.06),inset 0 0 6px 6px rgba(255,255,255,.04),inset 0 0 2px 2px rgba(255,255,255,.025)!important;backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important;-webkit-backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important'

          old_live = '.predict-zone-live-meta{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:8px!important;max-height:48px;overflow:hidden;opacity:1;margin:13px 0 11px!important;transform:translate3d(0,0,0);transition:max-height .42s cubic-bezier(.18,.88,.24,1),margin .42s cubic-bezier(.18,.88,.24,1),opacity .2s ease,transform .42s cubic-bezier(.18,.88,.24,1)}.predict-zone-live-meta>div{height:48px!important;border-radius:18px!important;background:rgba(0,0,0,.22)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.055),inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(255,255,255,.04)!important;padding:8px 11px!important;display:grid!important;align-content:center!important;gap:2px!important;box-sizing:border-box!important}.predict-zone-live-meta>div>span{color:rgba(255,255,255,.35)!important;font-size:9px!important;font-weight:800!important;text-transform:uppercase!important;letter-spacing:.10em!important}.predict-zone-live-meta strong{font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;color:#fff!important;font-size:14px!important;font-weight:700!important;letter-spacing:-.02em!important;white-space:nowrap!important;font-variant-numeric:tabular-nums!important}.predict-zone-live-meta strong.predict-zone-price-rolling{display:inline-flex!important;align-items:center!important;direction:ltr!important;overflow:visible!important;line-height:1!important}'
          new_live = '.predict-zone-live-meta{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:8px!important;max-height:48px;overflow:hidden;opacity:1;margin:13px 0 11px!important;transform:translate3d(0,0,0);transition:max-height .42s cubic-bezier(.18,.88,.24,1),margin .42s cubic-bezier(.18,.88,.24,1),opacity .2s ease,transform .42s cubic-bezier(.18,.88,.24,1)}.predict-zone-live-meta>div{position:relative!important;overflow:hidden!important;height:48px!important;' + material + ';padding:8px 11px!important;display:grid!important;align-content:center!important;gap:2px!important;box-sizing:border-box!important}.predict-zone-live-meta>div>span{color:rgba(255,255,255,.35)!important;font-size:9px!important;font-weight:800!important;text-transform:uppercase!important;letter-spacing:.10em!important}.predict-zone-live-meta strong{font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;color:#fff!important;font-size:14px!important;font-weight:700!important;letter-spacing:-.02em!important;white-space:nowrap!important;font-variant-numeric:tabular-nums!important}.predict-zone-live-meta strong.predict-zone-price-rolling{display:inline-flex!important;align-items:center!important;direction:ltr!important;overflow:visible!important;line-height:1!important}'
          replace_once(old_live, new_live, 'live/start card style')

          old_action = '.predict-zone-decision-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 8px;color:rgba(255,255,255,.40);font-size:11px;font-weight:800;max-height:26px;opacity:1;overflow:hidden}.predict-zone-decision-head strong{color:rgba(255,255,255,.68);font-size:11px;font-weight:900;white-space:nowrap}.predict-zone-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:9px!important;margin:0 0 8px!important}.predict-zone-choice{position:relative!important;overflow:hidden!important;height:48px!important;padding:0 14px!important;border:0!important;outline:0!important;border-radius:28px!important;background:rgba(0,0,0,.22)!important;box-shadow:inset 3px 3px .5px -3.5px rgba(255,255,255,.10),inset -3px -3px .5px -3.5px rgba(255,255,255,.12),inset 1px 1px 1px -.5px rgba(255,255,255,.08),inset -1px -1px 1px -.5px rgba(255,255,255,.06),inset 0 0 6px 6px rgba(255,255,255,.04),inset 0 0 2px 2px rgba(255,255,255,.025)!important;backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important;-webkit-backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important;color:#fff!important;font-size:13px!important;font-weight:950!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;transform:translateZ(0)!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;transition:transform .18s ease,opacity .18s ease!important}.predict-zone-choice>span:last-child{font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-weight:700!important;letter-spacing:-.02em!important;font-variant-numeric:tabular-nums!important}.predict-zone-choice-symbol{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;font-size:18px;font-weight:950;line-height:1;transition:transform .18s ease!important}.predict-zone-choice-up .predict-zone-choice-symbol{color:#d7e9dd}.predict-zone-choice-down .predict-zone-choice-symbol{color:#e7c9d2}.predict-zone-choice.selected .predict-zone-choice-symbol{transform:scale(1.12)}.predict-zone-choice:active{transform:scale(.97)!important}.predict-zone-actions button.predict-zone-choice:disabled{opacity:.42!important;cursor:not-allowed!important;transform:none!important}'
          new_action = '.predict-zone-decision-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 8px;color:rgba(255,255,255,.40);font-size:11px;font-weight:800;max-height:26px;opacity:1;overflow:hidden}.predict-zone-decision-head strong{color:rgba(255,255,255,.68);font-size:11px;font-weight:900;white-space:nowrap}.predict-zone-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:9px!important;margin:0 0 8px!important}.predict-zone-choice{position:relative!important;overflow:hidden!important;height:48px!important;padding:0 14px!important;' + material + ';color:#fff!important;font-size:13px!important;font-weight:950!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;opacity:.58!important;transform:translateZ(0)!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;transition:transform .18s ease,opacity .18s ease!important}.predict-zone-choice>span:last-child{font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-weight:700!important;letter-spacing:-.02em!important;font-variant-numeric:tabular-nums!important}.predict-zone-choice-symbol{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;font-size:18px;font-weight:950;line-height:1;transition:transform .18s ease!important}.predict-zone-choice-up .predict-zone-choice-symbol{color:#d7e9dd}.predict-zone-choice-down .predict-zone-choice-symbol{color:#e7c9d2}.predict-zone-choice.selected{opacity:1!important}.predict-zone-choice.selected .predict-zone-choice-symbol{transform:scale(1.12)}.predict-zone-choice:active{transform:scale(.97)!important}.predict-zone-actions button.predict-zone-choice:disabled{opacity:.42!important;cursor:not-allowed!important;transform:none!important}'
          replace_once(old_action, new_action, 'up/down selected state')

          old_quick = '.predict-zone-quick-bets{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr)) 52px!important;gap:7px!important;margin:0!important}.predict-zone-bet-preset,.predict-zone-preset-edit{position:relative!important;overflow:hidden!important;height:38px!important;min-width:0!important;padding:0 8px!important;border:0!important;outline:0!important;border-radius:28px!important;background:rgba(0,0,0,.22)!important;box-shadow:inset 3px 3px .5px -3.5px rgba(255,255,255,.10),inset -3px -3px .5px -3.5px rgba(255,255,255,.12),inset 1px 1px 1px -.5px rgba(255,255,255,.08),inset -1px -1px 1px -.5px rgba(255,255,255,.06),inset 0 0 6px 6px rgba(255,255,255,.04),inset 0 0 2px 2px rgba(255,255,255,.025)!important;backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important;-webkit-backdrop-filter:blur(22px) saturate(1.12) brightness(1.03)!important;color:#fff!important;font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-size:12px!important;font-weight:760!important;letter-spacing:-.02em!important;font-variant-numeric:tabular-nums!important;display:flex!important;align-items:center!important;justify-content:center!important;white-space:nowrap!important;transform:translateZ(0)!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;transition:transform .16s ease,opacity .16s ease!important}.predict-zone-bet-preset:active,.predict-zone-preset-edit:active{transform:scale(.96)!important}.predict-zone-bet-preset:disabled{opacity:.38!important}.predict-zone-preset-edit{font-size:10.5px!important;font-weight:800!important;color:rgba(255,255,255,.58)!important}.predict-zone-preset-edit.is-editing{color:rgba(255,255,255,.92)!important}.predict-zone-bet-preset [data-predict-preset-value]{display:inline-block;min-width:1.5em;outline:0!important}.predict-zone-preset-editing .predict-zone-bet-preset{opacity:.92!important}.predict-zone-preset-editing .predict-zone-bet-preset [data-predict-preset-value]{cursor:text;user-select:text;-webkit-user-select:text}.predict-zone-bet-status{display:block;min-height:0;margin:6px 0 0;text-align:center;color:rgba(255,255,255,.42);font-size:10px;font-weight:760}.predict-zone-bet-status:empty{display:none}.predict-zone-bet-status.bad{color:rgba(255,160,160,.9)}.predict-zone-bet-status.good{color:rgba(185,255,210,.9)}'
          new_quick = '.predict-zone-quick-bets{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr)) 52px!important;gap:7px!important;margin:0!important}.predict-zone-bet-preset,.predict-zone-preset-edit{position:relative!important;overflow:hidden!important;height:38px!important;min-width:0!important;padding:0 8px!important;' + material + ';color:#fff!important;font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-size:12px!important;font-weight:760!important;letter-spacing:-.02em!important;font-variant-numeric:tabular-nums!important;display:flex!important;align-items:center!important;justify-content:center!important;white-space:nowrap!important;transform:translateZ(0)!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;transition:transform .16s ease,opacity .16s ease!important}.predict-zone-bet-preset:active,.predict-zone-preset-edit:active{transform:scale(.96)!important}.predict-zone-bet-preset:disabled{opacity:.38!important}.predict-zone-preset-edit{font-size:10.5px!important;font-weight:800!important;color:#fff!important}.predict-zone-preset-edit.is-editing{color:#fff!important}.predict-zone-bet-preset [data-predict-preset-value]{display:inline-block;min-width:1.5em;outline:0!important}.predict-zone-preset-editing .predict-zone-bet-preset{opacity:.92!important}.predict-zone-preset-editing .predict-zone-bet-preset [data-predict-preset-value]{cursor:text;user-select:text;-webkit-user-select:text}.predict-zone-bet-status{display:block;min-height:0;margin:6px 0 0;text-align:center;color:rgba(255,255,255,.42);font-size:10px;font-weight:760}.predict-zone-bet-status:empty{display:none}.predict-zone-bet-status.bad{color:rgba(255,160,160,.9)}.predict-zone-bet-status.good{color:rgba(185,255,210,.9)}'
          replace_once(old_quick, new_quick, 'quick/edit card style')

          old_quote = "    function renderPresetQuotes(){if(presetEditing)return;if(!side||eventMode||market!=='bitcoin'||priceProvider!=='polymarket'){resetPresetLabels();return}root.querySelectorAll('[data-predict-bet-preset]').forEach(function(btn){var rawAmount=String(btn.getAttribute('data-predict-bet-preset')||''),amount=Number(rawAmount),quote=polymarketQuoteFor(amount,side);if(!quote||!quote.available){btn.textContent=rawAmount+' - → - '+(quote?'—':'…');return}var value=btn.querySelector('[data-predict-preset-quote]');if(!value){btn.innerHTML='<span>'+rawAmount+' - → - </span><span class=\"predict-zone-quote-value\" data-predict-preset-quote></span>';value=btn.querySelector('[data-predict-preset-quote]')}renderQuoteRoll(value,formatPresetWin(quote.payoutGram))})}"
          new_quote = "    function renderPresetQuotes(){if(presetEditing)return;if(!side||eventMode||market!=='bitcoin'||priceProvider!=='polymarket'){resetPresetLabels();return}root.querySelectorAll('[data-predict-bet-preset]').forEach(function(btn){var rawAmount=String(btn.getAttribute('data-predict-bet-preset')||''),amount=Number(rawAmount),quote=polymarketQuoteFor(amount,side);if(!quote||!quote.available){btn.textContent=rawAmount+' → '+(quote?'—':'…');return}var value=btn.querySelector('[data-predict-preset-quote]');if(!value){btn.innerHTML='<span>'+rawAmount+' → </span><span class=\"predict-zone-quote-value\" data-predict-preset-quote></span>';value=btn.querySelector('[data-predict-preset-quote]')}renderQuoteRoll(value,formatPresetWin(quote.payoutGram))})}"
          replace_once(old_quote, new_quote, 'preset amount arrow spacing')

          if " - → - " in text:
              raise SystemExit('Old hyphenated preset separator still present')
          if text.count("rawAmount+' → '") != 2:
              raise SystemExit('Requested single-space arrow format not singular in both quote branches')
          if text.count('.predict-zone-choice.selected{opacity:1!important}') != 1:
              raise SystemExit('Selected-state styling validation failed')
          if text.count('.predict-zone-live-meta>div{position:relative!important;overflow:hidden!important;height:48px!important;') != 1:
              raise SystemExit('Live/start material validation failed')
          if text.count("fetch(eventMode?'/app/api/prediction-events/bet':'/app/api/predict-bet'") != 1:
              raise SystemExit('Existing Predict backend path changed or duplicated')
          if text.count('function submitBet(amount)') != 1:
              raise SystemExit('Predict submit path changed or duplicated')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate emitted Predict script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/miniapp/predict-zone.ts', 'utf8');
          const marker = 'export const PREDICT_ZONE_SCRIPT = `';
          const start = src.indexOf(marker);
          if (start < 0) throw new Error('PREDICT_ZONE_SCRIPT marker missing');
          const bodyStart = start + marker.length;
          const end = src.indexOf('\n`;', bodyStart);
          if (end < 0) throw new Error('PREDICT_ZONE_SCRIPT end missing');
          const raw = src.slice(bodyStart, end);
          const cooked = Function('PREDICT_ERROR_TEXTS', 'return `' + raw + '`;')({en:{}});
          new Function(cooked);
          if (!src.includes("rawAmount+' → '+(quote?'—':'…')")) throw new Error('Single-space amount arrow format missing');
          console.log('Predict UI validation OK');
          NODE

      - name: Commit only Predict owner and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/_predict-selected-style-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Refine Predict selected state and card styling"
          git push origin HEAD:main
