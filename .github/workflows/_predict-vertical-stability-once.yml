name: Apply Predict vertical stability fix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Predict vertical stability fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fix authoritative Predict vertical stability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/predict-zone.ts')
          text = path.read_text(encoding='utf-8')

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          one(
              '#predictzone.view-transition-in{animation-duration:.18s!important}',
              '#predictzone.view-transition-in{will-change:opacity!important;animation:vexaPredictSectionFade .18s ease both!important}@keyframes vexaPredictSectionFade{from{opacity:0}to{opacity:1}}',
              'Predict section entrance transform',
          )

          one(
              "bitcoin:{label:'Bitcoin',question:'Bitcoin up or down? · 5M',stream:'wss://fstream.asterdex.com/ws/btcusdt@markPrice@1s',decimals:0,step:5,axisStep:10,symbol:'₿'}",
              "bitcoin:{label:'Bitcoin',question:'Bitcoin up or down? · 5M',stream:'wss://fstream.asterdex.com/ws/btcusdt@markPrice@1s',decimals:0,step:5,chartMinRatio:.0015,symbol:'₿'}",
              'Bitcoin vertical scale config',
          )

          one(
              'actualSpan,axisSpan,price,innerMin,innerMax,nextMin;if(fixedStep>0)',
              'actualSpan,axisSpan,price,innerMin,innerMax,nextMin,reference;if(fixedStep>0)',
              'autoScale reference declaration',
          )

          one(
              'minSpan=Math.max(c.step*8,precision*8);if(!valid.length)',
              'reference=Math.max(Number(current||last||0),Number(entry||0),Number(valid[valid.length-1]||0));minSpan=Math.max(c.step*8,precision*8,reference*Math.max(0,Number(c.chartMinRatio)||0));if(!valid.length)',
              'adaptive minimum vertical span',
          )

          one(
              'alpha=1-Math.exp(-elapsed/(outward?460:1260));',
              'alpha=1-Math.exp(-elapsed/(outward?460:1800));',
              'vertical scale settle speed',
          )

          one(
              "var initialPrice=Number(round.livePrice||round.startPrice||0);if(!readyPrice&&initialPrice>0)applyPrice(initialPrice,my,id);else if(readyPrice)startChartMotion();",
              "var initialPrice=Number(round.livePrice||((market==='bitcoin'&&priceProvider==='polymarket')?0:round.startPrice)||0);if(!readyPrice&&initialPrice>0)applyPrice(initialPrice,my,id);else if(readyPrice)startChartMotion();",
              'Polymarket first live price source',
          )

          one(
              "if(firstPrice){readyPrice=true;seed(p);if(chart)chart.classList.add('ready');startChartMotion()}",
              "if(firstPrice){readyPrice=true;seed(p);draw();if(chart)chart.classList.add('ready');startChartMotion()}",
              'first visible chart frame',
          )

          if "axisStep:10,symbol:'₿'" in text:
              raise SystemExit('old tight Bitcoin fixed-axis path remains')
          if text.count('chartMinRatio:.0015') != 1:
              raise SystemExit('Bitcoin adaptive chart scale is not singular')
          if text.count('function autoScale(prices)') != 1:
              raise SystemExit('autoScale path is not singular')
          if text.count('function draw()') != 1:
              raise SystemExit('draw path is not singular')
          if "round.livePrice||round.startPrice" in text:
              raise SystemExit('old Polymarket start-price-as-live seed remains')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- src/miniapp/predict-zone.ts
          test "$(git diff --name-only | paste -sd ' ' -)" = "src/miniapp/predict-zone.ts"

      - name: Validate emitted Predict browser script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/miniapp/predict-zone.ts', 'utf8');
          const marker = 'export const PREDICT_ZONE_SCRIPT = `';
          const a = src.indexOf(marker);
          if (a < 0) throw new Error('Predict script marker missing');
          const b = a + marker.length;
          const e = src.indexOf('\n`;', b);
          if (e < 0) throw new Error('Predict script end missing');
          const raw = src.slice(b, e);
          const cooked = Function('PREDICT_ERROR_TEXTS', 'return `'+raw+'`;')({en:{}});
          new Function(cooked);
          if ((src.match(/function autoScale\(prices\)/g) || []).length !== 1) throw new Error('duplicate autoScale path');
          if ((src.match(/function draw\(\)/g) || []).length !== 1) throw new Error('duplicate draw path');
          if (!src.includes('chartMinRatio:.0015')) throw new Error('adaptive Bitcoin scale missing');
          if (src.includes("axisStep:10,symbol:'₿'")) throw new Error('tight Bitcoin fixed axis remains');
          if (!src.includes('vexaPredictSectionFade')) throw new Error('Predict-only fade missing');
          console.log('Predict vertical stability validation OK');
          NODE

      - name: Commit only Predict source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_predict-vertical-stability-once.yml
          git add src/miniapp/predict-zone.ts
          git diff --cached --check
          git commit -m "Fix Predict vertical chart jump"
          git push origin HEAD:main
