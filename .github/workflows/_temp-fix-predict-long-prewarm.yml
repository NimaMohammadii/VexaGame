name: Temporary Predict long-timeframe prewarm fix

on:
  push:
    branches:
      - fix/predict-long-timeframe-prewarm

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps
      - name: Patch existing Predict round path only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/predict-routes.ts')
          s=p.read_text()
          old="""    const round = await getOrCreateCurrentRound(c.env, market, snapshot.price, timeframe);\n    const response = { ...(await publicRoundJson(c.env, round, userId, snapshot.price)), history: snapshot.history, candleHistory: await candleHistoryPromise };\n"""
          new="""    const round = await getOrCreateCurrentRound(c.env, market, snapshot.price, timeframe);\n    if (market === 'bitcoin' && timeframe === '5m') {\n      // Home prepares the default Bitcoin round before Predict opens. Use that\n      // same successful request to warm the longer rounds through the existing\n      // round bootstrap path, so switching timeframes never owns first bootstrap.\n      c.executionCtx.waitUntil(Promise.allSettled((['15m', '1h'] as BitcoinTimeframe[]).map((warmTimeframe) =>\n        getOrCreateCurrentRound(c.env, 'bitcoin', 0, warmTimeframe),\n      )).then(() => undefined));\n    }\n    const response = { ...(await publicRoundJson(c.env, round, userId, snapshot.price)), history: snapshot.history, candleHistory: await candleHistoryPromise };\n"""
          if s.count(old)!=1:
            raise SystemExit(f'expected target once, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/predict-routes.ts"
      - name: Verify architecture and syntax
        shell: bash
        run: |
          set -euo pipefail
          npm run guard:runtime
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const file='src/predict-routes.ts';
          const source=fs.readFileSync(file,'utf8');
          const out=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},reportDiagnostics:true});
          const errors=(out.diagnostics||[]).filter(x=>x.category===ts.DiagnosticCategory.Error);
          if(errors.length)throw new Error(errors.map(x=>ts.flattenDiagnosticMessageText(x.messageText,'\n')).join('\n'));
          if(!source.includes("timeframe === '5m'"))throw new Error('5m warm trigger missing');
          if(!source.includes("['15m', '1h'] as BitcoinTimeframe[]"))throw new Error('long timeframe warm list missing');
          if(!source.includes("getOrCreateCurrentRound(c.env, 'bitcoin', 0, warmTimeframe)"))throw new Error('existing bootstrap path not reused');
          NODE
      - name: Re-run actual Polymarket loaders
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const source=fs.readFileSync('src/predict-polymarket.ts','utf8');
          const compiled=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,moduleResolution:ts.ModuleResolutionKind.Bundler}}).outputText;
          fs.writeFileSync('src/__tmp-predict-polymarket.mjs',compiled);
          const mod=await import(new URL('./src/__tmp-predict-polymarket.mjs',import.meta.url));
          const durations={ '15m':900000,'1h':3600000 };
          for(const tf of ['15m','1h']){
            const start=Math.floor(Date.now()/durations[tf])*durations[tf];
            const m=await mod.loadPolymarketBitcoinMarket(start,tf);
            if(!(Number(m.startPrice)>0)||!m.upTokenId||!m.downTokenId||!m.rtdsTopic)throw new Error(`${tf} loader incomplete`);
            console.log('LOADER_OK',tf,m.slug,m.startPrice,m.rtdsTopic);
          }
          fs.unlinkSync('src/__tmp-predict-polymarket.mjs');
          NODE
      - name: Commit only scoped fix and remove verifier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-fix-predict-long-prewarm.yml
          git add src/predict-routes.ts .github/workflows/_temp-fix-predict-long-prewarm.yml
          git config user.name "NimaMohammadii"
          git config user.email "nima.mohammadi084@gmail.com"
          git commit -m "Prewarm Predict 15m and 1h rounds after Home"
          git push origin HEAD:fix/predict-long-timeframe-prewarm
