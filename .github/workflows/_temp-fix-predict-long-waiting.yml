name: Temporary Predict long timeframe fix
on:
  push:
    branches:
      - fix/predict-long-timeframe-waiting-root
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-package-lock --legacy-peer-deps
      - name: Patch
        run: python3 scripts/_tmp_predict_long_patch.py
      - name: Scope check
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/miniapp/predict-zone.ts src/miniapp/section-access-script.ts src/predict-routes.ts | sort)"
      - name: Architecture guard
        run: npm run guard:runtime
      - name: Targeted verification
        run: node scripts/_tmp_predict_long_verify.mjs
      - name: Commit scoped fix
        run: |
          rm .github/workflows/_temp-fix-predict-long-waiting.yml scripts/_tmp_predict_long_patch.py scripts/_tmp_predict_long_verify.mjs
          git add src/miniapp/predict-zone.ts src/miniapp/section-access-script.ts src/predict-routes.ts .github/workflows/_temp-fix-predict-long-waiting.yml scripts/_tmp_predict_long_patch.py scripts/_tmp_predict_long_verify.mjs
          git config user.name NimaMohammadii
          git config user.email nima.mohammadi084@gmail.com
          git commit -m "Fix Predict long-timeframe round synchronization"
          git push origin HEAD:fix/predict-long-timeframe-waiting-root
