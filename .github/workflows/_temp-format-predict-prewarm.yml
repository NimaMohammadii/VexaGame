name: Temporary Format Predict Prewarm

'on':
  push:
    branches:
      - fix/predict-prewarm-nonfatal

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix scoped indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/predict-routes.ts')
          s=p.read_text()
          old="""    if (market === 'bitcoin' && timeframe === '5m') {
            c.executionCtx.waitUntil(warmCurrentBitcoinLongTimeframes(c.env).catch((error) => {
              console.warn('Predict long-timeframe background preparation failed', messageOf(error));
            }));
          }
          """
          # The current block is intentionally matched by markers because its indentation is the only thing being fixed.
          start=s.index("    if (market === 'bitcoin' && timeframe === '5m') {", s.index("app.get('/app/api/predict-round'"))
          end=s.index("    const response =", start)
          current=s[start:end]
          if "warmCurrentBitcoinLongTimeframes(c.env).catch" not in current:
              raise SystemExit('unexpected prewarm block')
          new="""    if (market === 'bitcoin' && timeframe === '5m') {
              c.executionCtx.waitUntil(warmCurrentBitcoinLongTimeframes(c.env).catch((error) => {
                console.warn('Predict long-timeframe background preparation failed', messageOf(error));
              }));
            }
          """
          # Normalize the block to the repository's two-space nesting style.
          new = "    if (market === 'bitcoin' && timeframe === '5m') {\n      c.executionCtx.waitUntil(warmCurrentBitcoinLongTimeframes(c.env).catch((error) => {\n        console.warn('Predict long-timeframe background preparation failed', messageOf(error));\n      }));\n    }\n"
          p.write_text(s[:start]+new+s[end:])
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/predict-routes.ts"
      - name: Commit and remove temporary formatter
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-format-predict-prewarm.yml
          git add src/predict-routes.ts .github/workflows/_temp-format-predict-prewarm.yml
          git config user.name "NimaMohammadii"
          git config user.email "nima.mohammadi084@gmail.com"
          git commit -m "Format Predict prewarm block"
          git push origin HEAD:fix/predict-prewarm-nonfatal
