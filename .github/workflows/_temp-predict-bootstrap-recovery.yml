name: Temporary Predict Bootstrap Recovery

'on':
  push:
    branches:
      - fix/predict-bootstrap-recovery

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps
      - name: Patch Predict bootstrap recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/predict-routes.ts')
          s=p.read_text()

          old="? await getOrCreateBitcoinRoundWithWait(c.env, timeframe, 10_000)"
          new="? await getOrCreateBitcoinRoundWithWait(c.env, timeframe, ROUND_BOOTSTRAP_LEASE_MS + 10_000)"
          if s.count(old)<1: raise SystemExit('direct long-frame wait target missing')
          s=s.replace(old,new,1)

          old="""async function warmCurrentBitcoinLongTimeframes(env: Env): Promise<void> {
            const warmOne = async (timeframe: BitcoinTimeframe): Promise<void> => {
              try {
                await getOrCreateBitcoinRoundWithWait(env, timeframe, 10_000);
              } catch (error) {
                if (error instanceof PredictRoundStartingError) {
                  console.warn(`Bitcoin ${timeframe} round is still starting after background warm window`);
                  return;
                }
                throw error;
              }
            };
            const results = await Promise.allSettled((['15m', '1h'] as BitcoinTimeframe[]).map(warmOne));
            for (const result of results) if (result.status === 'rejected') throw result.reason;
          }"""
          new="""async function warmCurrentBitcoinLongTimeframes(env: Env): Promise<void> {
            const results = await Promise.allSettled((['15m', '1h'] as BitcoinTimeframe[]).map(async (timeframe) => {
              try {
                await getOrCreateCurrentRound(env, 'bitcoin', 0, timeframe);
              } catch (error) {
                if (error instanceof PredictRoundStartingError) return;
                throw error;
              }
            }));
            for (const result of results) if (result.status === 'rejected') throw result.reason;
          }"""
          if s.count(old)!=1: raise SystemExit(f'background warm target count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/predict-routes.ts"
      - name: Verify runtime guard and source invariants
        shell: bash
        run: |
          set -euo pipefail
          npm run guard:runtime
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const file='src/predict-routes.ts';
          const source=fs.readFileSync(file,'utf8');
          const out=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,moduleResolution:ts.ModuleResolutionKind.Bundler},reportDiagnostics:true,fileName:file});
          const errors=(out.diagnostics||[]).filter(x=>x.category===ts.DiagnosticCategory.Error);
          if(errors.length)throw new Error(errors.map(x=>ts.flattenDiagnosticMessageText(x.messageText,'\n')).join('\n'));
          if(!source.includes('ROUND_BOOTSTRAP_LEASE_MS + 10_000'))throw new Error('direct 15m/1h wait is still shorter than lease');
          if(source.includes('getOrCreateBitcoinRoundWithWait(env, timeframe, 10_000)'))throw new Error('background warm still blocks for ten seconds');
          if(!source.includes("await getOrCreateCurrentRound(env, 'bitcoin', 0, timeframe);"))throw new Error('best-effort background warm missing');
          if((source.match(/const round = await getOrCreateCurrentRound\(c\.env, market, snapshot\.price, timeframe\);/g)||[]).length!==1)throw new Error('bet path changed unexpectedly');
          NODE
      - name: Verify current 1h provider loader
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const source=fs.readFileSync('src/predict-polymarket.ts','utf8');
          const compiled=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,moduleResolution:ts.ModuleResolutionKind.Bundler}}).outputText;
          fs.writeFileSync('src/__tmp-predict-polymarket.mjs',compiled);
          const mod=await import(new URL('./src/__tmp-predict-polymarket.mjs',import.meta.url));
          const start=Math.floor(Date.now()/3600000)*3600000;
          const market=await mod.loadPolymarketBitcoinMarket(start,'1h');
          if(!(Number(market.startPrice)>0)||!market.upTokenId||!market.downTokenId)throw new Error('current 1h loader incomplete');
          console.log('CURRENT_1H_LOADER_OK', market.startPrice, market.rtdsTopic);
          fs.unlinkSync('src/__tmp-predict-polymarket.mjs');
          NODE
      - name: Commit scoped fix and remove verifier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-predict-bootstrap-recovery.yml
          git add src/predict-routes.ts .github/workflows/_temp-predict-bootstrap-recovery.yml
          git config user.name 'NimaMohammadii'
          git config user.email 'nima.mohammadi084@gmail.com'
          git commit -m 'Recover Predict long-frame bootstrap safely'
          git push origin HEAD:fix/predict-bootstrap-recovery
