name: Temporary Predict candle history backfill

on:
  push:
    branches:
      - verify/predict-candle-history-backfill

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps
      - name: Reset scoped files to main and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- src/predict-routes.ts src/miniapp/predict-zone.ts
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          routes_path = Path('src/predict-routes.ts')
          routes = routes_path.read_text()
          routes = replace_once(
              routes,
              "const ASTER_FUTURES_REST_BASE = 'https://fapi.asterdex.com';",
              "const ASTER_FUTURES_REST_BASE = 'https://fapi.asterdex.com';\nconst BINANCE_PUBLIC_REST_BASE = 'https://data-api.binance.vision';",
              'binance base url',
          )
          routes = replace_once(
              routes,
              "type MarketSnapshot = { price: number; history: number[] };",
              "type MarketSnapshot = { price: number; history: number[] };\ntype CandleHistoryBar = { time: number; open: number; high: number; low: number; close: number };",
              'candle history type',
          )
          routes = replace_once(
              routes,
              "    const providerState = market === 'bitcoin' ? await getPredictProviderStateForRound(c.env, timeframe) : null;\n    const snapshot = providerState === 'polymarket' ? { price: 0, history: [] } : await fetchMarketSnapshot(market);",
              "    const providerState = market === 'bitcoin' ? await getPredictProviderStateForRound(c.env, timeframe) : null;\n    const candleHistoryPromise: Promise<CandleHistoryBar[]> = market === 'bitcoin'\n      ? fetchBitcoinCandleHistory(timeframe).catch(() => [])\n      : Promise.resolve([]);\n    const snapshot = providerState === 'polymarket' ? { price: 0, history: [] } : await fetchMarketSnapshot(market);",
              'round candle history promise',
          )
          routes = replace_once(
              routes,
              "    const response = { ...(await publicRoundJson(c.env, round, userId, snapshot.price)), history: snapshot.history };",
              "    const response = { ...(await publicRoundJson(c.env, round, userId, snapshot.price)), history: snapshot.history, candleHistory: await candleHistoryPromise };",
              'round candle history response',
          )
          routes = replace_once(
              routes,
              "  return { price: history[history.length - 1], history };\n}\nasync function fetchPrice(market: TradeMarket): Promise<number> {",
              "  return { price: history[history.length - 1], history };\n}\nasync function fetchBitcoinCandleHistory(timeframe: BitcoinTimeframe): Promise<CandleHistoryBar[]> {\n  const res = await fetch(`${BINANCE_PUBLIC_REST_BASE}/api/v3/klines?symbol=BTCUSDT&interval=${encodeURIComponent(timeframe)}&limit=16`, { cf: { cacheTtl: 15, cacheEverything: true } } as RequestInit);\n  if (!res.ok) throw new Error(`Binance Bitcoin candle history failed: HTTP ${res.status}`);\n  const rows = await res.json() as unknown;\n  if (!Array.isArray(rows)) throw new Error('Invalid Binance Bitcoin candle history');\n  const now = Date.now();\n  const history: CandleHistoryBar[] = [];\n  for (const row of rows) {\n    if (!Array.isArray(row)) continue;\n    const time = Number(row[0]);\n    const open = Number(row[1]);\n    const high = Number(row[2]);\n    const low = Number(row[3]);\n    const close = Number(row[4]);\n    const closeTime = Number(row[6]);\n    if (![time, open, high, low, close, closeTime].every((value) => Number.isFinite(value) && value > 0)) continue;\n    if (closeTime >= now || high < Math.max(open, close) || low > Math.min(open, close) || high < low) continue;\n    history.push({ time, open, high, low, close });\n  }\n  return history.slice(-12);\n}\nasync function fetchPrice(market: TradeMarket): Promise<number> {",
              'candle history fetcher',
          )
          routes_path.write_text(routes)

          zone_path = Path('src/miniapp/predict-zone.ts')
          zone = zone_path.read_text()
          zone = replace_once(
              zone,
              "    function candleIntervalLabel(){if(market!=='bitcoin')return '5s';return bitcoinTimeframe==='1h'?'1h':bitcoinTimeframe}\n    // OHLC uses source observations only. Never use interpolated frames or invent missing bars.",
              "    function candleIntervalLabel(){if(market!=='bitcoin')return '5s';return bitcoinTimeframe==='1h'?'1h':bitcoinTimeframe}\n    function hydrateCandleHistory(source){\n      if(market!=='bitcoin'||candles.length||!Array.isArray(source))return false;\n      var interval=candleIntervalMs(),now=Date.now(),next=[];\n      source.forEach(function(item){\n        var time=Number(item&&item.time),open=Number(item&&item.open),high=Number(item&&item.high),low=Number(item&&item.low),close=Number(item&&item.close);\n        if(!isFinite(time)||time<=0||!isFinite(open)||open<=0||!isFinite(high)||high<=0||!isFinite(low)||low<=0||!isFinite(close)||close<=0)return;\n        var bucket=Math.floor(time/interval)*interval;\n        if(bucket+interval>now||high<Math.max(open,close)||low>Math.min(open,close)||high<low)return;\n        next.push({time:bucket,first:bucket,last:bucket+interval-1,open:open,high:high,low:low,close:close,backfill:1})\n      });\n      next.sort(function(a,b){return a.time-b.time});\n      candles=next.filter(function(bar,index,list){return index===0||bar.time!==list[index-1].time}).slice(-CANDLE_VISIBLE_BARS);\n      return candles.length>0\n    }\n    // OHLC uses source observations only. Never use interpolated frames or invent missing bars.",
              'client candle hydrator',
          )
          zone = replace_once(
              zone,
              "      var source=market==='bitcoin'?(priceProvider==='polymarket'?(priceRtdsTopic==='crypto_prices'?'Binance':'Chainlink TWAP'):'Mark price'):'Mark price',interval=candleIntervalMs(),intervalLabel=candleIntervalLabel();\n      if(candleNote){var note=intervalLabel+' · '+source;if(candleNote.textContent!==note)candleNote.textContent=note;candleNote.title=intervalLabel+' OHLC of received '+source+' prices. First or interrupted candles may be partial; missing intervals are not filled.'}",
              "      var source=market==='bitcoin'?(priceProvider==='polymarket'?(priceRtdsTopic==='crypto_prices'?'Binance':'Chainlink TWAP'):'Mark price'):'Mark price',interval=candleIntervalMs(),intervalLabel=candleIntervalLabel(),hasBackfill=candles.some(function(bar){return bar&&bar.backfill===1});\n      if(candleNote){var note=intervalLabel+' · '+source+(hasBackfill&&source!=='Binance'?' live':'');if(candleNote.textContent!==note)candleNote.textContent=note;candleNote.title=intervalLabel+' OHLC. '+(hasBackfill?'Completed history uses Binance BTCUSDT; ':'')+'the live candle uses received '+source+' prices. First or interrupted candles may be partial; missing intervals are not filled.'}",
              'candle source note',
          )
          zone = replace_once(
              zone,
              "        historyValues=(Array.isArray(d.history)?d.history:[]).map(Number).filter(function(v){return isFinite(v)&&v>0}).slice(-HISTORY);\n        if(readyPrice&&!historyHydrated&&historyValues.length)hydrateChartHistory(historyValues,chartNow());",
              "        historyValues=(Array.isArray(d.history)?d.history:[]).map(Number).filter(function(v){return isFinite(v)&&v>0}).slice(-HISTORY);\n        if(!candles.length&&Array.isArray(d.candleHistory))hydrateCandleHistory(d.candleHistory);\n        if(readyPrice&&!historyHydrated&&historyValues.length)hydrateChartHistory(historyValues,chartNow());",
              'candle history hydration call',
          )
          zone_path.write_text(zone)
          PY
          git diff --check
          git diff -- src/predict-routes.ts src/miniapp/predict-zone.ts
      - name: Verify scoped Predict change
        shell: bash
        run: |
          set -euo pipefail
          npm run guard:runtime
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/predict-routes.ts','src/miniapp/predict-zone.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const out = ts.transpileModule(source, {compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},reportDiagnostics:true});
            const errors = (out.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file, errors.map(d => ts.flattenDiagnosticMessageText(d.messageText, '\n')));
              process.exit(1);
            }
          }
          const zone = fs.readFileSync('src/miniapp/predict-zone.ts','utf8');
          const match = zone.match(/export const PREDICT_ZONE_SCRIPT = `([\s\S]*?)`;\s*$/);
          if (!match) throw new Error('PREDICT_ZONE_SCRIPT not found');
          const marker = '${JSON.stringify(PREDICT_ERROR_TEXTS)}';
          if ((match[1].split(marker).length - 1) !== 1) throw new Error('Unexpected PREDICT_ZONE_SCRIPT interpolation count');
          const runtime = match[1].replace(marker, '{}');
          if (runtime.includes('${')) throw new Error('Unexpected unresolved interpolation in PREDICT_ZONE_SCRIPT');
          new Function(runtime);
          NODE
          node <<'NODE'
          for (const interval of ['5m','15m','1h']) {
            const url = `https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=3`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Binance ${interval} history HTTP ${response.status}`);
            const rows = await response.json();
            if (!Array.isArray(rows) || rows.length < 2) throw new Error(`Binance ${interval} history is empty`);
            for (const row of rows) {
              if (!Array.isArray(row) || row.length < 7) throw new Error(`Binance ${interval} history schema mismatch`);
              const values = [row[0],row[1],row[2],row[3],row[4],row[6]].map(Number);
              if (!values.every(v => Number.isFinite(v) && v > 0)) throw new Error(`Binance ${interval} history contains invalid OHLC`);
            }
          }
          NODE
          python3 <<'PY'
          from pathlib import Path
          routes=Path('src/predict-routes.ts').read_text()
          zone=Path('src/miniapp/predict-zone.ts').read_text()
          checks={
            'Binance public candle endpoint': "data-api.binance.vision" in routes and "/api/v3/klines?symbol=BTCUSDT" in routes,
            'only completed bars': "closeTime >= now" in routes,
            '12 historical bars': "return history.slice(-12);" in routes,
            'same predict-round response': "candleHistory: await candleHistoryPromise" in routes,
            'client hydrates response': "hydrateCandleHistory(d.candleHistory)" in zone,
            'no synthetic candle creation': "backfill:1" in zone and "open:open,high:high,low:low,close:close" in zone,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('Failed assertions: '+', '.join(failed))
          PY
      - name: Commit scoped patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-predict-candle-history-backfill.yml
          git add src/predict-routes.ts src/miniapp/predict-zone.ts .github/workflows/_temp-predict-candle-history-backfill.yml
          git config user.name "NimaMohammadii"
          git config user.email "nima.mohammadi084@gmail.com"
          git commit -m "Backfill Predict candlestick history"
          git push origin HEAD:verify/predict-candle-history-backfill
