name: Temporary Predict candle timeframe patch

on:
  push:
    branches:
      - verify/predict-candle-timeframes-machine

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset target file to main and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- src/miniapp/predict-zone.ts
          python - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/predict-zone.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '          <button type="button" data-predict-chart-mode="candles" aria-label="Candlestick chart" aria-pressed="false" title="5-second candles from received price ticks"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3v4m0 10v4M17 3v7m0 6v5"/><rect x="4" y="7" width="6" height="10" rx="1"/><rect x="14" y="10" width="6" height="6" rx="1"/></svg></button>\n          <span data-predict-candle-note hidden>5s · feed</span>',
                  '          <button type="button" data-predict-chart-mode="candles" aria-label="Candlestick chart" aria-pressed="false" title="Candles from received price ticks"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3v4m0 10v4M17 3v7m0 6v5"/><rect x="4" y="7" width="6" height="10" rx="1"/><rect x="14" y="10" width="6" height="6" rx="1"/></svg></button>\n          <span data-predict-candle-note hidden>5m · feed</span>'
              ),
              (
                  '    var W=360,H=220,L=0,R=80,P=18,HISTORY=23,SAMPLE_MS=2800,VISUAL_SAMPLE_MS=100,CANDLE_MS=5000;',
                  '    var W=360,H=220,L=0,R=80,P=18,HISTORY=23,SAMPLE_MS=2800,VISUAL_SAMPLE_MS=100,CANDLE_VISIBLE_BARS=12;'
              ),
              (
                  "      if(isActive())draw()\n    }\n    // OHLC uses source observations only. Never use interpolated frames or invent missing bars.",
                  "      if(isActive())draw()\n    }\n    function candleIntervalMs(){if(market!=='bitcoin')return 5000;return bitcoinTimeframe==='1h'?3600000:bitcoinTimeframe==='15m'?900000:300000}\n    function candleIntervalLabel(){if(market!=='bitcoin')return '5s';return bitcoinTimeframe==='1h'?'1h':bitcoinTimeframe}\n    // OHLC uses source observations only. Never use interpolated frames or invent missing bars."
              ),
              (
                  '      var latest=0;\n      (observations||[]).forEach(function(item){',
                  '      var latest=0,interval=candleIntervalMs();\n      (observations||[]).forEach(function(item){'
              ),
              (
                  '        var bucket=Math.floor(t/CANDLE_MS)*CANDLE_MS,index=0;',
                  '        var bucket=Math.floor(t/interval)*interval,index=0;'
              ),
              (
                  '        if(candles.length&&bucket<candles[candles.length-1].time-CANDLE_MS*63)return;',
                  '        if(candles.length&&bucket<candles[candles.length-1].time-interval*63)return;'
              ),
              (
                  "      var source=market==='bitcoin'?(priceProvider==='polymarket'?(priceRtdsTopic==='crypto_prices'?'Binance':'Chainlink TWAP'):'Mark price'):'Mark price';\n      if(candleNote){var note=candles.length?'5s · '+source:'Waiting for ticks';if(candleNote.textContent!==note)candleNote.textContent=note;candleNote.title='5-second OHLC of received '+source+' prices. First or interrupted candles may be partial; missing intervals are not filled.'}\n      var right=W-R,rate=(right-L)/(HISTORY*SAMPLE_MS),width=CANDLE_MS*rate*.62,stamp=now+(candleClockOffset||0),shown=candles.filter(function(bar){var x=right-width/2-(stamp-bar.time)*rate;return x+width/2>=L&&x-width/2<=right}),prices=[];",
                  "      var source=market==='bitcoin'?(priceProvider==='polymarket'?(priceRtdsTopic==='crypto_prices'?'Binance':'Chainlink TWAP'):'Mark price'):'Mark price',interval=candleIntervalMs(),intervalLabel=candleIntervalLabel();\n      if(candleNote){var note=intervalLabel+' · '+source;if(candleNote.textContent!==note)candleNote.textContent=note;candleNote.title=intervalLabel+' OHLC of received '+source+' prices. First or interrupted candles may be partial; missing intervals are not filled.'}\n      var right=W-R,rate=(right-L)/(CANDLE_VISIBLE_BARS*interval),width=interval*rate*.62,stamp=now+(candleClockOffset||0),shown=candles.filter(function(bar){var x=right-width/2-(stamp-bar.time)*rate;return x+width/2>=L&&x-width/2<=right}),prices=[];"
              ),
          ]

          for index, (old, new) in enumerate(replacements, 1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement {index} matched {count} times, expected exactly 1')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/miniapp/predict-zone.ts
          git rm .github/workflows/_temp-predict-candle-timeframe-patch.yml
          git config user.name "Vexa Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/miniapp/predict-zone.ts
          git commit -m "Match Predict candles to selected Bitcoin timeframe"
          git push origin HEAD:verify/predict-candle-timeframes-machine
