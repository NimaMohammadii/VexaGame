name: Temporary Predict History Style

'on':
  push:
    branches:
      - fix/predict-history-match-home-tickets

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps
      - name: Match History drawer to Home My Tickets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/miniapp/predict-zone.ts')
          s=p.read_text()
          start=s.index('.predict-zone-history-drawer{')
          end_marker='.predict-zone-history-drawer .predict-zone-history-card.history-down{color:#f0c3ce!important}'
          end=s.index(end_marker,start)+len(end_marker)
          replacement=(
            ".predict-zone-history-drawer{position:fixed!important;left:0!important;right:auto!important;top:calc(120px + env(safe-area-inset-top))!important;bottom:calc(88px + env(safe-area-inset-bottom))!important;width:min(44vw,210px)!important;max-width:210px!important;z-index:99995!important;padding:24px 14px 14px!important;border:0!important;outline:0!important;border-radius:0 30px 30px 0!important;color:#fff!important;background:rgba(13,13,13,.54)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.105),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 22px rgba(255,255,255,.055),0 16px 36px rgba(0,0,0,.22)!important;backdrop-filter:blur(10px) saturate(1.12)!important;-webkit-backdrop-filter:blur(10px) saturate(1.12)!important;transform:translate3d(-104%,0,0)!important;transition:transform .36s cubic-bezier(.18,.88,.24,1)!important;display:grid!important;grid-template-rows:auto minmax(0,1fr)!important;gap:14px!important;overflow:hidden!important;box-sizing:border-box!important}.predict-zone-history-drawer.is-open{transform:translate3d(0,0,0)!important}\n"
            ".predict-zone-history-head{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important}.predict-zone-history-head strong{font-size:16px!important;font-weight:950!important;color:#fff!important}.predict-zone-history-close{width:32px!important;height:32px!important;min-width:32px!important;padding:0!important;border:0!important;outline:0!important;border-radius:13px!important;background:rgba(255,255,255,.07)!important;color:#fff!important;display:grid!important;place-items:center!important;box-shadow:none!important;font-size:18px!important;font-weight:400!important;line-height:1!important;transition:none!important;-webkit-tap-highlight-color:transparent!important}.predict-zone-history-close:active{transform:none!important}.predict-zone-history-close svg{display:none!important}.predict-zone-history-close:before{content:'×'!important;display:block!important;color:#fff!important;font-size:18px!important;font-weight:400!important;line-height:1!important}\n"
            ".predict-zone-history-drawer .predict-zone-result-strip,.predict-zone-history-drawer .predict-zone-result-strip.show{position:relative!important;width:100%!important;max-width:100%!important;min-height:0!important;height:100%!important;margin:0!important;display:block!important;overflow-y:auto!important;overflow-x:hidden!important;scrollbar-width:none!important;mask-image:none!important;-webkit-mask-image:none!important}.predict-zone-history-drawer .predict-zone-result-strip::-webkit-scrollbar{display:none!important}.predict-zone-history-drawer .predict-zone-history-track{display:grid!important;grid-template-columns:1fr!important;align-content:start!important;gap:8px!important;width:100%!important;min-width:0!important;padding:0 0 8px!important}.predict-zone-history-drawer .predict-zone-history-card{width:100%!important;min-width:0!important;height:44px!important;padding:0 10px!important;border:0!important;border-radius:18px!important;background:rgba(0,0,0,.22)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(255,255,255,.04)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;justify-content:flex-start!important;color:#fff!important;font-size:12px!important;font-weight:950!important;letter-spacing:normal!important;transform:none!important;filter:none!important}.predict-zone-history-drawer .predict-zone-history-card.history-up,.predict-zone-history-drawer .predict-zone-history-card.history-down{color:#fff!important}"
          )
          p.write_text(s[:start]+replacement+s[end:])
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/miniapp/predict-zone.ts"
      - name: Verify runtime and scope
        shell: bash
        run: |
          set -euo pipefail
          npm run guard:runtime
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const file='src/miniapp/predict-zone.ts';
          const source=fs.readFileSync(file,'utf8');
          const out=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,moduleResolution:ts.ModuleResolutionKind.Bundler},reportDiagnostics:true,fileName:file});
          const errors=(out.diagnostics||[]).filter(x=>x.category===ts.DiagnosticCategory.Error);
          if(errors.length)throw new Error(errors.map(x=>ts.flattenDiagnosticMessageText(x.messageText,'\n')).join('\n'));
          for(const token of ['background:rgba(13,13,13,.54)!important','backdrop-filter:blur(10px) saturate(1.12)!important','padding:24px 14px 14px!important','width:32px!important;height:32px!important;min-width:32px!important',"content:'×'!important",'height:44px!important;padding:0 10px!important;border:0!important;border-radius:18px!important;background:rgba(0,0,0,.22)!important']) if(!source.includes(token)) throw new Error('missing My Tickets style token: '+token);
          if(!source.includes('function renderHistory(round)')||!source.includes('function setHistoryDrawer(open)'))throw new Error('History behavior changed unexpectedly');
          NODE
      - name: Commit scoped style and remove verifier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-predict-history-style.yml
          git add src/miniapp/predict-zone.ts .github/workflows/_temp-predict-history-style.yml
          git config user.name 'NimaMohammadii'
          git config user.email 'nima.mohammadi084@gmail.com'
          git commit -m 'Match Predict History to Home My Tickets style'
          git push origin HEAD:fix/predict-history-match-home-tickets
