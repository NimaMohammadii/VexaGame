name: Apply native prompts to Wheel Crash Dice once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply native prompts to Wheel Crash Dice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch only Wheel Crash Dice amount entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Wheel: keep the existing amount input visually, but make it display-only.
          # The existing amount row opens Telegram's native JS prompt; 1/2 and 2x remain untouched.
          wheel = Path('src/miniapp/wheel/section.ts')
          text = wheel.read_text(encoding='utf-8')
          marker = "        root.querySelectorAll('[data-wheel-quick]').forEach(function(button){"
          if text.count(marker) != 1:
              raise SystemExit(f'Wheel amount binding anchor: expected 1, found {text.count(marker)}')
          helper = "        function promptWheelAmount(){if(spinning)return;var current=String(amountInput.value||'0.1'),next=null;try{next=window.prompt('Enter GRAM amount',current)}catch(e){return}if(next===null)return;var parsed=Number(String(next).trim().replace(',','.'));if(!Number.isFinite(parsed)||parsed<=0)return;amountInput.value=String(parsed)}\n        amountInput.readOnly=true;amountInput.tabIndex=-1;amountInput.style.pointerEvents='none';var amountRow=amountInput.closest&&amountInput.closest('.wheel-input-row');if(amountRow){amountRow.setAttribute('aria-haspopup','dialog');amountRow.addEventListener('click',function(ev){if(spinning)return;var button=ev.target&&ev.target.closest&&ev.target.closest('button');if(button)return;ev.preventDefault();promptWheelAmount()})}\n"
          text = text.replace(marker, helper + marker, 1)
          wheel.write_text(text, encoding='utf-8')

          # Crash: only the bet amount moves to native prompt. Auto Cash Out remains exactly as-is.
          crash = Path('src/miniapp/crash/scripts/main.ts')
          text = crash.read_text(encoding='utf-8')
          anchor = "  function doubleAmount(){var input=q('crashAmount'),value=normalizeAmount();if(input)input.value=toTon(Math.max(MIN_BET_NANO,Math.min(balance(),value*2)))}\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'Crash helper anchor: expected 1, found {text.count(anchor)}')
          helper = "  function promptCrashAmount(){var input=q('crashAmount');if(!input)return;var current=String(input.value||toTon(MIN_BET_NANO)),next=null;try{next=window.prompt('Enter GRAM amount',current)}catch(e){return}if(next===null)return;var parsed=Number(String(next).trim().replace(/,/g,'.'));if(!Number.isFinite(parsed)||parsed<=0)return;input.value=String(parsed);normalizeAmount()}\n"
          text = text.replace(anchor, anchor + helper, 1)
          old = "if(input){input.setAttribute('step','0.01');input.setAttribute('inputmode','decimal');input.addEventListener('input',function(){cleanDecimalInput(input)});input.addEventListener('change',normalizeAmount);input.addEventListener('blur',normalizeAmount)}"
          new = "if(input){input.setAttribute('step','0.01');input.setAttribute('inputmode','decimal');input.readOnly=true;input.tabIndex=-1;input.style.pointerEvents='none';var amountCard=input.closest&&input.closest('.crash-bet-main');if(amountCard){amountCard.setAttribute('aria-haspopup','dialog');amountCard.addEventListener('click',function(ev){ev.preventDefault();promptCrashAmount()})}}"
          if text.count(old) != 1:
              raise SystemExit(f'Crash direct amount editor: expected 1, found {text.count(old)}')
          text = text.replace(old, new, 1)
          crash.write_text(text, encoding='utf-8')

          # Dice: delete the old floating editor UI, focus/scroll helpers and input listeners.
          dice = Path('src/miniapp/dice/base-section.ts')
          text = dice.read_text(encoding='utf-8')

          # Remove the dead editor CSS while preserving the main amount button and roll button styles.
          css_start = "  `!important;border-color:rgba(255,255,255,.20)!important}.dice-bet-editor{"
          start = text.find(css_start)
          if start < 0 or text.find(css_start, start + 1) >= 0:
              raise SystemExit('Dice editor CSS start anchor missing or duplicated')
          roll_start = text.find('.dice-roll-button{height:62px', start)
          if roll_start < 0:
              raise SystemExit('Dice roll style anchor missing after editor CSS')
          text = text[:start] + "  `!important;border-color:rgba(255,255,255,.20)!important}" + text[roll_start:]

          # Remove the floating editor markup entirely.
          markup_start = "  `<div class=\"dice-hidden-roll\" data-dice-profit>0.98</div></div><div class=\"dice-bet-editor\" data-dice-bet-editor>"
          start = text.find(markup_start)
          if start < 0 or text.find(markup_start, start + 1) >= 0:
              raise SystemExit('Dice editor markup start anchor missing or duplicated')
          script_start = text.find('<script>(function()', start)
          if script_start < 0:
              raise SystemExit('Dice script anchor missing after editor markup')
          text = text[:start] + "  `<div class=\"dice-hidden-roll\" data-dice-profit>0.98</div></div>" + text[script_start:]

          old_vars = "  `betInputOpen=root.querySelector('[data-dice-bet-input-open]'),betHalfBtn=root.querySelector('[data-dice-bet-half]')`,\n  `,betDoubleBtn=root.querySelector('[data-dice-bet-double]'),betEditor=root.querySelector('[data-dice-bet-editor]'),`,\n  `betInput=root.querySelector('[data-dice-bet-input]'),betDone=root.querySelector('[data-dice-bet-done]');`,\n"
          new_vars = "  `betInputOpen=root.querySelector('[data-dice-bet-input-open]'),betHalfBtn=root.querySelector('[data-dice-bet-half]')`,\n  `,betDoubleBtn=root.querySelector('[data-dice-bet-double]');`,\n"
          if text.count(old_vars) != 1:
              raise SystemExit(f'Dice editor vars: expected 1, found {text.count(old_vars)}')
          text = text.replace(old_vars, new_vars, 1)

          old_set_line = "  `betInputOpen.textContent=money(bet);if(betInput)betInput.value=String(money(bet));render()}function openBetEditor()`,\n"
          new_set_line = "  `betInputOpen.textContent=money(bet);render()}function promptBetAmount(){if(rolling)return;var current=String(money(bet)),next=null;try{next=window.prompt('Enter point amount',current)}catch(e){return}if(next===null)return;var parsed=Number(String(next).trim().replace(',','.'));if(!Number.isFinite(parsed)||parsed<=0)return;setBet(parsed);haptic('selection')}function ac()`,\n"
          if text.count(old_set_line) != 1:
              raise SystemExit(f'Dice setBet/editor anchor: expected 1, found {text.count(old_set_line)}')
          text = text.replace(old_set_line, new_set_line, 1)

          helper_start = "  `{if(rolling)return;var sy=window.scrollY||document.documentElement.scrollTop||0;if(betEditor)`,\n"
          start = text.find(helper_start)
          if start < 0 or text.find(helper_start, start + 1) >= 0:
              raise SystemExit('Dice old editor helper start missing or duplicated')
          helper_end_marker = "function ac()`,\n"
          end_anchor = text.find(helper_end_marker, start)
          if end_anchor < 0:
              raise SystemExit('Dice old editor helper end missing')
          end = end_anchor + len(helper_end_marker)
          text = text[:start] + text[end:]

          old_handlers = "  `if(betInputOpen)betInputOpen.onclick=openBetEditor;if(betDone)betDone.onclick=function(){closeBetEditor(true)};`,\n  `if(betInput){betInput.addEventListener('input',function(){var s=String(betInput.value||'').trim();if(!s)return;`,\n  `bet=cleanBet(s);render()});betInput.addEventListener('keydown',function(e){if(e.key==='Enter')closeBetEditor(true)}`,\n  `)}if(betEditor)betEditor.addEventListener('click',function(e){if(e.target===betEditor)closeBetEditor(true)});`,\n"
          new_handlers = "  `if(betInputOpen)betInputOpen.onclick=promptBetAmount;`,\n"
          if text.count(old_handlers) != 1:
              raise SystemExit(f'Dice old editor handlers: expected 1, found {text.count(old_handlers)}')
          text = text.replace(old_handlers, new_handlers, 1)
          dice.write_text(text, encoding='utf-8')
          PY

      - name: Validate exact scope and native prompt paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          w = Path('src/miniapp/wheel/section.ts').read_text(encoding='utf-8')
          for expected in ["window.prompt('Enter GRAM amount',current)", "amountInput.style.pointerEvents='none'", "amountInput.closest('.wheel-input-row')"]:
              if expected not in w:
                  raise SystemExit('Wheel validation missing: '+expected)
          if w.count("window.prompt('Enter GRAM amount',current)") != 1:
              raise SystemExit('Wheel native prompt duplicated')

          c = Path('src/miniapp/crash/scripts/main.ts').read_text(encoding='utf-8')
          for expected in ["window.prompt('Enter GRAM amount',current)", "input.style.pointerEvents='none'", "input.closest('.crash-bet-main')"]:
              if expected not in c:
                  raise SystemExit('Crash validation missing: '+expected)
          for forbidden in ["input.addEventListener('input',function(){cleanDecimalInput(input)})", "input.addEventListener('change',normalizeAmount)", "input.addEventListener('blur',normalizeAmount)"]:
              if forbidden in c:
                  raise SystemExit('Crash old direct amount path remains: '+forbidden)
          if "auto.addEventListener('input',function(){cleanDecimalInput(auto)})" not in c or "auto.addEventListener('change',normalizeAutoCashout)" not in c:
              raise SystemExit('Crash Auto Cash Out path changed unexpectedly')
          if c.count("window.prompt('Enter GRAM amount',current)") != 1:
              raise SystemExit('Crash native prompt duplicated')

          d = Path('src/miniapp/dice/base-section.ts').read_text(encoding='utf-8')
          for forbidden in ['data-dice-bet-editor','data-dice-bet-input type','data-dice-bet-done','openBetEditor','closeBetEditor','betEditor','betDone','betInput=','.dice-bet-editor{','.dice-bet-input{','.dice-bet-done{','window.scrollTo(0,sy)']:
              if forbidden in d:
                  raise SystemExit('Dice old editor path remains: '+forbidden)
          if "betInputOpen.onclick=promptBetAmount" not in d:
              raise SystemExit('Dice prompt click binding missing')
          if d.count("window.prompt('Enter point amount',current)") != 1:
              raise SystemExit('Dice native prompt missing or duplicated')
          PY

          node - <<'NODE'
          const fs=require('fs');

          const crash=fs.readFileSync('src/miniapp/crash/scripts/main.ts','utf8');
          const crashMatch=crash.match(/=\s*`([\s\S]*)`;\s*$/);
          if(!crashMatch) throw new Error('Crash script template missing');
          new Function(crashMatch[1]);

          const wheel=fs.readFileSync('src/miniapp/wheel/section.ts','utf8');
          const wheelScript=wheel.match(/<script>([\s\S]*?)<\/script>/);
          if(!wheelScript) throw new Error('Wheel inline script missing');
          new Function(wheelScript[1]);

          const diceSource=fs.readFileSync('src/miniapp/dice/base-section.ts','utf8');
          const diceExpr=diceSource.match(/export const DICE_SECTION = ([\s\S]*?\.join\(''\));\s*$/);
          if(!diceExpr) throw new Error('Dice section expression missing');
          const diceSection=Function('return '+diceExpr[1])();
          const diceScript=diceSection.match(/<script>([\s\S]*?)<\/script><\/section>$/);
          if(!diceScript) throw new Error('Dice emitted script missing');
          new Function(diceScript[1]);
          if(diceSection.includes('data-dice-bet-editor')||diceSection.includes('data-dice-bet-input')||diceSection.includes('data-dice-bet-done')) throw new Error('Dice emitted old editor remains');
          NODE

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/miniapp/crash/scripts/main.ts src/miniapp/dice/base-section.ts src/miniapp/wheel/section.ts | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit scoped game amount fixes and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Vexa Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/_wheel-crash-dice-native-prompt-once.yml
          git add src/miniapp/wheel/section.ts src/miniapp/crash/scripts/main.ts src/miniapp/dice/base-section.ts
          staged="$(git diff --cached --name-only | sort)"
          allowed="$(printf '%s\n' .github/workflows/_wheel-crash-dice-native-prompt-once.yml src/miniapp/crash/scripts/main.ts src/miniapp/dice/base-section.ts src/miniapp/wheel/section.ts | sort)"
          if [ "$staged" != "$allowed" ]; then
            echo 'Unexpected staged files:'
            printf '%s\n' "$staged"
            exit 1
          fi
          git commit -m 'Use native prompts for Wheel Crash Dice amounts'
          git push origin HEAD:main
