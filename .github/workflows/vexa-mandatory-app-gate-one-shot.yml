name: Vexa mandatory app gate one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vexa-mandatory-app-gate-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mandatory app gate fix
        run: |
          python3 scripts/patch-mandatory-channel-app-gate.py
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -qx 'src/mandatory-channel.ts'
          printf '%s\n' "$changed" | grep -qx 'src/index-with-plinko-live.ts'
          printf '%s\n' "$changed" | grep -qx 'src/miniapp/mandatory-channel-gate.ts'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify no new TypeScript errors
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          code=$?
          set -e
          cat /tmp/typecheck.log
          if [ "$code" -ne 0 ]; then
            unexpected="$(grep -E '^src/.*error TS' /tmp/typecheck.log | grep -Ev '^src/(plinko-live\.ts|ton-deposits\.ts|ton-withdrawals\.ts)' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected TypeScript errors:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
          fi

      - name: Verify runtime architecture
        run: npm run guard:runtime

      - name: Commit fix
        run: |
          git config user.name 'NimaMohammadii'
          git config user.email 'nima.mohammadi084@gmail.com'
          git add src/mandatory-channel.ts src/index-with-plinko-live.ts src/miniapp/mandatory-channel-gate.ts
          git commit -m 'Make mandatory app membership gate fail closed'
          git push origin main
