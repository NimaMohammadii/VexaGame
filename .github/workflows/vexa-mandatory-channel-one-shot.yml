name: Vexa mandatory channel membership one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vexa-mandatory-channel-one-shot.yml'

permissions:
  contents: write

jobs:
  wire-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire mandatory channel feature
        run: |
          python3 scripts/patch-mandatory-channel.py
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          printf '%s\n' "$changed" | grep -qx 'src/index-with-plinko-live.ts'
          printf '%s\n' "$changed" | grep -qx 'src/miniapp/shell.ts'
          printf '%s\n' "$changed" | grep -qx 'src/telegram-game-bot.ts'
          printf '%s\n' "$changed" | grep -qx 'src/telegram-section-access-admin.ts'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify no new TypeScript errors
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          code=$?
          set -e
          cat /tmp/typecheck.log
          if [ "$code" -ne 0 ]; then
            unexpected="$(grep -E '^src/.*error TS' /tmp/typecheck.log | grep -Ev '^src/(plinko-live\.ts|ton-deposits\.ts|ton-withdrawals\.ts)' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected TypeScript errors:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
            grep -q '^src/plinko-live\.ts.*error TS' /tmp/typecheck.log
            grep -q '^src/ton-deposits\.ts.*error TS' /tmp/typecheck.log
            grep -q '^src/ton-withdrawals\.ts.*error TS' /tmp/typecheck.log
          fi

      - name: Verify runtime architecture
        run: npm run guard:runtime

      - name: Commit feature wiring
        run: |
          git config user.name 'NimaMohammadii'
          git config user.email 'nima.mohammadi084@gmail.com'
          git add src/index-with-plinko-live.ts src/miniapp/shell.ts src/telegram-game-bot.ts src/telegram-section-access-admin.ts
          git commit -m 'Enforce mandatory channel membership'
          git push origin main
