name: Vexa mandatory gate final fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vexa-mandatory-gate-diagnostic.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact Mini App gate fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/miniapp/mandatory-channel-gate.ts')
          source = path.read_text()
          old = r"try{if(tg&&typeof tg.openTelegramLink==='function'&&/^https:\/\/t\.me\//i.test(url)){tg.openTelegramLink(url);return}}catch(e){}"
          new = "try{if(tg&&typeof tg.openTelegramLink==='function'&&url.indexOf('https://t.me/')===0){tg.openTelegramLink(url);return}}catch(e){}"
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one broken Telegram URL regex, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only | sed '/^$/d' | wc -l)" -eq 1
          git diff --name-only | grep -qx 'src/miniapp/mandatory-channel-gate.ts'

      - name: Install test dependencies
        run: |
          npm install --no-package-lock --legacy-peer-deps
          npm install --no-save --no-package-lock --legacy-peer-deps jsdom@24

      - name: Compile gate module
        run: |
          rm -rf /tmp/gatebuild
          npx tsc src/mandatory-channel.ts src/miniapp/mandatory-channel-gate.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --lib ES2022,DOM \
            --types @cloudflare/workers-types \
            --skipLibCheck \
            --rootDir src \
            --outDir /tmp/gatebuild

      - name: Validate generated script and locked card
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { JSDOM } = require('jsdom');
          const gate = require('/tmp/gatebuild/miniapp/mandatory-channel-gate.js');
          new Function(gate.MANDATORY_CHANNEL_GATE_SCRIPT);
          const dom = new JSDOM('<!doctype html><html><body></body></html>', { url: 'https://vexa.games/app', runScripts: 'outside-only', pretendToBeVisual: true });
          dom.window.Telegram = { WebApp: { initData: 'query_id=test&user=%7B%22id%22%3A123%7D&auth_date=1&hash=test', initDataUnsafe: { user: { id: 123, language_code: 'en' } }, openTelegramLink() {} } };
          dom.window.fetch = async () => ({ ok: true, json: async () => ({ ok: true, required: true, joined: false, verificationError: false, channel: { title: 'Vexa Test', username: 'VexaTest', joinUrl: 'https://t.me/VexaTest' } }) });
          (async () => {
            dom.window.eval(gate.MANDATORY_CHANNEL_GATE_SCRIPT);
            dom.window.document.dispatchEvent(new dom.window.Event('DOMContentLoaded'));
            await new Promise(resolve => setTimeout(resolve, 80));
            assert.ok(dom.window.document.getElementById('vexaMandatoryChannelPanel'));
            assert.ok(dom.window.document.body.classList.contains('vexa-mandatory-channel-locked'));
            console.log('GATE_RUNTIME_OK');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit only the gate fix
        run: |
          git config user.name 'NimaMohammadii'
          git config user.email 'nima.mohammadi084@gmail.com'
          git add src/miniapp/mandatory-channel-gate.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qx 'src/miniapp/mandatory-channel-gate.ts'
          git commit -m 'Fix mandatory channel Mini App gate runtime syntax'
          git push origin main
