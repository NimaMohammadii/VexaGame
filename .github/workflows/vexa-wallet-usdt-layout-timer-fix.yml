name: Vexa wallet USDT layout timer one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vexa-wallet-usdt-layout-timer-fix.yml'

permissions:
  contents: write

jobs:
  patch-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch wallet USDT layout and timer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/miniapp/wallet.ts')
          s=p.read_text()
          old="function parseServerTime(value){if(typeof value==='number'&&Number.isFinite(value)&&value>0)return value>1000000000000?value:value*1000;var text=String(value||'').trim();if(!text)return 0;if(/^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}(?:\\.\\d+)?$/.test(text))text=text.replace(' ','T')+'Z';var ms=Date.parse(text);return Number.isFinite(ms)?ms:0}"
          new="function parseServerTime(value){if(typeof value==='number'&&Number.isFinite(value)&&value>0)return value>1000000000000?value:value*1000;var text=String(value||'').trim();if(!text)return 0;if(text.length>=19&&text.charAt(4)==='-'&&text.charAt(7)==='-'&&text.charAt(10)===' '&&text.charAt(13)===':'&&text.charAt(16)===':')text=text.replace(' ','T')+'Z';var ms=Date.parse(text);return Number.isFinite(ms)?ms:0}"
          if old not in s: raise SystemExit('parseServerTime target not found')
          s=s.replace(old,new,1)
          old="body.wallet-open.deposit-open #depositSheet.deposit-sheet.deposit-usdt-mode.open .deposit-panel{height:min(560px,calc(100vh - 12px))!important;max-height:min(560px,calc(100vh - 12px))!important;overflow:auto!important}"
          new="body.wallet-open.deposit-open #depositSheet.deposit-sheet.deposit-usdt-mode.open .deposit-panel{height:min(560px,calc(100vh - 12px))!important;max-height:min(560px,calc(100vh - 12px))!important;overflow:hidden!important}"
          if old not in s: raise SystemExit('USDT panel overflow target not found')
          s=s.replace(old,new,1)
          old=".usdt-quote{display:none!important;padding:2px 2px 8px!important;box-sizing:border-box!important}"
          new=".usdt-quote{display:none!important;padding:0 2px 6px!important;margin-top:-12px!important;box-sizing:border-box!important}"
          if old not in s: raise SystemExit('USDT quote position target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate focused diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "src/miniapp/wallet.ts"
          grep -F "overflow:hidden!important" src/miniapp/wallet.ts >/dev/null
          grep -F "margin-top:-12px!important" src/miniapp/wallet.ts >/dev/null
          grep -F "text.charAt(10)===' '" src/miniapp/wallet.ts >/dev/null
      - name: Commit wallet fix
        shell: bash
        run: |
          git config user.name "NimaMohammadii"
          git config user.email "nima.mohammadi084@gmail.com"
          git add src/miniapp/wallet.ts
          git commit -m "Fix USDT quote timer and layout"
          git push origin HEAD:main
