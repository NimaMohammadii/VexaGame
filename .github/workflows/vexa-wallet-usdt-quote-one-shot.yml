name: Vexa wallet USDT quote one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vexa-wallet-usdt-quote-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch USDT deposit quote UI only
        run: python3 .github/scripts/vexa-wallet-usdt-quote-patch.py
      - name: Validate wallet syntax and diff
        shell: bash
        run: |
          git diff --check
          cp src/miniapp/wallet.ts /tmp/wallet.mjs
          node --check /tmp/wallet.mjs
          python3 <<'PY'
          from pathlib import Path
          s=Path('src/miniapp/wallet.ts').read_text()
          a=s.index("const USDT_DEPOSIT_SCRIPT = `")+len("const USDT_DEPOSIT_SCRIPT = `")
          b=s.index("`;\n\nexport const DEPOSIT_ENHANCEMENTS_SCRIPT",a)
          Path('/tmp/usdt-runtime.js').write_text(s[a:b])
          PY
          node --check /tmp/usdt-runtime.js
      - name: Commit wallet change
        shell: bash
        run: |
          test -n "$(git diff -- src/miniapp/wallet.ts)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/miniapp/wallet.ts
          git commit -m 'Refine generated USDT deposit screen'
          git push origin HEAD:main
