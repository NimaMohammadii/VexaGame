name: Vexa wallet USDT quote one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vexa-wallet-usdt-quote-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch USDT deposit quote UI only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/wallet.ts')
          s = path.read_text()

          usdt_start = s.index("const USDT_DEPOSIT_SCRIPT = `")
          usdt_end = s.index("\nexport const DEPOSIT_ENHANCEMENTS_SCRIPT", usdt_start)
          block = s[usdt_start:usdt_end]

          # Keep the existing path and logic, only change this USDT UI block.
          color_map = {
              '#ff4b78': '#a13a59',
              'rgba(255,49,103,.12)': 'rgba(111,24,50,.24)',
              'rgba(255,75,120,.24)': 'rgba(145,48,78,.34)',
              '#ff3d73': '#8f2948',
              'rgba(255,45,102,.065)': 'rgba(112,24,50,.12)',
              'rgba(255,45,102,.075)': 'rgba(112,24,50,.14)',
              '#ff315f': '#7c203d',
              'rgba(88,8,36,.22)': 'rgba(54,10,27,.36)',
          }
          for old, new in color_map.items():
              block = block.replace(old, new)

          block = block.replace(
              "  var lastVerifyAt=0;\n  var tg=window.Telegram&&window.Telegram.WebApp;",
              "  var lastVerifyAt=0;\n  var DEPOSIT_TTL_MS=15*60*1000;\n  var quoteTimer=0;\n  var quoteCreatedAt=0;\n  var quoteDepositId='';\n  var expiryVerifiedId='';\n  var tg=window.Telegram&&window.Telegram.WebApp;",
              1,
          )

          def replace_between(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          timer_block = r'''  function parseServerTime(value){if(typeof value==='number'&&Number.isFinite(value)&&value>0)return value>1000000000000?value:value*1000;var text=String(value||'').trim();if(!text)return 0;if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?$/.test(text))text=text.replace(' ','T')+'Z';var ms=Date.parse(text);return Number.isFinite(ms)?ms:0}
  function depositCreatedAt(deposit){var parsed=parseServerTime(deposit&&deposit.createdAt);if(parsed)return parsed;var existing=pendingItem();if(existing&&String(existing.id||'')===String(deposit&&deposit.id||'')){var stored=Number(existing.createdAt);if(Number.isFinite(stored)&&stored>0)return stored}return Date.now()}
  function savePending(deposit){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({id:String(deposit.id||''),userId:ownerId(),network:String(deposit.network||''),amount:String(deposit.requestedAmountUsdt||''),createdAt:depositCreatedAt(deposit)}))}catch(e){}}
  function clearPending(){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}}
  function stopQuoteTimer(reset){if(quoteTimer){clearInterval(quoteTimer);quoteTimer=0}if(reset){quoteCreatedAt=0;quoteDepositId='';expiryVerifiedId=''}}
  function syncQuoteTimer(){var timer=q('usdtQuoteTimer');var screen=q('usdtDepositScreen');if(!timer||!screen||!screen.classList.contains('has-quote')||!quoteCreatedAt)return;var remaining=Math.max(0,quoteCreatedAt+DEPOSIT_TTL_MS-Date.now());var seconds=remaining>0?Math.ceil(remaining/1000):0;var minutes=Math.floor(seconds/60);var secs=seconds%60;timer.textContent=String(minutes).padStart(2,'0')+':'+String(secs).padStart(2,'0');timer.classList.toggle('expired',remaining<=0);if(remaining<=0){stopQuoteTimer(false);status('Deposit expired. Checking status…','error');var id=String(screen.getAttribute('data-deposit-id')||'');if(id&&expiryVerifiedId!==id){expiryVerifiedId=id;setTimeout(function(){verifyDeposit(id,true)},0)}}}
  function startQuoteTimer(deposit){var id=String(deposit&&deposit.id||'');if(quoteDepositId!==id)expiryVerifiedId='';quoteDepositId=id;quoteCreatedAt=depositCreatedAt(deposit);stopQuoteTimer(false);syncQuoteTimer();if(quoteCreatedAt+DEPOSIT_TTL_MS>Date.now())quoteTimer=setInterval(syncQuoteTimer,1000)}
'''
          block = replace_between(block, "  function savePending(deposit){", "  function status(", timer_block)

          old_quote_css = '.usdt-quote{display:none!important}.usdt-deposit-screen.has-quote .usdt-create{display:none!important}.usdt-deposit-screen.has-quote .usdt-quote{display:block!important}.usdt-quote-amount{text-align:center!important;margin:0 0 10px!important}.usdt-quote-amount small{display:block!important;color:rgba(255,255,255,.48)!important;font-size:10px!important;font-weight:800!important;text-transform:uppercase!important;letter-spacing:.08em!important}.usdt-quote-amount strong{display:block!important;margin-top:4px!important;color:#fff!important;font-size:25px!important;font-weight:950!important;letter-spacing:-.045em!important;font-variant-numeric:tabular-nums!important}.usdt-quote-amount span{display:block!important;margin-top:3px!important;color:rgba(255,255,255,.55)!important;font-size:11px!important;font-weight:760!important}.usdt-address-box{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important;align-items:center!important;padding:10px 10px 10px 12px!important;border-radius:17px!important;background:rgba(0,0,0,.20)!important;box-shadow:none!important;border:1px solid rgba(255,255,255,.06)!important}.usdt-address-text{min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;color:rgba(255,255,255,.84)!important;font-size:11px!important;font-weight:760!important;font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important}.usdt-copy-button{height:34px!important;padding:0 12px!important;border:1px solid rgba(255,255,255,.07)!important;border-radius:12px!important;background:rgba(255,255,255,.055)!important;color:#fff!important;font-size:10px!important;font-weight:850!important;box-shadow:none!important}.usdt-quote-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;margin-top:8px!important}.usdt-note{margin:9px auto 0!important;max-width:330px!important;text-align:center!important;color:rgba(255,255,255,.48)!important;font-size:10px!important;font-weight:700!important;line-height:1.35!important}'
          new_quote_css = '.usdt-quote{display:none!important;padding:2px 2px 8px!important;box-sizing:border-box!important}.usdt-deposit-screen.has-quote .usdt-create{display:none!important}.usdt-deposit-screen.has-quote .usdt-quote{display:block!important}.usdt-quote-head{display:grid!important;grid-template-columns:52px minmax(0,1fr)!important;gap:12px!important;align-items:center!important;margin:0 0 11px!important}.usdt-quote-head .usdt-head-icon{width:50px!important;height:50px!important;border-radius:17px!important;color:#a13a59!important;background:rgba(111,24,50,.24)!important;border:1px solid rgba(145,48,78,.34)!important}.usdt-quote-head .usdt-head-copy strong{font-size:22px!important}.usdt-quote-head .usdt-head-copy>span{margin-top:5px!important;font-size:10.5px!important}.usdt-quote-network-card{height:58px!important;display:grid!important;grid-template-columns:38px minmax(0,1fr) 20px!important;gap:9px!important;align-items:center!important;padding:0 12px!important;border:1px solid rgba(255,255,255,.07)!important;border-radius:17px!important;background:rgba(8,8,10,.58)!important;box-shadow:none!important}.usdt-quote-network-card .usdt-network-svg{width:36px!important;height:36px!important}.usdt-quote-network-copy{min-width:0!important}.usdt-quote-network-copy strong{display:block!important;color:#fff!important;font-size:12.5px!important;font-weight:760!important;line-height:1!important}.usdt-quote-network-copy span{display:block!important;margin-top:4px!important;color:rgba(255,255,255,.40)!important;font-size:9px!important;font-weight:560!important}.usdt-quote-network-mark{width:19px!important;height:19px!important;border-radius:50%!important;display:grid!important;place-items:center!important;background:#8f2948!important;color:#fff!important;font-size:10px!important;font-weight:800!important}.usdt-send-card{margin-top:9px!important;padding:12px 12px 11px!important;border:1px solid rgba(143,41,72,.62)!important;border-radius:18px!important;background:rgba(39,10,21,.48)!important;box-shadow:none!important;text-align:center!important}.usdt-send-label{display:block!important;color:rgba(255,255,255,.48)!important;font-size:10px!important;font-weight:620!important}.usdt-send-main{margin-top:4px!important;display:grid!important;grid-template-columns:minmax(0,1fr) 40px!important;grid-template-areas:"amount copy" "gram copy"!important;column-gap:8px!important;align-items:center!important}.usdt-send-main strong{grid-area:amount!important;color:#fff!important;font-size:26px!important;font-weight:820!important;letter-spacing:-.035em!important;font-variant-numeric:tabular-nums!important}.usdt-send-main strong em{font:inherit!important;font-style:normal!important;color:#a13a59!important}.usdt-send-main>span{grid-area:gram!important;margin-top:2px!important;color:rgba(255,255,255,.54)!important;font-size:10.5px!important;font-weight:620!important}.usdt-amount-copy{grid-area:copy!important;width:38px!important;height:38px!important;border:1px solid rgba(145,48,78,.34)!important;border-radius:13px!important;background:rgba(111,24,50,.24)!important;color:#b44868!important;display:grid!important;place-items:center!important;padding:0!important;box-shadow:none!important}.usdt-amount-copy svg{width:18px!important;height:18px!important}.usdt-address-card{margin-top:9px!important;padding:9px 10px 10px!important;border:1px solid rgba(255,255,255,.065)!important;border-radius:17px!important;background:rgba(255,255,255,.025)!important;box-shadow:none!important}.usdt-address-card small{display:block!important;margin:0 0 7px!important;color:rgba(255,255,255,.42)!important;font-size:9px!important;font-weight:620!important}.usdt-address-row{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important;align-items:center!important}.usdt-address-text{min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;color:rgba(255,255,255,.82)!important;font-size:10.5px!important;font-weight:650!important;font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important}.usdt-copy-button{height:34px!important;padding:0 11px!important;border:1px solid rgba(145,48,78,.34)!important;border-radius:12px!important;background:rgba(111,24,50,.24)!important;color:#d7a0b1!important;font-size:10px!important;font-weight:700!important;box-shadow:none!important;display:inline-flex!important;align-items:center!important;gap:5px!important}.usdt-copy-button svg{width:15px!important;height:15px!important}.usdt-quote-actions{display:grid!important;grid-template-columns:1fr!important;gap:0!important;margin-top:9px!important}.usdt-check-button{height:44px!important;margin:0!important;border:1px solid rgba(255,255,255,.07)!important;border-radius:15px!important;background:rgba(255,255,255,.045)!important;color:#fff!important;font-size:12px!important;font-weight:720!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;box-shadow:none!important}.usdt-check-button svg{width:18px!important;height:18px!important}.usdt-note{margin:9px 0 0!important;padding:8px 9px!important;border:1px solid rgba(255,255,255,.055)!important;border-radius:14px!important;background:rgba(255,255,255,.02)!important;color:rgba(255,255,255,.42)!important;font-size:9.5px!important;font-weight:560!important;line-height:1.3!important;display:grid!important;grid-template-columns:18px minmax(0,1fr)!important;gap:7px!important;align-items:center!important;text-align:left!important}.usdt-note svg{width:17px!important;height:17px!important;color:rgba(255,255,255,.55)!important}.usdt-waiting-card{margin-top:9px!important;min-height:58px!important;padding:8px 9px!important;border:1px solid rgba(143,41,72,.44)!important;border-radius:17px!important;background:rgba(82,17,39,.28)!important;display:grid!important;grid-template-columns:34px minmax(0,1fr) 48px!important;gap:8px!important;align-items:center!important;box-sizing:border-box!important}.usdt-waiting-icon{width:32px!important;height:32px!important;border-radius:11px!important;display:grid!important;place-items:center!important;background:rgba(111,24,50,.26)!important;color:#b44868!important}.usdt-waiting-icon svg{width:18px!important;height:18px!important}.usdt-waiting-copy{min-width:0!important}.usdt-waiting-copy strong{display:block!important;color:#d7a0b1!important;font-size:10.5px!important;font-weight:720!important;line-height:1.05!important}.usdt-waiting-copy span{display:block!important;margin-top:4px!important;color:rgba(255,255,255,.42)!important;font-size:9px!important;font-weight:540!important}.usdt-quote-timer{width:44px!important;height:44px!important;border:1px solid #8f2948!important;border-radius:50%!important;display:grid!important;place-items:center!important;color:#fff!important;font-size:9.5px!important;font-weight:700!important;font-variant-numeric:tabular-nums!important;background:rgba(22,8,13,.62)!important;box-shadow:none!important}.usdt-quote-timer.expired{color:#d7a0b1!important;border-color:#a13a59!important}'
          if old_quote_css not in block:
              raise SystemExit('old quote CSS not found')
          block = block.replace(old_quote_css, new_quote_css, 1)

          ensure_screen = r'''  function ensureScreen(){installStyles();var s=sheet();if(!s)return null;var screen=q('usdtDepositScreen');if(screen)return screen;var pad=s.querySelector('.deposit-panel .pad');if(!pad)return null;screen=document.createElement('div');screen.id='usdtDepositScreen';screen.className='usdt-deposit-screen';screen.innerHTML='<div class="usdt-create"><div class="usdt-deposit-head"><span class="usdt-head-icon">'+walletIcon()+'</span><span class="usdt-head-copy"><strong>Deposit <em>USDT</em></strong><span>Choose the network and amount. Vexa will generate the exact amount to send.</span></span></div><div class="usdt-network-grid"><button class="usdt-network-button" type="button" data-action="select-usdt-network" data-network="bep20"><span class="usdt-network-logo">'+tetherIcon()+'</span><span class="usdt-network-copy"><strong>BEP20</strong><span>BNB Smart Chain</span></span><span class="usdt-network-check" aria-hidden="true">✓</span></button><button class="usdt-network-button" type="button" data-action="select-usdt-network" data-network="trc20"><span class="usdt-network-logo">'+tronIcon()+'</span><span class="usdt-network-copy"><strong>TRC20</strong><span>Tron Network</span></span><span class="usdt-network-check" aria-hidden="true">✓</span></button></div><div class="usdt-amount-field"><span class="usdt-amount-logo">'+tetherIcon()+'</span><input id="usdtAmountInput" type="text" inputmode="decimal" autocomplete="off" placeholder="10.00" value="10.00"><span class="usdt-amount-unit">USDT</span></div><div class="usdt-presets"><button class="usdt-preset selected" type="button" data-action="set-usdt-preset" data-value="10">10</button><button class="usdt-preset" type="button" data-action="set-usdt-preset" data-value="20">20</button><button class="usdt-preset" type="button" data-action="set-usdt-preset" data-value="50">50</button><button class="usdt-preset" type="button" data-action="set-usdt-preset" data-value="100">100</button></div><button id="usdtCreateDeposit" class="usdt-primary usdt-create-button" type="button" data-action="create-usdt-deposit"><span class="usdt-primary-bolt">'+boltIcon()+'</span><span>Create Deposit</span><span class="usdt-primary-arrow">'+arrowIcon()+'</span></button><div class="usdt-security"><span class="usdt-security-icon">'+shieldIcon()+'</span><span class="usdt-security-copy"><strong>Secure &amp; Encrypted</strong><span>Your deposit is protected and processed automatically.</span></span></div></div><div class="usdt-quote"><div class="usdt-quote-head"><span class="usdt-head-icon">'+walletIcon()+'</span><span class="usdt-head-copy"><strong>Deposit <em>USDT</em></strong><span>Send exactly the amount below to the address.</span></span></div><div class="usdt-quote-network-card"><span id="usdtQuoteNetworkIcon" class="usdt-network-logo">'+tetherIcon()+'</span><span class="usdt-quote-network-copy"><strong id="usdtQuoteNetworkName">BEP20</strong><span id="usdtQuoteNetworkChain">BNB Smart Chain</span></span><span class="usdt-quote-network-mark" aria-hidden="true">✓</span></div><div class="usdt-send-card"><span class="usdt-send-label">Send Exactly</span><div class="usdt-send-main"><strong id="usdtQuoteAmount">—</strong><span id="usdtQuoteGram">—</span><button class="usdt-amount-copy" type="button" data-action="copy-usdt-amount" aria-label="Copy amount"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="8" width="9" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M6 15V7a2 2 0 0 1 2-2h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div></div><div class="usdt-address-card"><small>Deposit Address</small><div class="usdt-address-row"><span id="usdtQuoteAddress" class="usdt-address-text">—</span><button class="usdt-copy-button" type="button" data-action="copy-usdt-address"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="8" width="9" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M6 15V7a2 2 0 0 1 2-2h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Copy</span></button></div></div><div class="usdt-quote-actions"><button id="usdtCheckPayment" class="usdt-primary usdt-check-button" type="button" data-action="check-usdt-payment"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5" stroke="currentColor" stroke-width="1.9"/><path d="m15 15 4 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Check Payment</span></button></div><div class="usdt-note"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="currentColor" opacity=".24"/><path d="M12 8v5M12 16.5v.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Send only USDT on the selected network and send the exact amount shown.</span></div><div class="usdt-waiting-card"><span class="usdt-waiting-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4.5l3 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="usdt-waiting-copy"><strong>Waiting for your transfer.</strong><span>Valid for 15 minutes.</span></span><span id="usdtQuoteTimer" class="usdt-quote-timer">15:00</span></div></div><p id="usdtDepositStatus" class="usdt-deposit-status"></p>';var methods=s.querySelector('.deposit-method-screen');if(methods&&methods.parentNode)methods.insertAdjacentElement('afterend',screen);else pad.appendChild(screen);return screen}
'''
          block = replace_between(block, "  function ensureScreen(){", "  function selectNetwork(", ensure_screen)

          show_create = "  function showCreate(){var screen=ensureScreen();if(!screen)return;stopQuoteTimer(true);screen.classList.remove('has-quote');screen.removeAttribute('data-deposit-id');screen.removeAttribute('data-exact-amount');status('');setBusy(false)}\n"
          block = replace_between(block, "  function showCreate(){", "  function renderDeposit(", show_create)

          render_deposit = r'''  function renderDeposit(deposit){var screen=ensureScreen();if(!screen)return;var state=String(deposit&&deposit.status||'pending').toLowerCase();var input=q('usdtAmountInput');if(input&&deposit&&deposit.requestedAmountUsdt)input.value=normalizeAmount(deposit.requestedAmountUsdt);if(deposit&&deposit.network)selectNetwork(String(deposit.network).toLowerCase());if(state==='completed'){stopQuoteTimer(true);clearPending();screen.classList.remove('has-quote');screen.removeAttribute('data-deposit-id');screen.removeAttribute('data-exact-amount');status('Payment received. Balance updated.','success');if(window.VexaShowPaymentDone)window.VexaShowPaymentDone();if(window.VexaTonBalance&&window.VexaTonBalance.load)window.VexaTonBalance.load();if(window.VexaLevel&&window.VexaLevel.load)window.VexaLevel.load();return}if(state==='expired'){stopQuoteTimer(true);clearPending();screen.classList.remove('has-quote');screen.removeAttribute('data-deposit-id');screen.removeAttribute('data-exact-amount');status('Deposit expired. Create a new deposit.','error');return}if(state!=='pending'&&state!=='crediting'){stopQuoteTimer(true);clearPending();screen.classList.remove('has-quote');screen.removeAttribute('data-deposit-id');screen.removeAttribute('data-exact-amount');status('Deposit is no longer active. Create a new deposit.','error');return}savePending(deposit);screen.classList.add('has-quote');var amount=q('usdtQuoteAmount');var gram=q('usdtQuoteGram');var address=q('usdtQuoteAddress');var networkName=q('usdtQuoteNetworkName');var networkChain=q('usdtQuoteNetworkChain');var networkIcon=q('usdtQuoteNetworkIcon');var networkId=String(deposit.network||'').toLowerCase();if(amount)amount.innerHTML=String(deposit.expectedAmountUsdt||'')+' <em>USDT</em>';if(gram)gram.textContent='≈ '+formatGram(deposit.amountNano);if(address){address.textContent=String(deposit.treasuryAddress||'');address.setAttribute('data-full-address',String(deposit.treasuryAddress||''))}if(networkName)networkName.textContent=String(deposit.networkLabel||'').toUpperCase();if(networkChain)networkChain.textContent=networkId==='trc20'?'Tron Network':'BNB Smart Chain';if(networkIcon)networkIcon.innerHTML=networkId==='trc20'?tronIcon():tetherIcon();screen.setAttribute('data-deposit-id',String(deposit.id||''));screen.setAttribute('data-exact-amount',String(deposit.expectedAmountUsdt||''));status('','');startQuoteTimer(deposit)}
'''
          block = replace_between(block, "  function renderDeposit(deposit){", "  async function loadPending(", render_deposit)

          leave_usdt = "  function leaveUsdt(){stopQuoteTimer(true);var s=sheet();if(s)s.classList.remove('deposit-usdt-mode');selectedNetwork='';var screen=q('usdtDepositScreen');if(screen)screen.classList.remove('has-quote');status('');setBusy(false)}\n"
          block = replace_between(block, "  function leaveUsdt(){", "  async function createDeposit(", leave_usdt)

          bind_start = block.index("  function bind(){")
          bind_end = block.index("\n  if(document.readyState==='loading')", bind_start)
          bind_old = block[bind_start:bind_end]
